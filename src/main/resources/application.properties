spring.application.name=ilkwangTech

spring.config.import=application-db.properties

spring.servlet.multipart.max-file-size=50MB

spring.servlet.multipart.max-request-size=100MB

spring.output.ansi.enabled=always

file.chatFileLocation=/messenger/files

server.servlet.session.persistent=false

file.uploadBaseLocation=/usr/local/tomcat/upload/

file.profileImgLocation=/images/profileImg

mybatis.type-aliases-package=com.itwillbs.ilkwangtech.sales.dto,com.itwillbs.ilkwangtech.item.dto

mybatis.configuration.map-underscore-to-camel-case=true

mybatis.mapper-locations=classpath:mapper/**/*.xml

mybatis.type-handlers-package=com.itwillbs.ilkwangtech.sales.constant,com.itwillbs.ilkwangtech.item.constant

logging.level.org.apache.ibatis=DEBUG
logging.level.java.sql.PreparedStatement=TRACE
logging.level.com.itwillbs.ilkwangtech.sales=DEBUG   