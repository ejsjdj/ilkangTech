<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 재설정 - 일광건조 ERP</title>
    <style>
        :root {
            --color-bg: #f3f6fb;
            --color-card: #ffffff;
            --color-border: #dde5f0;
            --color-primary: #2563eb;
            --color-text-main: #111827;
            --color-text-sub: #6b7280;
            --color-danger: #dc2626;
            --radius-md: 10px;
            --font-main: -apple-system, BlinkMacSystemFont, "Noto Sans KR", system-ui, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-main);
            background: #edf2fb;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: var(--color-card);
            padding: 40px;
            border-radius: var(--radius-md);
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.12);
            width: 100%;
            max-width: 400px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            margin: 0;
            color: var(--color-primary);
        }

        .header p {
            font-size: 14px;
            color: var(--color-text-sub);
            margin-top: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--color-border);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: var(--color-primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        .footer {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }

        .footer a {
            color: var(--color-primary);
            text-decoration: none;
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-error {
            background: #fee2e2;
            color: var(--color-danger);
            border: 1px solid #fecaca;
        }

        .alert-success {
            background: #dcfce7;
            color: #166534;
            border: 1px solid #bbf7d0;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>비밀번호 재설정</h1>
            <p>본인 확인을 위해 아래 정보를 입력해주세요.</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <form th:action="@{/account/forgotPassword}" method="post">
            <div class="form-group">
                <label class="form-label">사원번호</label>
                <input type="text" name="employeeNumber" class="form-control" placeholder="사원번호를 입력하세요" required>
            </div>
            <div class="form-group">
                <label class="form-label">이름</label>
                <input type="text" name="name" class="form-control" placeholder="이름을 입력하세요" required>
            </div>
            <div class="form-group">
                <label class="form-label">이메일</label>
                <input type="email" name="email" class="form-control" placeholder="가입 시 등록한 이메일" required>
            </div>
            <div class="form-group">
                <label class="form-label">새 비밀번호</label>
                <input type="password" name="newPassword" class="form-control" placeholder="새로운 비밀번호를 입력하세요" required>
            </div>
            <button type="submit" class="btn">비밀번호 변경하기</button>
        </form>

        <div class="footer">
            <a th:href="@{/account/login}">로그인 페이지로 돌아가기</a>
        </div>
    </div>
</body>
</html>
