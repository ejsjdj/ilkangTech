<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사원 목록</title>

    <!-- Bootstrap / Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f4f6fb;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #333;
        }

        /**
         * 레이아웃의 header, sidebar 등을 제외한
         * "컨텐츠 영역"만 화면 높이에서 고정 높이로 잡고, 그 안에서만 스크롤되도록 처리
         */
        .content-root {
            /* layout/layout.html에서 content 들어가는 영역 전체를 한 번 감싼다고 가정 */
            height: calc(100vh - 80px); /* header 높이(예: 80px) 만큼 빼줌, 필요하면 숫자 조정 */
            overflow: hidden;           /* 바깥쪽은 스크롤 막고 */
            display: flex;
            flex-direction: column;
        }

        .container-wrapper {
            flex: 1;                    /* 남은 영역을 전부 사용 */
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px 20px 20px;
            overflow: hidden;           /* 여기서는 직접 스크롤 안 쓰고 */
            display: flex;
            flex-direction: column;
        }

        /**
         * 실제 스크롤이 발생하는 영역
         * 헤더 / 검색영역은 고정, 테이블 + 페이지네이션만 스크롤 내리며 보이도록
         */
        .scroll-area {
            flex: 1;
            overflow-y: auto;   /* 세로 스크롤은 여기서만 */
            overflow-x: hidden;
            padding-bottom: 8px;
        }

        /* 페이지 헤더 */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 16px;
        }

        .page-header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1f2933;
            margin-bottom: 4px;
        }

        .page-subtitle {
            font-size: 13px;
            color: #9aa5b1;
        }

        /* 검색 및 필터 영역 (스크롤 상단에 고정되도록 header 바로 아래) */
        .search-filter-area {
            background: #ffffff;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 12px;
            box-shadow: 0 4px 8px rgba(15, 23, 42, 0.03);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .dropdown-toggle {
            padding: 8px 12px;
            border: 1px solid #e1e7f0;
            background: #ffffff;
            border-radius: 8px;
            font-size: 13px;
            color: #4b5563;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dropdown-toggle:hover {
            border-color: #667eea;
            background: #f5f7ff;
        }

        .search-box {
            position: relative;
            flex: 1 1 260px;
            max-width: 360px;
        }

        .search-box input {
            width: 100%;
            padding: 8px 12px 8px 30px;
            border: 1px solid #e1e7f0;
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.15s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .search-box input::placeholder {
            color: #9aa5b1;
        }

        .search-box .search-icon {
            position: absolute;
            top: 50%;
            left: 9px;
            transform: translateY(-50%);
            font-size: 13px;
            color: #9aa5b1;
        }

        .btn-search,
        .btn-reset {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid transparent;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        .btn-search {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(102, 126, 234, 0.35);
        }

        .btn-search:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(102, 126, 234, 0.4);
        }

        .btn-reset {
            background-color: #ffffff;
            border-color: #e1e7f0;
            color: #6b7280;
        }

        .btn-reset:hover {
            background-color: #f3f4f6;
        }

        /* 테이블 카드 래퍼 (스크롤 영역 안에서) */
        .table-wrapper {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 6px 14px rgba(15, 23, 42, 0.04);
            overflow-x: auto;   /* 가로 스크롤 허용 */
            overflow-y: hidden;
            margin-bottom: 8px;
        }

        /* 테이블 */
        .table {
            margin: 0;
            border-collapse: collapse;
            min-width: 1100px;
            width: 100%;
        }

        .emp-table thead {
            background-color: #f8fafc;
            border-bottom: 1px solid #e5e7eb;
        }

        .emp-table thead th {
            padding: 12px 12px;
            font-weight: 600;
            font-size: 13px;
            color: #4b5563;
            border: none;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        .emp-table thead th:hover {
            background-color: #edf2ff;
        }

        .emp-table thead th .sort-indicator {
            margin-left: 4px;
            font-size: 11px;
            color: #9aa5b1;
        }

        .emp-table tbody td {
            padding: 11px 12px;
            border-bottom: 1px solid #edf2f7;
            font-size: 13px;
            color: #374151;
            vertical-align: middle;
            white-space: nowrap;
        }

        .emp-table tbody tr:hover {
            background-color: #f9fafb;
        }

        .col-empno {
            font-weight: 600;
            color: #2563eb;
            width: 110px;
        }

        .col-status {
            width: 110px;
        }

        .col-actions {
            width: 110px;
            text-align: right;
        }

        /* 상태 배지 */
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            min-width: 64px;
            text-align: center;
        }

        .status-active {
            background-color: #e6f4ea;
            color: #166534;
        }

        .status-inactive {
            background-color: #fee2e2;
            color: #b91c1c;
        }

        .status-leave {
            background-color: #e0f2fe;
            color: #075985;
        }

        .status-unknown {
            background-color: #f3f4f6;
            color: #4b5563;
        }

        /* 액션 버튼 */
        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 500;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .action-view {
            background-color: #eff6ff;
            color: #1d4ed8;
        }

        .action-view:hover {
            background-color: #dbeafe;
            text-decoration: none;
            color: #1d4ed8;
        }

        /* 사원 등록 버튼 */
        .btn-add {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn-add:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(102, 126, 234, 0.4);
            color: white;
        }

        /* 빈 상태 */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #9aa5b1;
        }

        .empty-state i {
            font-size: 40px;
            color: #e5e7eb;
            margin-bottom: 8px;
        }

        /* 페이지네이션 (항상 테이블 바로 아래, 스크롤 영역 안에서 보이도록) */
        .pagination-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px 10px 12px;
            background: white;
            border-top: 1px solid #edf2f7;
            overflow-x: auto;
        }

        .pagination {
            display: flex;
            gap: 4px;
            margin: 0;
            list-style: none;
            flex-wrap: wrap;
            justify-content: center;
        }

        .pagination li {
            list-style: none;
        }

        .pagination a,
        .pagination span {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 30px;
            height: 30px;
            border: 1px solid #e5e7eb;
            border-radius: 999px;
            font-size: 12px;
            color: #6b7280;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.15s ease;
            padding: 0 8px;
        }

        .pagination a:hover {
            border-color: #667eea;
            color: #4f46e5;
            background-color: #eef2ff;
        }

        .pagination .active span {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .pagination .disabled span {
            color: #d1d5db;
            cursor: not-allowed;
            background-color: #f9fafb;
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .content-root {
                height: calc(100vh - 70px); /* 모바일에서 header 조금 줄었다고 가정 */
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .search-filter-area {
                flex-direction: column;
                align-items: stretch;
            }

            .dropdown-toggle,
            .btn-search,
            .btn-reset {
                width: 100%;
                justify-content: center;
            }

            .col-actions {
                text-align: left;
            }

            .table {
                min-width: 900px;
            }
        }
    </style>
</head>

<body>
<!-- layout/layout.html에서 content를 감싸는 쪽에 적용한다는 느낌으로 -->
<th:block layout:fragment="content">
    <div class="content-root">
        <div id="container-wrapper" class="container-wrapper">

            <!-- 페이지 헤더 -->
            <div class="page-header">
                <div>
                    <h1>사원 목록</h1>
                    <p class="page-subtitle">사원 정보 조회 및 관리</p>
                </div>
                <a href="/account/register" class="btn-add">
                    <i class="bi bi-plus-circle"></i> 사원 등록
                </a>
            </div>

            <!-- 검색 + 테이블 + 페이지네이션을 감싸는 스크롤 영역 -->
            <div class="scroll-area">
                <!-- 검색 및 필터 영역 -->
                <div class="search-filter-area">
                    <div class="dropdown">
                        <button class="dropdown-toggle" type="button">
                            <i class="bi bi-building"></i> 부서 전체
                            <i class="bi bi-chevron-down ms-1"></i>
                        </button>
                        <!-- 실제 부서 선택 드롭다운은 추후 구현 -->
                    </div>

                    <div class="search-box">
                        <i class="bi bi-search search-icon"></i>
                        <input type="text" id="searchInput" placeholder="성명 / 부서 / 직급 / 이메일 검색">
                    </div>

                    <button class="btn-search" onclick="handleSearch()">
                        검색
                    </button>
                    <button class="btn-reset" onclick="resetSearch()">
                        초기화
                    </button>
                </div>

                <!-- 테이블 영역 -->
                <div id="tableContainer" class="table-wrapper">
                    <!-- JS로 테이블 + 페이지네이션 렌더링 -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS / jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        let currentState = {
            pageNum: 0,
            searchField: '',
            sortBy: 'id',
            direction: 'DESC'
        };

        function handleSearch() {
            const searchField = document.getElementById('searchInput').value;
            getEmployeeList(0, searchField, currentState.sortBy, currentState.direction);
        }

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            getEmployeeList(0, '', currentState.sortBy, currentState.direction);
        }

        function getEmployeeList(pageNum = 0, searchField = '', sortBy = 'id', direction = 'DESC') {
            currentState = {pageNum, searchField, sortBy, direction};

            $.ajax({
                url: '/account/getList',
                type: 'GET',
                data: {
                    page: pageNum,
                    searchField: searchField,
                    sortBy: sortBy,
                    direction: direction
                },
                success: function (response) {
                    renderEmployeeTable(response);
                },
                error: function () {
                    const container = document.getElementById('tableContainer');
                    container.innerHTML =
                        '<div class="empty-state">' +
                        '<i class="bi bi-exclamation-circle"></i>' +
                        '<p>사원 목록을 불러오는 중 오류가 발생했습니다.</p>' +
                        '</div>';
                }
            });
        }

        function getStatusBadge(status) {
            if (!status) return '<span class="status-badge status-unknown">미지정</span>';

            switch (status) {
                case 'ACTIVE':
                case '재직':
                    return '<span class="status-badge status-active">재직</span>';
                case 'INACTIVE':
                case '퇴사':
                    return '<span class="status-badge status-inactive">퇴사</span>';
                case 'LEAVE':
                case '휴직':
                    return '<span class="status-badge status-leave">휴직</span>';
                default:
                    return '<span class="status-badge status-unknown">' + status + '</span>';
            }
        }

        function getSortIndicator(column) {
            if (currentState.sortBy !== column) return '';
            return currentState.direction === 'ASC'
                ? '<span class="sort-indicator">&uarr;</span>'
                : '<span class="sort-indicator">&darr;</span>';
        }

        function renderEmployeeTable(pageData) {
            let tableHtml =
                '<table class="table emp-table">' +
                '<thead>' +
                '<tr>' +
                '<th class="col-empno" onclick="goToPageBySortBy(\'employeeNumber\')">사원번호 ' + getSortIndicator('employeeNumber') + '</th>' +
                '<th onclick="goToPageBySortBy(\'name\')">성명 ' + getSortIndicator('name') + '</th>' +
                '<th onclick="goToPageBySortBy(\'department\')">부서 ' + getSortIndicator('department') + '</th>' +
                '<th onclick="goToPageBySortBy(\'position\')">직급 ' + getSortIndicator('position') + '</th>' +
                '<th class="col-status" onclick="goToPageBySortBy(\'status\')">상태 ' + getSortIndicator('status') + '</th>' +
                '<th onclick="goToPageBySortBy(\'phoneNumber\')">전화번호 ' + getSortIndicator('phoneNumber') + '</th>' +
                '<th onclick="goToPageBySortBy(\'email\')">Email ' + getSortIndicator('email') + '</th>' +
                '<th class="col-actions">작업</th>' +
                '</tr>' +
                '</thead>' +
                '<tbody>';

            if (!pageData || !pageData.content || pageData.content.length === 0) {
                tableHtml +=
                    '<tr>' +
                    '<td colspan="8">' +
                    '<div class="empty-state">' +
                    '<i class="bi bi-people"></i>' +
                    '<p>조회된 사원 정보가 없습니다.</p>' +
                    '</div>' +
                    '</td>' +
                    '</tr>';
            } else {
                pageData.content.forEach(emp => {
                    tableHtml += '<tr>' +
                        '<td class="col-empno">' + (emp.employeeNumber || '-') + '</td>' +
                        '<td>' + (emp.name || '-') + '</td>' +
                        '<td>' + (emp.department || '-') + '</td>' +
                        '<td>' + (emp.position || '-') + '</td>' +
                        '<td class="col-status">' + getStatusBadge(emp.status) + '</td>' +
                        '<td>' + (emp.phoneNumber || '-') + '</td>' +
                        '<td>' + (emp.email || '-') + '</td>' +
                        '<td class="col-actions">' +
                        '<a href="/account/detail/' + emp.id + '" class="action-btn action-view">' +
                        '<i class="bi bi-eye"></i> 상세' +
                        '</a>' +
                        '</td>' +
                        '</tr>';
                });
            }

            tableHtml += '</tbody></table>';

            // 페이지네이션
            let paginationHtml =
                '<div class="pagination-wrapper">' +
                '<ul class="pagination">';

            if (pageData && pageData.number > 0) {
                paginationHtml += '<li><a href="#" onclick="goToPageByPageNum(' + (pageData.number - 1) + '); return false;"><i class="bi bi-chevron-left"></i></a></li>';
            } else {
                paginationHtml += '<li class="disabled"><span><i class="bi bi-chevron-left"></i></span></li>';
            }

            if (pageData && pageData.totalPages > 0) {
                for (let i = 0; i < pageData.totalPages; i++) {
                    if (i === pageData.number) {
                        paginationHtml += '<li class="active"><span>' + (i + 1) + '</span></li>';
                    } else {
                        paginationHtml += '<li><a href="#" onclick="goToPageByPageNum(' + i + '); return false;">' + (i + 1) + '</a></li>';
                    }
                }
            }

            if (pageData && pageData.number < pageData.totalPages - 1) {
                paginationHtml += '<li><a href="#" onclick="goToPageByPageNum(' + (pageData.number + 1) + '); return false;"><i class="bi bi-chevron-right"></i></a></li>';
            } else {
                paginationHtml += '<li class="disabled"><span><i class="bi bi-chevron-right"></i></span></li>';
            }

            paginationHtml += '</ul></div>';
            tableHtml += paginationHtml;

            document.getElementById('tableContainer').innerHTML = tableHtml;
        }

        // 페이지 변경
        function goToPageByPageNum(pageNum) {
            getEmployeeList(pageNum, currentState.searchField, currentState.sortBy, currentState.direction);
        }

        // 정렬 키워드 변경
        function goToPageBySortBy(sortBy) {
            if (currentState.sortBy === sortBy) {
                currentState.direction = currentState.direction === 'DESC' ? 'ASC' : 'DESC';
            } else {
                currentState.sortBy = sortBy;
                currentState.direction = 'ASC';
            }
            getEmployeeList(currentState.pageNum, currentState.searchField, sortBy, currentState.direction);
        }

        // 초기 로드
        $(document).ready(function () {
            getEmployeeList(0, "", 'id', 'ASC');
        });
    </script>
</th:block>
</body>
</html>
