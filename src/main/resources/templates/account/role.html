<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>권한 관리</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f7;
        }
        h1 {
            font-weight: 600;
        }
        .card {
            border-radius: 0.75rem;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
        }
        .card-header {
            border-bottom: none;
            background-color: transparent;
            padding-bottom: 0;
        }
        .table {
            margin-bottom: 0;
        }
        .table thead th {
            white-space: nowrap;
            background-color: #f8fafc;
        }
        .badge-role {
            font-size: 0.75rem;
        }
    </style>
</head>
<body>

<div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">권한 관리</h1>
        <span class="text-muted">ERP · 시스템 설정</span>
    </div>

    <!-- 1. 기준 권한 선택 -->
    <section class="card mb-4">
        <div class="card-body">
            <h2 class="h5 mb-3">1. 기준 권한 선택</h2>

            <div class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label for="roleSelect" class="form-label">권한 선택</label>
                    <select id="roleSelect" class="form-select">
                        <option value="">권한을 선택하세요</option>
                        <option th:each="r : ${roles}"
                                th:value="${r.id}"
                                th:text="${r.commonCodeName}">
                        </option>
                    </select>
                </div>

                <div class="col-md-3">
                    <button type="button"
                            class="btn btn-primary w-100"
                            onclick="loadMembersByRole()">
                        선택한 권한의 직원 조회
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- 2. 선택된 권한을 가진 직원 목록 (회수) -->
    <section class="card mb-4">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h2 class="h5 mb-0">2. 선택한 권한을 가진 직원</h2>
                    <small class="text-muted" id="selectedRoleLabel"></small>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>사원번호</th>
                        <th>이름</th>
                        <th>부서</th>
                        <th>직급</th>
                        <th>권한</th>
                        <th class="text-center">권한 회수</th>
                    </tr>
                    </thead>
                    <tbody id="memberTableBody">
                    <tr th:each="emp : ${memberRoleViews}"
                        th:data-member-id="${emp.memberId}"
                        th:data-role-id="${emp.roleId}">
                        <td th:text="${emp.employeeNumber}">15-20005</td>
                        <td th:text="${emp.name}">홍길동</td>
                        <td th:text="${emp.department}">부서</td>
                        <td th:text="${emp.position}">직급</td>
                        <td>
                            <span class="badge bg-secondary badge-role"
                                  th:text="${emp.description}">
                                ROLE_USER
                            </span>
                        </td>
                        <td class="text-center">
                            <button type="button"
                                    class="btn btn-sm btn-outline-danger">
                                회수
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- 3. 다른 직원에게 권한 부여 -->
    <section class="card">
        <div class="card-body">
            <h2 class="h5 mb-3">3. 다른 직원에게 권한 부여</h2>

            <div class="row g-3 align-items-end">
                <div class="col-md-5">
                    <label for="memberSelect" class="form-label">직원 선택</label>
                    <select id="memberSelect" class="form-select">
                        <option value="">직원을 선택하세요</option>
                        <option th:each="m : ${assignableMembers}"
                                th:value="${m.id}"
                                th:text="${m.name + ' (' + m.employeeNumber + ')'}">
                        </option>
                    </select>
                </div>

                <div class="col-md-3">
                    <button type="button"
                            class="btn btn-success w-100"
                            onclick="grantRoleToMember()">
                        선택한 직원에게 권한 부여
                    </button>
                </div>
            </div>
        </div>
    </section>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    async function loadMembersByRole() {
        const select = document.getElementById('roleSelect');
        const roleId = select.value;
        const roleName = select.selectedOptions[0]?.textContent || '';

        if (!roleId) {
            alert('권한을 선택하세요.');
            return;
        }

        // 선택한 권한 이름 표시
        const label = document.getElementById('selectedRoleLabel');
        label.textContent = roleName ? `현재 권한: ${roleName}` : '';

        const res = await fetch('/account/findMemberByRole?roleId=' + roleId);

        if (!res.ok) {
            alert('직원 목록을 불러오는데 실패했습니다.');
            return;
        }

        const memberRoleViews = await res.json();

        const tbody = document.getElementById('memberTableBody');
        tbody.innerHTML = '';

        if (memberRoleViews.length === 0) {
            const tr = document.createElement('tr');
            const td = document.createElement('td');
            td.colSpan = 6;
            td.className = 'text-center text-muted';
            td.textContent = '이 권한을 가진 직원이 없습니다.';
            tr.appendChild(td);
            tbody.appendChild(tr);
            return;
        }

        memberRoleViews.forEach(emp => {
            const tr = document.createElement('tr');

            const tdEmpNo = document.createElement('td');
            tdEmpNo.textContent = emp.employeeNumber;

            const tdName = document.createElement('td');
            tdName.textContent = emp.name;

            const tdDept = document.createElement('td');
            tdDept.textContent = emp.department;

            const tdPos = document.createElement('td');
            tdPos.textContent = emp.position;

            const tdDesc = document.createElement('td');
            const badge = document.createElement('span');
            badge.className = 'badge bg-secondary badge-role';
            badge.textContent = emp.description;
            tdDesc.appendChild(badge);

            const tdAction = document.createElement('td');
            tdAction.className = 'text-center';
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn btn-sm btn-outline-danger';
            btn.textContent = '회수';
            btn.onclick = () => revokeRoleFromMember(emp.memberId);
            tdAction.appendChild(btn);

            tr.appendChild(tdEmpNo);
            tr.appendChild(tdName);
            tr.appendChild(tdDept);
            tr.appendChild(tdPos);
            tr.appendChild(tdDesc);
            tr.appendChild(tdAction);

            tbody.appendChild(tr);
        });
    }

    function revokeRoleFromMember(memberId) {
        const roleId = document.getElementById('roleSelect').value;

        if (!roleId) {
            alert('먼저 기준 권한을 선택하세요.');
            return;
        }

        if (!confirm('이 직원에게서 권한을 회수하시겠습니까?')) {
            return;
        }

        // TODO: fetch('/account/role/revoke', { ... })
    }

    function grantRoleToMember() {
        const roleId = document.getElementById('roleSelect').value;
        const memberId = document.getElementById('memberSelect').value;

        if (!roleId) {
            alert('먼저 기준 권한을 선택하세요.');
            return;
        }
        if (!memberId) {
            alert('권한을 부여할 직원을 선택하세요.');
            return;
        }

        // TODO: fetch('/account/role/grant', { ... })
    }
</script>

</body>
</html>
