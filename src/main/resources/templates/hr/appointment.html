<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>발령 관리</title>
    <th:block layout:fragment="style">
        <link rel="stylesheet" th:href="@{/css/appointmentList.css}">
    </th:block>
</head>

<body layout:fragment="content">
<div class="content-root">
    <div class="container-wrapper">

        <div class="page-header">
            <div class="header-title-area">
                <div class="header-icon-bar"></div>
                <div>
                    <h1>발령 현황</h1>
                    <p class="page-subtitle">사원 발령 이력 조회 및 등록</p>
                </div>
            </div>
            <a href="/hr/appointment/register" class="btn-add">
                <i class="bi bi-person-plus-fill"></i> 발령 등록
            </a>
        </div>

        <div class="scroll-area">
            <div class="search-filter-area">
                <div class="dropdown">
                    <button class="dropdown-toggle" type="button" id="deptFilterBtn">
                        <i class="bi bi-building"></i> 부서 전체
                        <i class="bi bi-chevron-down ms-1"></i>
                    </button>
                </div>

                <div class="search-box">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" id="searchInput" placeholder="사번 / 성명 / 발령구분 검색">
                </div>

                <button class="btn-search" onclick="handleSearch()">검색</button>
                <button class="btn-reset" onclick="resetSearch()">초기화</button>
            </div>

            <div id="tableContainer" class="table-wrapper">
                <div class="loading-state" style="padding: 50px; text-align: center;">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2">데이터를 불러오는 중입니다...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/js/appointmentList.js}"></script>
</body>
</html>
