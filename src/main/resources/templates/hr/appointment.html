<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>인사발령 관리</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        h2 {
            margin-bottom: 10px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f5f5f5;
        }
        .form-group {
            margin-bottom: 10px;
        }
        label {
            display: inline-block;
            width: 100px;
        }
        input, select {
            padding: 5px;
            width: 200px;
        }
        button {
            margin-top: 10px;
            padding: 6px 15px;
        }
    </style>
</head>
<body>

<h2>인사발령 등록</h2>

<form>
    <div class="form-group">
        <label>사번</label>
        <input type="text" placeholder="EMP001">
    </div>

    <div class="form-group">
        <label>이름</label>
        <input type="text" placeholder="홍길동">
    </div>

    <div class="form-group">
        <label>이전 부서</label>
        <input type="text" placeholder="개발팀">
    </div>

    <div class="form-group">
        <label>발령 부서</label>
        <input type="text" placeholder="기획팀">
    </div>

    <div class="form-group">
        <label>직급</label>
        <select>
            <option>사원</option>
            <option>대리</option>
            <option>과장</option>
            <option>차장</option>
            <option>부장</option>
        </select>
    </div>

    <div class="form-group">
        <label>발령일</label>
        <input type="date">
    </div>

    <button type="submit">등록</button>
</form>

<hr>

<h2>인사발령 목록</h2>

<table>
    <thead>
    <tr>
        <th>사번</th>
        <th>이름</th>
        <th>이전 부서</th>
        <th>발령 부서</th>
        <th>직급</th>
        <th>발령일</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td>EMP001</td>
        <td>홍길동</td>
        <td>개발팀</td>
        <td>기획팀</td>
        <td>대리</td>
        <td>2026-01-01</td>
    </tr>
    </tbody>
</table>

</body>
</html>
