<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}"
      lang="ko">
<head>
    <meta charset="UTF-8">
    <title>사원 신규 등록</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <title>발령 등록</title>

    <th:block layout:fragment="style">
        <link rel="stylesheet" th:href="@{/css/appointmentRegist.css}">
    </th:block>
</head>
<body>
<th:block layout:fragment="content">
    <div class="register-container">
        <!-- 페이지 헤더 -->
        <div class="page-header">
            <div class="header-title-area">
                <div class="header-icon-bar"></div>
                <div>
                    <h1>신규 발령 등록 및 수정</h1>
                    <p class="page-subtitle">인사 변동을 등록하고 관리합니다.</p>
                </div>
            </div>
        </div>

        <form id="registerForm" action="/account/register" method="post">
            <div class="form-grid-main">
                <!-- 부서 변경 -->
                <div class="form-column">
                    <div class="form-card">
                        <div class="form-section">
                            <div class="section-header">
                                <h2 class="section-title"><i class="bi bi-person-vcard"></i> 직원 선택 </h2>
                                <p class="section-desc">발령 대상자를 클릭하여 선택하세요</p>
                            </div>

                            <div class="search-box-mini">
                                <input type="text" id="searchInput" class="form-control-sm" placeholder="이름 검색..." onkeyup="handleSearch()">
                            </div>

                            <div id="tableContainer" class="employee-list-scroll">
                            </div>

                            <input type="hidden" name="memberId" id="selectedMemberId" required>
                            <div id="selectedEmployeeDisplay" class="selected-viewer">
                                선택된 직원 없음
                            </div>
                        </div>
                    </div>

                    <!-- 푸터 (왼쪽 컬럼 하단 배치) -->
                    <div class="form-group form-row-full">
                        <p class="field-hint">※ 결재권자의 승인 없이 이루어진 발령은 근로기준법에 따라 해고 및 처벌될 수 있습니다. ※</p>
                    </div>
                    <div class="form-footer" style="margin-top: 0; border-top: none; padding-top: 0; justify-content: flex-start;">
                        <button type="submit" class="btn-submit" onclick="registAppointment()">
                            <i class="bi bi-person-check-fill"></i> 발령 등록
                        </button>
                        <button type="button" class="btn-cancel" onclick="location.href='/account/list'">취소</button>
                    </div>
                </div>

                <!-- 직급 변경 -->
                <div class="form-column">
                    <!-- 소속 및 직급 설정 -->
                    <div class="form-card">
                        <div class="form-section">
                            <div class="section-header">
                                <h2 class="section-title"><i class="bi bi-building-gear"></i> 소속 및 직위 변동</h2>
                                <p class="section-desc">전보/전출/전직/승진/강등</p>
                            </div>
                            <div class="form-grid">

                                <div class="form-group">
                                    <label class="form-label">현재 부서 <span class="required-mark">*</span></label>
                                    <input type="text" name="currentDept" id="currentDeptDisplay" class="form-control" placeholder="현재 직급" disabled>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">변동 후 부서 <span class="required-mark">*</span></label>
                                    <select name="department" class="form-select" required>
                                        <option value="">부서 선택</option>
                                        <option th:each="dept : ${departments}" th:value="${dept.id}"
                                                th:text="${dept.departmentName}"></option>
                                    </select>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">현재 직급 <span class="required-mark">*</span></label>
                                    <input type="text" name="currentRank" id="currentRankDisplay" class="form-control" placeholder="현재 직급" disabled>
                                </div>

                                <div class="form-group">
                                    <label class="form-label">변동 후 직급 <span class="required-mark">*</span></label>
                                    <select name="position" class="form-select" required>
                                        <option value="">직급 선택</option>
                                        <option th:each="pos : ${positions}" th:value="${pos.id}" th:text="${pos.positionName}"></option>
                                    </select>
                                </div>

                            </div>
                        </div>
                    </div>

                    <!-- 근무상태 변경 (오른쪽 하단으로 이동) -->
                    <div class="form-card">
                        <div class="form-section">
                            <div class="section-header">
                                <h2 class="section-title"><i class="bi bi-bank"></i> 직무 변동</h2>
                                <p class="section-desc">재직/휴직/복직</p>
                            </div>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label class="form-label">현재 근무상태 <span class="required-mark">*</span></label>
                                    <input type="text" name="accountNumber" id="currentStatusDisplay" class="form-control" placeholder="현재 근무 상태" disabled>
                                </div>
                                <div class="form-group">
                                    <label class="form-label">변동 후 근무상태 <span class="required-mark">*</span></label>
                                    <select name="bank" class="form-select" required>
                                        <option value="">근무상태 선택</option>
                                        <option th:each="bank : ${banks}" th:value="${bank.id}" th:text="${bank.bankName}"></option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script th:src="@{/js/appointmentRegist.js}"></script>
</th:block>
</body>
</html>
