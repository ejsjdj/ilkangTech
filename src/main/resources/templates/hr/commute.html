<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
  <title>출퇴근 관리</title>
  <th:block layout:fragment="style">
    <link rel="stylesheet" th:href="@{/css/appointmentList.css}">
    <style>
      /* 탭 메뉴 스타일 */
      .tab-container { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 2px solid #f0f0f0; }
      .tab-item { padding: 10px 5px; cursor: pointer; color: #666; font-weight: 500; position: relative; }
      .tab-item.active { color: #4f46e5; }
      .tab-item.active::after { content: ''; position: absolute; bottom: -2px; left: 0; width: 100%; height: 2px; background: #4f46e5; }

      /* 출퇴근 전용 상태 뱃지 */
      .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
      .status-normal { background: #e0f2fe; color: #0369a1; } /* 정상 */
      .status-late { background: #fee2e2; color: #dc2626; }   /* 지각/결근 */
    </style>
  </th:block>
</head>

<body layout:fragment="content">
<div class="content-root">
  <div class="container-wrapper">

    <div class="page-header">
      <div class="header-title-area">
        <div class="header-icon-bar"></div>
        <div>
          <h1>출퇴근 현황</h1>
          <p class="page-subtitle">출퇴근 기록 및 근무 시간 확인</p>
        </div>
      </div>
    </div>

    <div class="tab-container">
      <div class="tab-item active" onclick="switchTab('MY')">내 출퇴근 관리</div>
      <div class="tab-item" onclick="switchTab('ALL')">전사원 출퇴근 관리</div>
    </div>

    <div class="scroll-area">
      <div class="search-filter-area">
        <div class="dropdown" id="deptFilterContainer" style="display: none;">
          <select class="form-select" name="department" required>
            <option th:each="dept : ${departments}" th:text="${dept.departmentName}"
                    th:value="${dept.id}"></option>
          </select>
        </div>

        <div class="dropdown">
          <input type="date" id="dateFilter" class="form-control-sm" style="border:1px solid #ddd; border-radius:4px; padding:5px;">
        </div>

        <div class="search-box" id="memberSearchBox" style="display:none;">
          <i class="bi bi-search search-icon"></i>
          <input type="text" id="searchInput" placeholder="사원명 또는 부서 검색">
        </div>

        <button class="btn-search" onclick="loadAttendanceData()">조회</button>
      </div>

      <div id="tableContainer" class="table-wrapper">
        <table class="custom-table">
          <thead>
          <tr id="tableHeader">
          </tr>
          </thead>
          <tbody id="attendanceList">
          <tr>
            <td colspan="6" style="text-align: center; padding: 100px 0;">
              <div class="spinner-border text-primary" role="status"></div>
              <p class="mt-2">기록을 불러오는 중입니다...</p>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script th:src="@{/js/commute.js}"></script>
</body>
</html>
