<!DOCTYPE html>
<htm lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <title>Title</title>
  </head>
  <body>
  <!-- 시간 수정 요청 모달 -->
  <div th:fragment="commuteRequestModal">
    <div id="commuteRequestModal" class="modal">

      <div class="modalBody">
        <div class="modal-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
          <h3 style="margin: 0; color: #333; font-size: 1.4rem; font-weight: 700;">근무시간 수정 요청</h3>
          <span class="close-btn" onclick="closeModal()" style="cursor: pointer; font-size: 28px; color: #aaa;">&times;</span>
        </div>

        <div class="modal-content" style="margin-bottom: 20px;">
          <div style="background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid #eee;">
            <p style="margin: 0; font-size: 14px; color: #666;">
              선택 일자: <strong id="modalTargetDate" style="color: #4f46e5;">-</strong>
            </p>
          </div>
        </div>

        <input type="hidden" id="hiddenTargetDate">
        <input type="hidden" id="modalAttendanceId">

        <div style="display: flex; flex-direction: column; gap: 20px; margin-bottom: 25px;">
          <div>
            <label style="display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 8px;">수정 사유</label>
            <input type="text"
                   id="context"
                   class="form-control"
                   style="padding: 10px; border: 1px solid #ddd; border-radius: 6px;"
                   placeholder="예: 서버 장애로 인한 근무시간 조정 요청">
          </div>

          <div>
            <label style="display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 8px;">상세 설명</label>
            <textarea id="contextDetail"
                      class="form-control"
                      style="padding: 10px; border: 1px solid #ddd; border-radius: 6px;"
                      placeholder="상세 내용을 입력해주세요"></textarea>
          </div>
        </div>

        <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: 10px; padding-top: 15px; border-top: 1px solid #eee;">
          <button type="button" class="btn-cancel" onclick="closeModal()">취소</button>
          <button type="button" class="btn-save" onclick="requestUpdateTime()">요청 전송</button>
        </div>

      </div>
    </div>
  </div>
  </body>
</htm>
