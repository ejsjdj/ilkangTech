<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/layout}">

<head>
    <title>전자결재 시스템</title>
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
    <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <th:block layout:fragment="style">
        <link rel="stylesheet" th:href="@{/css/draft.css}">
    </th:block>
</head>

<body>

<div layout:fragment="content">
    <div class="header-container">
        <h1>전자 결재</h1>
        <button type="button" class="btn-register" onclick="openModal()">+ 결재 작성하기</button>
    </div>

    <div th:replace="hr/draftModal :: draftModal"></div>
    <div th:replace="hr/draftDetailModal :: draftDetailModal"></div>

    <div class="search-container">
        <form th:action="@{/draft/list}" method="get" id="searchForm" class="search-form">
            <input type="hidden" name="type" th:value="${type}">
            <div class="search-row" style="display: flex; gap: 10px; align-items: center;">
                <select name="draftType" class="search-select custom-dropdown">
                    <option value="PTO" th:selected="${draftType == 'PTO'}">휴가 신청서</option>
                    <option value="EXP" th:selected="${draftType == 'EXP'}">지출 결의서</option>
                    <option value="BUY" th:selected="${draftType == 'BUY'}">구매 품의서</option>
                    <option value="APP" th:selected="${draftType == 'APP'}">발령 품의서</option>
                </select>
                <div class="date-range-group">
                    <input type="date" name="startDate" class="date-input" th:value="${startDate}">
                    <span>~</span>
                    <input type="date" name="endDate" class="date-input" th:value="${endDate}">
                </div>
                <button type="submit" class="btn-search-submit">조회</button>
            </div>
        </form>
    </div>

    <div class="tab-container">
        <button type="button" th:classappend="${type == 'inbox'} ? 'active'" onclick="switchTab('inbox')">수신 문서</button>
        <button type="button" th:classappend="${type == 'outbox'} ? 'active'" onclick="switchTab('outbox')">송신 문서</button>
    </div>

    <div id="grid"></div>

    <script th:inline="javascript">
        console.log([[${draftList}]]);
        /*<![CDATA[*/

        const rawData = /*[[${draftList instanceof T(org.springframework.data.domain.Page) ? draftList.content : draftList}]]*/ [];
        /*]]>*/
    </script>
</div>

<th:block layout:fragment="script">
    <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <script th:src="@{/js/draft.js}"></script>
</th:block>

</body>
</html>
