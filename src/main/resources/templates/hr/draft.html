<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/layout}">

<head>
    <title>전자결재</title>
    <th:block layout:fragment="style">
        <link rel="stylesheet" th:href="@{/css/draft.css}">
    </th:block>
</head>

<body>

<div layout:fragment="content">

    <div class="header-container">
        <h1>전자결재 문서 목록</h1>
        <button type="button" class="btn-register" onclick="openModal()">
            <i class="fas fa-plus"></i> 결재 등록
        </button>
    </div>

    <!-- 문서 작성 모달 -->
    <div th:replace="hr/draftModal :: draftModal"></div>

    <!-- 상세보기 모달 -->
    <div th:replace="hr/draftDetailModal :: draftDetailModal"></div>

    <div class="search-container">
        <form th:action="@{/draft/list}" method="get" id="searchForm" class="search-form">
            <input type="hidden" name="type" th:value="${type}">

            <div class="search-row">
                <select name="draftType" class="search-select custom-dropdown">
                    <option value="ALL">선택하세요</option>
                    <option value="PTO" th:selected="${draftType == 'PTO'}">휴가 신청서</option>
                    <option value="EXP" th:selected="${draftType == 'EXP'}">지출 결의서</option>
                    <option value="BUY" th:selected="${draftType == 'BUY'}">구매 품의서</option>
                    <option value="APP" th:selected="${draftType == 'APP'}">발령 요청서</option>
                </select>

                <div class="date-range-group">
                    <input type="date" name="startDate" class="date-input" th:value="${startDate}">
                    <span class="date-separator">~</span>
                    <input type="date" name="endDate" class="date-input" th:value="${endDate}">
                </div>

                <button type="submit" class="btn-search-submit">조회</button>
            </div>
        </form>
    </div>

    <div class="tab-container">
        <button type="button"
                th:classappend="${type == 'inbox'} ? 'active'"
                onclick="switchTab('inbox')">결재할 문서</button>

        <button type="button"
                th:classappend="${type == 'outbox'} ? 'active'"
                onclick="switchTab('outbox')">내가 올린 문서</button>
    </div>

    <table>
        <thead>
        <tr>
            <th>결재 ID</th>
            <th>제목</th>
            <th>시작 날짜</th>
            <th>종료 날짜</th>
            <th>결과</th>
            <th>등록 및 조회</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="d : ${draftList}">
            <td th:text="${d.draft_id}">1</td>
            <td th:text="${d.draft_title}">제목</td>
            <td th:text="${#temporals.format(d.draft_startTime, 'yyyy-MM-dd')}"></td>
            <td th:text="${#temporals.format(d.draft_endDate, 'yyyy-MM-dd')}"></td>
            <td th:text="${d.draft_status}">대기</td>
            <td><button type="button" th:onclick="|draftDetail(${d.draft_id})|">상세보기</button></td>
        </tr>

        <tr th:if="${#lists.isEmpty(draftList)}">
            <td colspan="7">문서가 없습니다.</td>
        </tr>
        </tbody>
    </table>

    <div class="pagination-container">
        <ul class="pagination">
            <li th:classappend="${draftList.first} ? 'disabled'">
                <a th:href="@{/hr/draft(page=${draftList.number - 1}, type=${param.type}, draftType=${param.draftType}, startDate=${param.startDate}, endDate=${param.endDate})}">&laquo;</a>
            </li>

            <li th:each="i : ${#numbers.sequence(0, draftList.totalPages - 1)}"
                th:classappend="${i == draftList.number} ? 'active'">
                <a th:href="@{/hr/draft(page=${i}, type=${param.type}, draftType=${param.draftType}, startDate=${param.startDate}, endDate=${param.endDate})}"
                   th:text="${i + 1}"></a>
            </li>

            <li th:classappend="${draftList.last} ? 'disabled'">
                <a th:href="@{/hr/draft(page=${draftList.number + 1}, type=${param.type}, draftType=${param.draftType}, startDate=${param.startDate}, endDate=${param.endDate})}">&raquo;</a>
            </li>
        </ul>
    </div>

</div>

<th:block layout:fragment="script">
    <script th:src="@{/js/draft.js}"></script>
</th:block>

</body>
</html>
