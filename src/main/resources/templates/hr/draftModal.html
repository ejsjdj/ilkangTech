<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<!-- 문서 작성 모달 -->
<div th:fragment="draftModal">
    <div id="draftModal" class="modal">
        <div class="modalBody">

            <h3>결재 문서 작성</h3>

            <!-- 결재 문서 양식 -->
            <div class="form-group">
                <label for="draftType">결재양식 선택</label>
                <select id="draftType" name="draftType" onchange="loadApprovalLine(this.value)">
                    <option value="PTO">휴가</option>
                    <option value="HDF">반차</option>
                    <option value="BUY">구매</option>
                    <option value="APP">발령</option>
                </select>
            </div>

            <!-- 제목 -->
            <div class="form-group">
                <label for="draftTitle">제목</label>
                <input type="text" id="draftTitle" name="draftTitle" placeholder="제목을 입력하세요">
            </div>

            <!-- 내용 -->
            <div class="form-group">
                <label for="draftContent">내용</label>
                <textarea id="draftContent" name="draftContent" rows="5"
                          placeholder="결재 내용을 입력하세요"></textarea>
            </div>

            <!-- 파일 업로드 -->
            <div class="form-group">
                <label for="draftFile">첨부 파일</label>
                <input type="file" id="draftFile" name="draftFile">
            </div>

            <!-- 날짜 -->
            <div class="form-group">
                <label>결재 기간</label>
                <div class="date-group">
                    <input type="date" id="startDate" name="startDate">
                    <span>~</span>
                    <input type="date" id="endDate" name="endDate">
                </div>
            </div>

            <!-- 결재자 라인 -->
            <div class="form-group">
                <label>결재 라인</label>
                <div class="approval-line-box">
                    <!-- JS로 결재자 동적 추가 -->
                    <input type="text" id="approver1" name="draftTitle" placeholder="1치 결재자">
                    <input type="text" id="approver2" name="draftTitle" placeholder="2치 결재자">
                    <input type="text" id="approver3" name="draftTitle" placeholder="3차 결재자">
                </div>
            </div>

            <!-- 버튼 -->
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeModal()">취소</button>
                <button type="button" class="btn-submit" onclick="postDraft()">등록</button>
            </div>

        </div>
    </div>
</div>
</body>
</html>
