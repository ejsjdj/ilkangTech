<!DOCTYPE html>
<html lang="ko"
      layout:decorate="~{layout/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>휴가 현황</title>

    <!-- Bootstrap / Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
          rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <th:block layout:fragment="style">
        <link rel="stylesheet" th:href="@{/css/vacation.css}">
    </th:block>
</head>
<body layout:fragment="content">
<div class="content-root">
    <div class="container-wrapper">

        <!-- 페이지 헤더 -->
        <div class="page-header">
            <div class="header-title-area">
                <div class="header-icon-bar"></div>
                <div>
                    <h1>휴가 현황</h1>
                    <p class="page-subtitle">올해 사용 가능한 연차 및 잔여 연차 확인</p>
                </div>
            </div>
        </div>

        <!-- 휴가 요약 카드 영역 -->
        <div class="vacation-wrapper">
            <div id="vacationContainer">
                <!-- 로딩 상태 -->
                <div class="vacation-loading text-center p-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-3">휴가 정보를 불러오는 중입니다...</p>
                </div>
            </div>
        </div>

        <!-- 블록 카드 -->
        <!--<div class="table-wrapper">
            <div class="table-scroll" id="vacationListContainer"> &lt;!&ndash; 로딩 상태 &ndash;&gt;
                <div class="text-center p-5">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-3">휴가 정보를 불러오는 중입니다...</p></div>
            </div>
        </div>-->

    </div>
</div>

<script th:src="@{/js/vacation.js}"></script>
</body>
</html>
