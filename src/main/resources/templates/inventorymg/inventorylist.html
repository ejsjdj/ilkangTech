<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>재고조회</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
    <link rel="stylesheet" href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />

    <th:block layout:fragment="style">
	    <style>
	        .page-container { 
	            background: #ffffff; border-radius: 12px; padding: 30px; 
	            box-shadow: 0 4px 20px rgba(0,0,0,0.05); min-height: 800px;
	            display: flex; flex-direction: column;
	        }

	        .search-box {
	            background: #ffffff; border-radius: 10px; padding: 25px; margin-bottom: 20px;
	            border: 1px solid #e9ecef; box-shadow: 0 2px 8px rgba(0,0,0,0.02);
	        }
	        
	        .nav-tabs .nav-link { color: #495057; font-weight: bold; padding: 12px 25px; }
	        .nav-tabs .nav-link.active { color: #0d6efd; border-bottom: 3px solid #0d6efd; background-color: transparent; border-top: none; border-left: none; border-right: none; }
	        
	        .tui-grid-cell-header { background-color: #ffffff; font-weight: bold; color: #111; border-bottom: 2px solid #e9ecef; }
	        .tui-grid-border-line { background-color: #e9ecef; }
	    </style>
	</th:block>
</head>
<body>
    <div layout:fragment="content">
        <div class="page-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="mb-4 text-secondary">재고 관리 / <span class="text-dark fw-bold">재고목록</span></h4>
                
            </div>

            <ul class="nav nav-tabs mb-4" id="inventoryTabs">
                <li class="nav-item"><a class="nav-link active" href="#" data-tab="ALL">전체</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-tab="RAW">원자재</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-tab="SEMI">반제품</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-tab="FINISHED">완제품</a></li>
            </ul>

            <div class="search-box">
                <div class="row g-3 align-items-center">
                    <div class="col-auto">
                        <select class="form-select" id="searchType">
                            <option value="itemName" selected>제품명</option>
                            <option value="lotNumber">LOT 번호</option>
                            <option value="location">창고 위치</option>
                            <option value="inboundDate">입고일</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <input type="text" class="form-control" id="keyword" placeholder="검색어를 입력하세요" onkeypress="if(event.keyCode==13) loadGridData();">
                    </div>
                    <div class="col-auto">
                        <button class="btn btn-primary px-4" onclick="loadGridData()"><i class="fa-solid fa-magnifying-glass"></i> 검색</button>
                    </div>
                </div>
            </div>
            
            <div id="grid"></div>
            
            <div class="modal fade" id="inventoryDetailModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-lg">
                <div class="modal-content" style="border-radius: 12px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
                    <div class="modal-header border-0 pb-0 mt-3 mx-3">
                        <h5 class="modal-title fw-bold text-secondary">재고 상세 정보</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body p-4">
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">LOT 번호</label>
                                <input type="text" class="form-control bg-light" id="dtLotNumber" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">상품명</label>
                                <input type="text" class="form-control bg-light" id="dtItemName" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">타입</label>
                                <input type="text" class="form-control bg-light" id="dtItemType" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">위치 (ZONE-RACK)</label>
                                <input type="text" class="form-control bg-light" id="dtLocation" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">현재 수량</label>
                                <input type="text" class="form-control bg-light text-primary fw-bold" id="dtCurrentQty" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">출고예정 수량</label>
                                <div class="d-flex gap-2">
                                    <input type="text" class="form-control bg-light" id="dtScheduledOutbound" readonly>
                                    <button class="btn btn-warning text-white fw-bold" style="white-space: nowrap;" onclick="openAdjustModal()">실수량체크</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-0 pt-0 mb-3 mx-3 d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">닫기</button>
                        <button type="button" class="btn btn-primary px-4" onclick="openTransferModal()">재고 이동</button>
                        <button type="button" class="btn btn-danger px-4" onclick="openDiscardModal()">폐기</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="adjustQtyModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content" style="border-radius: 12px;">
                    <div class="modal-header border-0">
                        <h6 class="modal-title fw-bold">실수량 체크 (조절)</h6>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3 d-flex align-items-center gap-3">
                            <label class="form-label text-muted small fw-bold mb-0">조절 유형</label>
                            <div class="form-check form-check-inline mb-0">
                                <input class="form-check-input" type="radio" name="adjustType" id="adjIncrease" value="INCREASE" checked>
                                <label class="form-check-label text-primary fw-bold" for="adjIncrease">증가</label>
                            </div>
                            <div class="form-check form-check-inline mb-0">
                                <input class="form-check-input" type="radio" name="adjustType" id="adjDecrease" value="DECREASE">
                                <label class="form-check-label text-danger fw-bold" for="adjDecrease">감소</label>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">조절할 수량</label>
                            <input type="number" class="form-control" id="adjQty" min="1" value="1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">사유</label>
                            <textarea class="form-control" id="adjReason" rows="3" placeholder="수량 조절 사유를 입력하세요"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                        <button type="button" class="btn btn-primary px-4" onclick="executeAdjust()">저장</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="transferModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-sm modal-dialog-centered">
                <div class="modal-content" style="border-radius: 12px;">
                    <div class="modal-header bg-primary text-white border-0" style="border-radius: 12px 12px 0 0;">
                        <h6 class="modal-title fw-bold">재고 이동</h6>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">최대 가능 수량</label>
                            <input type="number" class="form-control bg-light" id="trMaxQty" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">이동할 수량</label>
                            <input type="number" class="form-control" id="trQty" min="1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">이동할 ZONE</label>
                            <select class="form-select" id="trZone">
                                <option value="ZONE A">ZONE A</option>
                                <option value="ZONE B">ZONE B</option>
                                <option value="ZONE C">ZONE C</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">이동할 Rack</label>
                            <select class="form-select" id="trRack">
                                <th:block th:each="i : ${#numbers.sequence(1, 25)}">
                                    <option th:value="${i < 10 ? 'Rack 0' + i : 'Rack ' + i}"
                                            th:text="${i < 10 ? 'Rack 0' + i : 'Rack ' + i}"></option>
                                </th:block>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer border-0 d-flex justify-content-between">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                        <button type="button" class="btn btn-primary px-4" onclick="executeTransfer()">이동 실행</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="discardModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content" style="border-radius: 12px;">
                    <div class="modal-header bg-danger text-white border-0" style="border-radius: 12px 12px 0 0;">
                        <h6 class="modal-title fw-bold">재고 폐기 처리</h6>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">폐기 가능 최대 수량</label>
                            <input type="number" class="form-control bg-light" id="disMaxQty" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-danger small fw-bold">폐기할 수량</label>
                            <input type="number" class="form-control border-danger" id="disQty" min="1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">폐기 사유</label>
                            <textarea class="form-control" id="disReason" rows="3" placeholder="파손, 불량, 유통기한 경과 등"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer border-0">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">취소</button>
                        <button type="button" class="btn btn-danger px-4" onclick="executeDiscard()">폐기 실행</button>
                    </div>
                </div>
            </div>
        </div>

        </div>
    </div>

<th:block layout:fragment="script">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
    <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
    <script th:inline="javascript">
        let grid;
        let currentTab = 'ALL';
    	// 현재 선택된 행의 데이터를 담아둘 전역 변수
        let selectedRowData = null;

        // 기존 커스텀 렌더러 교체 (상세 버튼 클릭 시 모달 열기)
        class DetailButtonRenderer {
            constructor(props) {
                const el = document.createElement('button');
                el.className = 'btn btn-sm btn-primary px-2 py-1 shadow-sm';
                el.style.fontSize = '0.8rem';
                el.style.fontWeight = 'bold';
                el.innerHTML = '<i class="fa-solid fa-eye me-1"></i> 조회';
                
                el.onclick = () => {
                    // 선택한 행의 데이터를 가져와서 전역 변수에 저장
                    selectedRowData = props.grid.getRow(props.rowKey);
                    
                    // 모달의 Input 칸에 데이터 채워넣기
                    document.getElementById('dtLotNumber').value = selectedRowData.lotNumber;
                    document.getElementById('dtItemName').value = selectedRowData.itemName;
                    document.getElementById('dtItemType').value = selectedRowData.itemType;
                    document.getElementById('dtLocation').value = selectedRowData.location;
                    document.getElementById('dtCurrentQty').value = selectedRowData.currentQuantity.toLocaleString();
                    document.getElementById('dtScheduledOutbound').value = selectedRowData.scheduledOutbound.toLocaleString();

                    // 메인 상세 모달 띄우기
                    new bootstrap.Modal(document.getElementById('inventoryDetailModal')).show();
                };
                this.el = el;
            }
            getElement() { return this.el; }
            render(props) {}
        }
        
        // 하위 모달창 제어 함수들 추가 (기존 코드 아래에 추가)
        // [실수량체크 모달 열기]
        function openAdjustModal() {
            // 메인 모달 닫기
            bootstrap.Modal.getInstance(document.getElementById('inventoryDetailModal')).hide();
            // 폼 초기화 후 열기
            document.getElementById('adjQty').value = 1;
            document.getElementById('adjReason').value = '';
            new bootstrap.Modal(document.getElementById('adjustQtyModal')).show();
        }

        // [재고 이동 모달 열기]
        function openTransferModal() {
            bootstrap.Modal.getInstance(document.getElementById('inventoryDetailModal')).hide();
            document.getElementById('trMaxQty').value = selectedRowData.currentQuantity;
            document.getElementById('trQty').value = selectedRowData.currentQuantity;
            new bootstrap.Modal(document.getElementById('transferModal')).show();
        }

        // [폐기 모달 열기]
        function openDiscardModal() {
            bootstrap.Modal.getInstance(document.getElementById('inventoryDetailModal')).hide();
            document.getElementById('disMaxQty').value = selectedRowData.currentQuantity;
            document.getElementById('disQty').value = 1;
            document.getElementById('disReason').value = '';
            new bootstrap.Modal(document.getElementById('discardModal')).show();
        }

        // 실수량체크(조절) 실행
        function executeAdjust() {
            const inventoryId = selectedRowData.id; // DTO에 담겨온 재고 고유 PK
            const type = document.querySelector('input[name="adjustType"]:checked').value;
            const qty = parseInt(document.getElementById('adjQty').value);
            const reason = document.getElementById('adjReason').value;

            if (qty <= 0 || isNaN(qty)) {
                alert('올바른 수량을 입력해주세요.'); return;
            }

            const formData = new URLSearchParams();
            formData.append('inventoryId', inventoryId);
            formData.append('type', type);
            formData.append('qty', qty);
            formData.append('reason', reason);

            fetch('/inventorymg/api/inventory/adjust', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            })
            .then(async response => {
                const msg = await response.text();
                if(!response.ok) throw new Error(msg);
                alert(msg);
                location.reload(); // 성공 시 새로고침하여 바뀐 데이터 렌더링
            })
            .catch(error => alert('처리 실패: ' + error.message));
        }

     	// 재고 이동 실행
        function executeTransfer() {
            const inventoryId = selectedRowData.id;
            const qty = parseInt(document.getElementById('trQty').value);
            const zone = document.getElementById('trZone').value;
            const rack = document.getElementById('trRack').value;

            if (qty <= 0 || isNaN(qty)) {
                alert('올바른 수량을 입력해주세요.'); return;
            }

            const formData = new URLSearchParams();
            formData.append('inventoryId', inventoryId);
            formData.append('targetZone', zone);
            formData.append('targetRack', rack);
            formData.append('transferQty', qty);

            fetch('/inventorymg/transfer', { 
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            })
            .then(async response => {
                const msg = await response.text();
                if(!response.ok) throw new Error(msg);
                alert(msg);
                location.reload();
            })
            .catch(error => alert('이동 실패: ' + error.message));
        }

     	// 폐기 실행
        function executeDiscard() {
            const inventoryId = selectedRowData.id;
            const qty = parseInt(document.getElementById('disQty').value);
            const reason = document.getElementById('disReason').value;

            if (qty <= 0 || isNaN(qty)) {
                alert('올바른 수량을 입력해주세요.'); return;
            }

            const formData = new URLSearchParams();
            formData.append('inventoryId', inventoryId);
            formData.append('qty', qty);
            formData.append('reason', reason);

            fetch('/inventorymg/api/inventory/discard', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            })
            .then(async response => {
                const msg = await response.text();
                if(!response.ok) throw new Error(msg);
                alert(msg);
                location.reload();
            })
            .catch(error => alert('폐기 실패: ' + error.message));
        }

        document.addEventListener('DOMContentLoaded', function () {
        	
        	tui.Grid.applyTheme('default', {
                grid: {
                    border: '#e9ecef',
                    header: { border: '#e9ecef' }
                },
                row: {
                    even: { background: '#ffffff' }, // 짝수 행 회색 배경을 강제 흰색으로!
                    hover: { background: '#f8f9fa' } // 마우스 올렸을 때만 살짝 연한 회색 효과
                },
                cell: {
                    normal: { background: '#ffffff', border: '#e9ecef', showVerticalBorder: false }, // 세로선 제거로 더 깔끔하게
                    header: { background: '#ffffff', text: '#111', border: '#e9ecef' } // 헤더도 완벽한 흰색
                }
            });
            
            // Toast UI Grid 초기화
            grid = new tui.Grid({
                el: document.getElementById('grid'),
                scrollX: false,
                scrollY: false,
                minBodyHeight: 400,
                rowHeaders: ['rowNum'], 
                pageOptions: {
                    useClient: true, 
                    perPage: 15
                },
                columns: [
                    { header: '품목 구분', name: 'itemType', align: 'center', width: 100 },
                    { header: 'LOT 번호', name: 'lotNumber', align: 'center', sortable: true },
                    { header: '제품명', name: 'itemName', align: 'left', sortable: true },
                    { header: '재고량', name: 'currentQuantity', align: 'right', width: 100, sortable: true,
                      formatter: ({value}) => `<span class="text-primary fw-bold">${value.toLocaleString()}</span>` },
                    { header: '출고예정', name: 'scheduledOutbound', align: 'right', width: 100 },
                    { header: '위치 (창고위치)', name: 'location', align: 'center', sortable: true },
                    { header: '입고일', name: 'inboundDate', align: 'center', sortable: true },
                    // 💡 2. [버튼 짤림 해결] 상세 버튼 열의 width를 80 -> 110으로 넉넉하게 늘려줍니다!
                    { header: '상세', name: 'detail', align: 'center', width: 110, renderer: { type: DetailButtonRenderer } }
                ]
            });

            // 초기 데이터 로드
            loadGridData();

            // 탭 클릭 이벤트 바인딩
            document.querySelectorAll('#inventoryTabs .nav-link').forEach(tab => {
                tab.addEventListener('click', function(e) {
                    e.preventDefault();
                    // 활성화 탭 디자인 변경
                    document.querySelectorAll('#inventoryTabs .nav-link').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    // 현재 탭 상태 저장 및 데이터 리로드
                    currentTab = this.getAttribute('data-tab');
                    
                    // 탭 이동 시 검색어 초기화 (옵션)
                    document.getElementById('keyword').value = '';
                    loadGridData();
                });
            });
        });

        // 서버(Controller)에 AJAX 요청하여 그리드에 데이터 세팅
        function loadGridData() {
            const searchType = document.getElementById('searchType').value;
            const keyword = document.getElementById('keyword').value;

            fetch(`/inventorymg/api/inventory-data?tab=${currentTab}&searchType=${searchType}&keyword=${keyword}`)
                .then(response => response.json())
                .then(data => {
                    grid.resetData(data); // Toast UI Grid에 데이터 삽입
                })
                .catch(error => console.error('데이터 로드 실패:', error));
        }
    </script>
</th:block>
</body>
</html>
