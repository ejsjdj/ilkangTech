<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>출고 목록</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
    <link rel="stylesheet" href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />

    <th:block layout:fragment="style">
	    <style>
	        .page-container { 
	            background: #ffffff; border-radius: 12px; padding: 30px; 
	            box-shadow: 0 4px 20px rgba(0,0,0,0.05); min-height: 800px;
	            display: flex; flex-direction: column;
	        }

	        .search-box {
	            background: #ffffff; border-radius: 10px; padding: 25px; margin-bottom: 20px;
	            border: 1px solid #e9ecef; box-shadow: 0 2px 8px rgba(0,0,0,0.02);
	        }
	        
	        .nav-tabs .nav-link { color: #495057; font-weight: bold; padding: 12px 25px; }
	        .nav-tabs .nav-link.active { color: #0d6efd; border-bottom: 3px solid #0d6efd; background-color: transparent; border-top: none; border-left: none; border-right: none; }
	        
	        .tui-grid-cell-header { background-color: #ffffff; font-weight: bold; color: #111; border-bottom: 2px solid #e9ecef; }
	        .tui-grid-border-line { background-color: #e9ecef; }
	    </style>
	</th:block>
</head>
<body>
    <div layout:fragment="content">
        <div class="page-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h4 class="mb-4 text-secondary">재고 관리 / <span class="text-dark fw-bold">출고목록</span></h4>
            </div>

            <ul class="nav nav-tabs mb-4" id="outboundTabs">
                <li class="nav-item"><a class="nav-link active" href="#" data-tab="ALL">전체</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-tab="RAW">원자재</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-tab="SEMI">반제품</a></li>
                <li class="nav-item"><a class="nav-link" href="#" data-tab="FINISHED">완제품</a></li>
                <li class="nav-item"><a class="nav-link text-primary" href="#" data-tab="SALES">영업팀</a></li>
                <li class="nav-item"><a class="nav-link text-success" href="#" data-tab="PRODUCTION">생산팀</a></li>
            </ul>

            <div class="search-box">
                <div class="row g-3 align-items-center">
                    <div class="col-auto">
                        <select class="form-select" id="searchType">
                            <option value="itemName" selected>제품명</option>
                            <option value="requestDept">출고팀</option>
                            <option value="outboundDate">출고일</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <input type="text" class="form-control" id="keyword" placeholder="검색어를 입력하세요" onkeypress="if(event.keyCode==13) loadGridData();">
                    </div>
                    <div class="col-auto">
                        <button class="btn btn-primary px-4" onclick="loadGridData()"><i class="fa-solid fa-magnifying-glass"></i> 검색</button>
                    </div>
                </div>
            </div>
            
            <div id="grid"></div>
            
        </div>
    </div>

<th:block layout:fragment="script">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
    <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
    <script th:inline="javascript">
        let grid;
        let currentTab = 'ALL';

        document.addEventListener('DOMContentLoaded', function () {
        	
        	tui.Grid.applyTheme('default', {
                grid: {
                    border: '#e9ecef',
                    header: { border: '#e9ecef' }
                },
                row: {
                    even: { background: '#ffffff' },
                    hover: { background: '#f8f9fa' } 
                },
                cell: {
                    normal: { background: '#ffffff', border: '#e9ecef', showVerticalBorder: false }, 
                    header: { background: '#ffffff', text: '#111', border: '#e9ecef' } 
                }
            });
            
        	// 💡 3. Toast UI Grid 초기화 및 항목 세팅 (너비 및 디자인 밸런스 완벽 조정)
            grid = new tui.Grid({
                el: document.getElementById('grid'),
                scrollX: false,
                scrollY: false,
                minBodyHeight: 400,
                rowHeaders: ['rowNum'], // No. 자동 생성
                pageOptions: {
                    useClient: true, 
                    perPage: 15,       // 한 페이지당 15개 
                    visiblePages: 10   // 하단 페이지네이션 10개씩 표시
                },
                columns: [
                    // 🌟 다른 컬럼들의 너비를 넉넉히 주어 '제품명'이 과도하게 늘어나는 것을 방지합니다.
                    { header: '품목 구분', name: 'itemType', align: 'center', sortable: true, width: 150 },
                    
                    // 🌟 제품명은 width를 빼서 남은 공간을 자연스럽게 채우도록 둡니다 (최소 너비만 보장)
                    { header: '제품명', name: 'itemName', align: 'left', minWidth: 250 },
                    
                    { header: '출고량', name: 'outboundQty', align: 'right', width: 150, 
                      formatter: ({value}) => `<span class="text-primary fw-bold">${value ? value.toLocaleString() : 0}</span>` },
                      
                    // 🌟 날짜와 팀 컬럼의 너비를 키워서 오른쪽 마감 라인이 깔끔하게 떨어지도록 수정
                    { header: '출고일', name: 'outboundDate', align: 'center', sortable: true, width: 200 },
                    { header: '출고팀', name: 'requestDept', align: 'center', sortable: true, width: 150 }
                ]
            });

            // 초기 데이터 로드
            loadGridData();

            // 탭 클릭 이벤트 바인딩
            document.querySelectorAll('#outboundTabs .nav-link').forEach(tab => {
                tab.addEventListener('click', function(e) {
                    e.preventDefault();
                    document.querySelectorAll('#outboundTabs .nav-link').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    currentTab = this.getAttribute('data-tab');
                    document.getElementById('keyword').value = ''; // 탭 이동 시 검색어 초기화
                    loadGridData();
                });
            });
        });

        // 💡 4. 서버(Controller)에 AJAX 요청하여 그리드에 데이터 세팅
        function loadGridData() {
            const searchType = document.getElementById('searchType').value;
            const keyword = document.getElementById('keyword').value;

            // ※ 주의: 백엔드에 이 API를 새로 만들어주셔야 합니다!
            fetch(`/inventorymg/api/outbound-data?tab=${currentTab}&searchType=${searchType}&keyword=${keyword}`)
                .then(response => response.json())
                .then(data => {
                    grid.resetData(data); // 데이터 삽입
                    
                    // 💡 5. 디폴트 정렬 조건 적용: 출고일(내림차순, 최신순)
                    if(data && data.length > 0) {
                        grid.sort('outboundDate', false); 
                    }
                })
                .catch(error => console.error('데이터 로드 실패:', error));
        }
    </script>
</th:block>
</body>
</html>
