<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
	<meta charset="UTF-8">
	<title>chatList</title>
	<style>
		html, body { height: 100%; margin: 0; }
	    .wrapper { display: flex; height: 100vh; }
	    .blank {height: 60px;}
		.sidebar-area { flex: 1; }
	    .sidebar { height: 100vh; flex: 1; background-color: #1f3bff; } 
	    .main { flex: 7; display: flex; flex-direction: column; }
		.searchBarArea { border-bottom: 1px solid #e5e5e5; height: 50px; display:flex; align-items:center; padding: 0 12px; }
	    .searchBar { width: 100%; height: 36px; padding: 0 12px; border: 1px solid #ddd; border-radius: 8px; }
	    .chatList { flex: 1; overflow-y: auto; background: #fff; }
	    .empty { padding: 16px; color: #6b7280; }
    
	    .memberListBtn img, .chatListBtn img {width: 60px; height: 60px;}
	    
	    .searchBarArea { gap: 8px; }
		
		.searchBtn{
		  height: 36px;
		  padding: 0 14px;
		  border: 1px solid #ddd;
		  border-radius: 8px;
		  background: #fff;
		  cursor: pointer;
		  white-space: nowrap;
		}
		.searchBtn:hover { background: #f6f6f6; }
		/* 채팅 아이템 스타일 */
		.chat-item {
		    padding: 16px;
		    border-bottom: 1px solid #f3f4f6;
		    cursor: pointer;
		    transition: background 0.2s;
		}
		.chat-item:hover { background-color: #f9fafb; }
		
		.chat-info { display: flex; flex-direction: column; gap: 4px; }
		
		.chat-top { display: flex; justify-content: space-between; align-items: center; }
		.chat-name { font-weight: 600; font-size: 15px; color: #111827; }
		.chat-time { font-size: 12px; color: #9ca3af; }
		
		.chat-bottom { 
		    display: block;
		    font-size: 13px;
		    color: #6b7280;
		    overflow: hidden;
		    text-overflow: ellipsis;
		    white-space: nowrap;
		}
	</style>
</head>
<body>

	<div class="wrapper">
	    <div class="sidebar-area"
		    th:insert="~{messenger/messengerLayout :: messengerSidebar('members')}">
		</div>
		
		<div class="main">
			<div class="searchBarArea">
			    <input id="chatSearch" type="text" class="searchBar" 
			           placeholder="채팅방 이름으로 검색" onkeyup="applySearch()">
			    <button type="button" class="searchBtn" onclick="applySearch()">검색</button>
			</div>
		
			<div class="chatList">
			    <div th:each="room : ${rooms}" class="chat-item" 
			         th:data-room-id="${room.roomId}" 
			         th:onclick="|window.open('/messenger/chatroom/${room.roomId}', 'chatWindow_${room.roomId}', 'width=450,height=700')|">
				    
				    <div class="chat-info">
				        <div class="chat-top">
				            <span class="chat-name" th:text="${room.roomTitle}"></span>
				            <span class="chat-time" th:text="${room.lastTime}"></span>
				        </div>
				        <div class="chat-bottom">
				            <span class="chat-preview" th:text="${room.lastMessage}"></span>
				        </div>
				    </div>
				</div>			<!-- room : ${rooms} 종료 -->
				<input type="hidden" id="myId" th:value="${#authentication.principal.id}">
			</div>			<!-- chatList 종료 -->
		</div>			<!-- main 종료 -->
		
</div>
	
<script>
var stompClient = null;

function connectList() {
    var socket = new SockJS("/ws");
    stompClient = Stomp.over(socket);
    var myId = document.getElementById("myId").value;

    stompClient.connect({}, function () {
        // 내 개인 목록 채널을 구독합니다.
        stompClient.subscribe("/topic/user/" + myId + "/list", function (message) {
            var payload = JSON.parse(message.body);
            updateChatList(payload);
        });
    });
}

function updateChatList(msg) {
    // data-room-id 속성을 가진 아이템을 찾음
    var roomItem = document.querySelector(".chat-item[data-room-id='" + msg.roomId + "']");
    var listContainer = document.querySelector(".chatList");

    if (roomItem) {
        // 마지막 메시지 내용과 시간 갱신
        roomItem.querySelector(".chat-preview").textContent = msg.content;
        roomItem.querySelector(".chat-time").textContent = msg.formattedTime;

        // 요소를 목록 최상단으로 이동시켜 정렬 효과를 줌
        listContainer.prepend(roomItem);
    } else {
        // 목록에 없는 새로운 방인 경우 페이지 갱신
        location.reload(); 
    }
}


// 채팅방 검색
function applySearch() {
    // 1. 입력창의 키워드 가져오기 (소문자 변환)
    var keyword = document.getElementById("chatSearch").value.toLowerCase();
    
    // 2. 모든 채팅 아이템 가져오기
    var items = document.querySelectorAll(".chat-item");

    items.forEach(function(item) {
        // 3. 각 아이템의 방 이름 가져오기
        var roomName = item.querySelector(".chat-name").textContent.toLowerCase();
        
        // 4. 키워드 포함 여부에 따라 보이기/숨기기
        if (roomName.indexOf(keyword) !== -1) {
            item.style.display = ""; // 보임 (기본값)
        } else {
            item.style.display = "none"; // 숨김
        }
    });
}

// 페이지 로드 시 연결 실행
connectList();

</script>	

	
	
</body>
</html>
