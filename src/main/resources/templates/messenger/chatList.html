<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
	<meta charset="UTF-8">
	<title>chatList</title>
	<th:block th:replace="~{messenger/messengerLayout :: messengerStyle}"></th:block>
	<style>
		html, body { height: 100%; margin: 0; }
	    .wrapper { display: flex; height: 100vh; }
	    .main { flex: 7; display: flex; flex-direction: column; }
		.searchBarArea { border-bottom: 1px solid #e5e5e5; height: 50px; display:flex; align-items:center; padding: 0 12px; }
	    .searchBar { width: 100%; height: 36px; padding: 0 12px; border: 1px solid #ddd; border-radius: 8px; }
	    .chatList { flex: 1; overflow-y: auto; background: #fff; }
	    .empty { padding: 16px; color: #6b7280; }
    
	    .searchBarArea { gap: 8px; }
		
		.searchBtn{
		  height: 36px;
		  padding: 0 14px;
		  border: 1px solid #ddd;
		  border-radius: 8px;
		  background: #fff;
		  cursor: pointer;
		  white-space: nowrap;
		}
		.searchBtn:hover { background: #f6f6f6; }
		/* 채팅 아이템 스타일 */
		.chat-item {
		    position: relative; /* [추가] 배지 위치의 기준점이 됩니다. */
		    padding: 16px;
		    border-bottom: 1px solid #f3f4f6;
		    cursor: pointer;
		    transition: background 0.2s;
		    height: 85px; /* [추가] 높이를 고정하면 더 안정적입니다. */
		    box-sizing: border-box; /* 패딩이 높이에 영향을 주지 않도록 설정 */
		}
		.chat-item:hover { background-color: #f9fafb; }
		
		.chat-info { display: flex; flex-direction: column; gap: 4px; }
		
		.chat-top { display: flex; justify-content: space-between; align-items: center; }
		.chat-name { font-weight: 600; font-size: 15px; color: #111827; }
		.chat-time { font-size: 12px; color: #9ca3af; }
		
		.chat-bottom { 
		    display: block;
		    font-size: 13px;
		    color: #6b7280;
		    overflow: hidden;
		    text-overflow: ellipsis;
		    white-space: nowrap;
		    margin-left: 37px;
		}
		.modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
		.modal-content { background: #fff; padding: 20px; border-radius: 12px; width: 350px; max-height: 80vh; display: flex; flex-direction: column; }
		.member-selector { flex: 1; overflow-y: auto; margin: 15px 0; border: 1px solid #eee; padding: 10px; }
		.member-item { padding: 8px 0; border-bottom: 1px solid #f9f9f9; }
		.inviteArea {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 16px;
        background-color: #f8f9fa; /* 영역 구분을 위해 약간의 배경색 추가 */
        border-bottom: 1px solid #e5e5e5;
    }
    
    .inviteArea {
	    display: flex;
	    justify-content: space-between;
	    align-items: center;
	    padding: 12px 16px;
	    background-color: #f8f9fa; /* 약간의 회색 배경으로 영역 구분 */
	    border-bottom: 1px solid #e5e5e5;
	}
	
	.inviteArea h3 {
	    margin: 0;
	    font-size: 16px;
	    font-weight: 700;
	    color: #333;
	}
	
	.invite-btn img {
	    width: 28px;
	    height: 28px;
	    cursor: pointer;
	    transition: opacity 0.2s;
	}
	
	.invite-btn img:hover {
	    opacity: 0.7;
	}
	.starBtn {
	    border: none; background: transparent; cursor: pointer; font-size: 18px;
	}
	.starOn { color: #f59e0b; } /* 활성: 노랑 */
	.starOff { color: #d1d5db; } /* 비활성: 회색 */
	
	/* 그룹채팅 생성 - 사원 초대 모달 */
	.modal-content.erp-style { 
	    width: 400px; 
	    height: 580px; 
	    padding: 0; 
	    overflow: hidden; 
	    border-radius: 12px; 
	    display: flex; 
	    flex-direction: column; /* 내부 요소들을 수직으로 배치 */
	    background: #fff;
	    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
	}
	.modal-header { padding: 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
	.modal-header h3 { margin: 0; font-size: 18px; color: #111827; }
	
	.modal-body { 
	    padding: 20px; 
	    display: flex; 
	    flex-direction: column; 
	    gap: 12px; 
	    flex: 1; 
	    overflow: hidden; 
	}
	
	/* 입력창 & 검색창 스타일 */
	.erp-input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid #e5e7eb; border-radius: 8px; box-sizing: border-box; }
	.erp-search-wrap { position: relative; }
	.erp-search-wrap input { background-color: #f9fafb; padding-left: 35px; }
	.erp-search-icon { position: absolute; left: 12px; top: 10px; color: #9ca3af; }
	
	/* 추가된 사원 확인바 */
	.selected-members-bar {
	    display: flex;
	    flex-wrap: wrap;
	    gap: 6px;
	    padding: 10px;
	    background-color: #f3f4f6;
	    border-radius: 8px;
	    max-height: 80px;
	    overflow-y: auto;
	}
	
	.selected-tag {
	    background-color: #2563eb;
	    color: white;
	    padding: 2px 8px;
	    border-radius: 15px;
	    font-size: 12px;
	    display: flex;
	    align-items: center;
	    gap: 4px;
	}
	
	.selected-tag .remove-btn {
	    cursor: pointer;
	    font-weight: bold;
	    font-size: 14px;
	}
	
	/* 사원 리스트 */
	.member-selector.erp-list { 
	    flex: 1; 
	    overflow-y: auto; 
	    border: 1px solid #f3f4f6; 
	    border-radius: 8px; 
	    margin: 0; 
	    background-color: #fff;
	}
	.invite-item { display: flex; align-items: center; padding: 10px 12px; border-bottom: 1px solid #f9fafb; cursor: pointer; }
	.invite-item:hover { background-color: #f3f4f6; }
	.invite-item .m-name { font-size: 14px; font-weight: 500; color: #1f2937; }
	.invite-item .m-dept { font-size: 12px; color: #6b7280; }
	
	.modal-footer { padding: 15px 20px; background: #f9fafb; display: flex; justify-content: flex-end; gap: 8px; }
	
	/* 그룹 채팅 생성 - 사원리스트 스크롤바 디자인 */
	.member-selector.erp-list::-webkit-scrollbar {
	    width: 6px;
	}
	.member-selector.erp-list::-webkit-scrollbar-track {
	    background: #f1f1f1;
	    border-radius: 8px;
	}
	.member-selector.erp-list::-webkit-scrollbar-thumb {
	    background: #d1d5db; /* 스크롤 바 색상 */
	    border-radius: 8px;
	}
	.member-selector.erp-list::-webkit-scrollbar-thumb:hover {
	    background: #9ca3af;
	}
	.invite-item.is-me {
	    opacity: 0.6;      
	    cursor: default;   
	    background-color: #f9fafb;
	}
	
	.invite-item.is-me:hover {
	    background-color: #f9fafb; 
	}
	
	/* 채팅 알림 */
	.unread-badge {
	    position: absolute; 
	    right: 16px;        
	    bottom: 18px;       
	    background-color: #ff3b30;
	    color: white;
	    font-size: 11px;
	    font-weight: bold;
	    min-width: 18px;
	    height: 18px;
	    line-height: 18px;
	    text-align: center;
	    border-radius: 9px;
	    padding: 0 5px;
	    z-index: 5;
	}
	</style>
</head>
<body>

<div class="wrapper">
	<div class="sidebar-area"
		 th:insert="~{messenger/messengerLayout :: messengerSidebar('chats')}">
	</div>
		
		<div class="main">
			<div class="searchBarArea">
			    <input id="chatSearch" type="text" class="searchBar" 
			           placeholder="채팅방 이름으로 검색" onkeyup="applySearch()">
			    <button type="button" class="searchBtn" onclick="applySearch()">검색</button>
			</div>
		
			<div class="inviteArea">
			    <h3>채팅 목록</h3>
			    <a href="javascript:void(0);" class="invite-btn" onclick="openInviteModal()">
			       <img th:src="@{/img/messenger/plus.png}" alt="그룹 채팅 초대"> 
			    </a>
			</div>
		
			<div class="chatList">
			    <div th:each="room : ${rooms}" class="chat-item" 
				     th:attr="data-room-id=${room.roomId}"
				     th:classappend="${room.isFavorite == 'Y'} ? 'favorite-room' : ''"
				     th:onclick="|openChatRoom(${room.roomId})|">
				    
				    <div class="chat-info">
				        <div class="chat-top">
				            <div style="display: flex; align-items: center; gap: 8px;">
				                <button type="button" class="starBtn"
				                        th:classappend="${room.isFavorite == 'Y'} ? 'starOn' : 'starOff'"
				                        th:onclick="'toggleFavoriteRoom(' + ${room.roomId} + ', this)'">★</button>
				                <span class="chat-name" th:text="${room.roomTitle}"></span>
				            </div>
				            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
				                <span class="chat-time" th:text="${room.lastTime}"></span>
				            </div>
				        </div>
				        
				        <div class="chat-bottom chat-preview" th:text="${room.lastMessage}">
				        </div>
				        
		                <span th:id="'unread-badge-' + ${room.roomId}" 
		                      class="unread-badge" 
		                      th:if="${room.unreadCount > 0}" 
		                      th:text="${room.unreadCount}"></span>
				    </div>
				</div>
				<input type="hidden" id="myId" th:value="${#authentication.principal.id}">
			</div>			<!-- chatList 종료 -->
			
		</div>			<!-- main 종료 -->
		
	<div id="inviteModal" class="modal" style="display:none;">
    <div class="modal-content erp-style">
        <div class="modal-header">
            <h3>그룹 채팅 초대</h3>
            <span class="close-btn" onclick="closeInviteModal()">&times;</span>
        </div>
        
        <div class="modal-body">
            <input type="text" id="groupRoomName" placeholder="채팅방 이름을 입력하세요" class="erp-input">
            
            <div class="erp-search-wrap">
                <input type="text" id="memberSearch" placeholder="사원명 또는 부서명으로 검색" 
                       onkeyup="filterInviteMembers()" class="erp-input">
                <span class="erp-search-icon">🔍</span>
            </div>
            
            <div id="selectedMembersBar" class="selected-members-bar" style="display: none;">
        </div>
            
            <div class="member-selector erp-list" id="inviteMemberList">
                <div th:each="member : ${memberList}" 
				     class="member-item invite-item" 
				     th:classappend="${member.memberId == #authentication.principal.id} ? 'is-me' : ''"
				     th:onclick="${member.memberId == #authentication.principal.id} ? '' : 'toggleCheckbox(this)'"> 
				           <input type="checkbox" name="selectedMembers" 
				           th:value="${member.memberId}" 
				           th:attr="data-name=${member.memberName}"
				           th:disabled="${member.memberId == #authentication.principal.id}"
				           class="erp-checkbox" 
				           onclick="event.stopPropagation(); updateSelectedDisplay();">
                    <div class="m-info">
                        <span class="m-name" 
			              	th:text="${member.memberId == #authentication.principal.id} ? ${member.memberName} + ' (나)' : ${member.memberName}">
				        </span>
                        <span class="m-dept" th:text="${member.departmentName}"></span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="modal-footer">
            <button class="searchBtn" onclick="closeInviteModal()">취소</button>
            <button class="searchBtn btn-primary" onclick="createGroupChat()">채팅방 생성</button>
        </div>
    </div>
</div>
		
</div>
	
<script>
var stompClient = null;

function connectList() {
    var socket = new SockJS("/ws");
    stompClient = Stomp.over(socket);
    var myId = document.getElementById("myId").value;

    stompClient.connect({}, function () {
        // 내 개인 목록 채널을 구독합니다.
        stompClient.subscribe("/topic/user/" + myId + "/list", function (message) {
            var payload = JSON.parse(message.body);
            updateChatList(payload);
        });
    });
}

// 채팅방 검색
function applySearch() {
    // 1. 입력창의 키워드 가져오기 (소문자 변환)
    var keyword = document.getElementById("chatSearch").value.toLowerCase();
    
    // 2. 모든 채팅 아이템 가져오기
    var items = document.querySelectorAll(".chat-item");

    items.forEach(function(item) {
        // 3. 각 아이템의 방 이름 가져오기
        var roomName = item.querySelector(".chat-name").textContent.toLowerCase();
        
        // 4. 키워드 포함 여부에 따라 보이기/숨기기
        if (roomName.indexOf(keyword) !== -1) {
            item.style.display = ""; // 보임 (기본값)
        } else {
            item.style.display = "none"; // 숨김
        }
    });
}

// 페이지 로드 시 연결 실행
connectList();

function openInviteModal() {
    document.getElementById("memberSearch").value = "";
    document.getElementById("groupRoomName").value = "";
    document.getElementById("selectedMembersBar").innerHTML = "";
    document.getElementById("selectedMembersBar").style.display = "none";
    
    const checkboxes = document.querySelectorAll('input[name="selectedMembers"]');
    checkboxes.forEach(cb => cb.checked = false);
    
    document.querySelectorAll(".invite-item").forEach(i => i.style.display = "flex");
    document.getElementById("inviteModal").style.display = "flex";
}

function closeInviteModal() {
    document.getElementById("inviteModal").style.display = "none";
}

function createGroupChat() {
    const roomName = document.getElementById("groupRoomName").value;
    const selected = Array.from(document.querySelectorAll('input[name="selectedMembers"]:checked'))
                          .map(cb => Number(cb.value));

    if (!roomName) return alert("방 이름을 입력해주세요.");
    if (selected.length < 1) return alert("초대할 멤버를 선택해주세요.");

    // AJAX를 통해 서버에 그룹방 생성 요청
    fetch('/messenger/createGroup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ roomName: roomName, memberIds: selected })
    })
    .then(res => res.json())
    .then(roomId => {
        closeInviteModal();
        // 생성된 방으로 바로 이동 (새 창 팝업)
        window.open('/messenger/chatroom/' + roomId, 'chatWindow_' + roomId, 'width=450,height=700');
        location.reload(); // 목록 갱신
    });
}

function toggleFavoriteRoom(roomId, btn) {
    event.stopPropagation();
    const isAdding = btn.classList.contains('starOff');
    const status = isAdding ? 'Y' : 'N';
    const myId = document.getElementById("myId").value;

    fetch('/messenger/api/favorite', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ roomId: roomId, myMemberId: myId, status: status })
    })
    .then(res => {
        if(res.ok) {
            location.reload(); // 즐겨찾기 순서 정렬을 위해 새로고침 권장
        }
        
        // 바로 적용을 위해 채팅방 새로고침
        var chatWin = window.open('', 'chatWindow_' + roomId);
        if (chatWin && !chatWin.closed && chatWin.location.href !== 'about:blank') {
            chatWin.location.reload();
        }
    });
}

// 채팅방 팝업창 열기 함수
function openChatRoom(roomId) {
    var w = 470;
    var h = 720;
    var left = Math.max(0, (screen.width - w) / 2);
    var top = Math.max(0, (screen.height - h) / 2);

    window.open(
        '/messenger/chatroom/' + roomId,
        'chatWindow_' + roomId,
        'width=' + w + ',height=' + h + ',left=' + left + ',top=' + top + ',resizable=yes,scrollbars=yes'
    );
}

//[통합] 실시간 채팅 목록 업데이트 함수
function updateChatList(msg) {
 // 1. 해당 채팅방 아이템과 배지, 사이드바 점 찾기
	const roomItem = document.querySelector(".chat-item[data-room-id='" + msg.roomId + "']");
	const badge = document.getElementById('unread-badge-' + msg.roomId);
	const sidebarDot = document.getElementById('main-unread-dot'); // layout/messengerLayout 통합 ID
	const myId = Number(document.getElementById("myId").value);
	
	// 읽음 신호(READ) 처리
	if (msg.msgType === 'READ') {
	    // 내가 읽은 경우 해당 방의 빨간 숫자 숨기기
	    if (msg.memberId === myId && badge) {
	        badge.style.display = 'none';
	        badge.textContent = '0';
	    }
	    
	    // 전체 안 읽은 메시지가 더 있는지 서버에 확인하여 사이드바 점 갱신
	    fetch('/messenger/api/unread-exists')
	        .then(res => res.json())
	        .then(exists => {
	            if (sidebarDot) sidebarDot.style.display = exists ? 'block' : 'none';
	        });
	    return;
	}
	
	// 새 메시지 수신 처리
	if (roomItem) {
	    // 미리보기 텍스트와 시간 업데이트
	    const preview = roomItem.querySelector(".chat-preview");
	    const time = roomItem.querySelector(".chat-time");
	    
	    if (preview) preview.textContent = msg.content;
	    if (time) time.textContent = msg.formattedTime;
	
	    // 내가 보낸 게 아닌 경우에만 숫자 배지 업데이트
	    if (msg.memberId !== myId) {
	        if (badge) {
	            // 이미 배지가 있는 경우 숫자 +1
	            badge.style.display = 'inline-block';
	            const currentCount = parseInt(badge.textContent) || 0;
	            badge.textContent = currentCount + 1;
	        } else {
	            // th:if 때문에 배지 요소가 아예 없었다면 새로고침해서 생성
	            location.reload(); 
	        }
	        
	        // 사이드바 알림 점 켜기
	        if (sidebarDot) sidebarDot.style.display = 'block';
	    }
	
	    // 즐겨찾기 방이 아니면 목록 맨 위로 올리기
	    if (!roomItem.classList.contains('favorite-room')) {
	        const listContainer = document.querySelector(".chatList");
	        listContainer.prepend(roomItem);
	    }
	} else {
	    // 목록에 없는 새로운 방에서 메시지가 온 경우 목록 새로고침
	    location.reload(); 
	}
}

// 채팅 목록(chatList) 페이지에 들어오면 빨간 점을 숨김
document.addEventListener("DOMContentLoaded", function() {
    // 요소가 존재하는지 먼저 확인 (Null 체크)
    var sidebarDot = document.getElementById('sidebar-unread-dot');
    if (sidebarDot && window.location.pathname.includes('/messenger/chatList')) {
        sidebarDot.style.display = 'none';
    }
});

function filterInviteMembers() {
    const keyword = document.getElementById("memberSearch").value.toLowerCase();
    const items = document.querySelectorAll(".invite-item");

    items.forEach(item => {
        const name = item.querySelector(".m-name").textContent.toLowerCase();
        const dept = item.querySelector(".m-dept").textContent.toLowerCase();
        
        // 이름이나 부서명에 키워드가 포함되면 표시
        if (name.includes(keyword) || dept.includes(keyword)) {
            item.style.display = "flex";
        } else {
            item.style.display = "none";
        }
    });
}

function updateSelectedDisplay() {
    const selectedBar = document.getElementById("selectedMembersBar");
    const checkboxes = document.querySelectorAll('input[name="selectedMembers"]:checked');
    
    selectedBar.innerHTML = ""; // 기존 내용 초기화

    if (checkboxes.length > 0) {
        selectedBar.style.display = "flex";
        checkboxes.forEach(cb => {
            const name = cb.getAttribute("data-name");
            const tag = document.createElement("div");
            tag.className = "selected-tag";
            tag.innerHTML = `
                <span>${name}</span>
                <span class="remove-btn" onclick="removeMember('${cb.value}')">&times;</span>
            `;
            selectedBar.appendChild(tag);
        });
    } else {
        selectedBar.style.display = "none";
    }
}

/* 선택된 사원을 X 버튼을 눌러 선택 취소하는 함수 */
function removeMember(memberId) {
    const cb = document.querySelector(`input[name="selectedMembers"][value="${memberId}"]`);
    if (cb) {
        cb.checked = false;
        updateSelectedDisplay();
    }
}

/* 체크박스 제외한 항목 부분을 클릭해도 체크박스가 선택되게 하는 함수 */
function toggleCheckbox(item) {
    const cb = item.querySelector('input[type="checkbox"]');
    
    if(cb.disabled) return;
    
    cb.checked = !cb.checked;
    updateSelectedDisplay();
}

window.addEventListener('message', function(e) {
	  if (!e || !e.data) return;
	  if (e.data.type === 'REFRESH_LIST') {
	    location.reload();
	  }
	});

</script>	

<div th:replace="~{messenger/messengerLayout :: messengerScript}"></div>
	
</body>
</html>
