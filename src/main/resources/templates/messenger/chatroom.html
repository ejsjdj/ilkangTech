<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
	<meta charset="UTF-8">
	<title>채팅</title>
	<style>
    html, body { height: 100%; margin: 0; }
    .wrap { height: 100vh; display: flex; flex-direction: column; }
    .header {
	    height: 52px;
	    border-bottom: 1px solid #e5e5e5;
	    display: flex;
	    align-items: center;
	    padding: 0 16px;
	    background-color: #fff;
	}
	.header strong {
	    flex: 1;
	    font-size: 16px;
	    color: #333;
	    overflow: hidden;
	    text-overflow: ellipsis;
	    white-space: nowrap;
	}
	.header-btns {
	    display: flex;
	    gap: 12px;
	    line-height: 0px;
	}
	.header-btns img {
	    width: 22px;
	    height: 22px;
	    cursor: pointer;
	    opacity: 0.6;
	    transition: all 0.2s ease;
	}
	.header-btns img:hover {
	    opacity: 1;
	    transform: scale(1.1);
	}
    .messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column;}
    .msg { 
	    padding: 6px 8px; 
	    border-radius: 12px; 
	    height: auto;
	    word-break: break-all; /* 영문/숫자도 박스 내 줄바꿈 */
	}
	.msg { margin-bottom: 0 !important; } /* 기존 여백 제거 */
    .mine { align-self: flex-end;}
    .inputBar { border-top: 1px solid #e5e5e5; padding: 10px; display:flex; gap:8px; align-items: center;}
    .input { flex: 1; height: 38px; border: 1px solid #ddd; border-radius: 8px; padding: 0 10px; }
    .btn { width: 72px; height: 38px; border: none; border-radius: 8px; cursor: pointer; }
	.msgWrap { display: flex; align-items: flex-end; margin-bottom: 12px; gap: 6px; width: fit-content;}
	.msgWrap.mine {
	    align-self: flex-end;
	    flex-direction: row !important; /* row-reverse를 확실히 해제 */
	    justify-content: flex-end;    /* 전체 덩어리를 오른쪽으로 밀기 */
	    display: flex;
	    align-items: flex-end;        /* 숫자와 시간이 말풍선 하단에 붙도록 함 */
	    gap: 4px;                     /* 요소들 사이의 미세한 간격 */
	}
	.msgWrap.mine .content {
	    background-color: #fee500;
	    text-align: left;             /* 말풍선 내 글자는 왼쪽 정렬 */
	    margin-left: 4px;             /* 시간과 말풍선 사이 간격 */
	}
	
	.time { font-size: 11px; color: #888; white-space: nowrap; margin-bottom: 2px; }
	.msg-container { 
	    display: flex; 
	    flex-direction: column; 
	    max-width: 100%; 
	    min-width: 60px; 
	}
	.mine .msg-container { align-items: flex-end; }
	.mine .msg {
	    background-color: #eee;
	    border: none;
	}
	.sender-name {
	    font-size: 11px;
	    color: #666;
	    margin-bottom: 2px;
	    margin-left: 2px;
	}
	.mine .sender-name { display: none; } /* 내가 보낸 건 이름을 숨기고 싶을 때 */
	
	/* 메시지와 시간 가로 정렬 */
	.msg-row { display: flex; align-items: flex-end; gap: 6px; }
	
	.mine .msg-row {
	    flex-direction: row; /* row-reverse 대신 row 유지 */
	}
	
	.mine .msg-row .msg {
	    order: 3; /* 말풍선을 가장 오른쪽으로 */
	}
	
	.mine .msg-row .time {
	    order: 2; /* 시간을 중간으로 */
	    margin-left: 4px;
	}
	
	.mine .msg-row .unread-count {
	    order: 1; /* 숫자를 가장 왼쪽으로 */
	}
	/* 시스템 메시지 스타일 */
	.system-msg {
	    width: 100%;
	    text-align: center;
	    margin: 15px 0;
	}
	.system-msg span {
	    background-color: #f0f0f0;
	    color: #666;
	    padding: 4px 12px;
	    border-radius: 12px;
	    font-size: 12px;
	}
	/* 읽음 확인 숫자 */
	.unread-count {
	    color: #1f3bff;
	    font-size: 10px;
	    font-weight: bold;
	    margin: 0 4px;
	    vertical-align: bottom;
	}
	
	.msg-item {
	    display: flex;
	    align-items: flex-end; /* 숫자와 시간을 말풍선 하단에 맞춤 */
	    margin-bottom: 10px;
	}
	.participants-drawer {
    position: fixed;
    top: 0;
    right: -280px; 
    width: 280px;
    height: 100%;
    background-color: #fff;
    box-shadow: -3px 0 10px rgba(0,0,0,0.1);
    transition: right 0.3s ease-out;
    z-index: 1001;
    display: flex;
    flex-direction: column;
}

	.participants-drawer.active {
	    right: 0; /* 열림 상태 */
	}
	
	.participants-overlay {
	    display: none;
	    position: fixed;
	    top: 0; left: 0;
	    width: 100%; height: 100%;
	    background: rgba(0,0,0,0.4);
	    z-index: 1000;
	}
	
	.participants-overlay.active {
	    display: block;
	}
	
	.participants-header {
	    padding: 16px;
	    border-bottom: 1px solid #eee;
	    display: flex;
	    justify-content: space-between;
	    align-items: center;
	}
	
	.participants-header h3 { margin: 0; font-size: 16px; }
	
	.close-btn { font-size: 24px; cursor: pointer; color: #888; }
	
	.participants-list {
	    flex: 1;
	    overflow-y: auto;
	    padding: 10px 16px;
	}
	
	.participant-item {
	    display: flex;
	    flex-direction: column; /* 세로 정렬 */
	    align-items: flex-start;
	    padding: 10px 0;
	    border-bottom: 1px solid #fafafa;
	}
	.participant-name {
	    font-size: 17px;
	    font-weight: 500;
	    color: #333;
	}
	.participant-info {
	    font-size: 13px;
	    color: #999; /* 부서/직급은 흐릿하게 표시 */
	    margin-top: 2px;
	}
	.participantsBtn img {
		width: 27px;
		height: 27px;
		margin-top: 2px;
	}
	.editBtn img {
		width: 27px;
		height: 27px;
	}
	.exitBtn img {
		margin-top: 3px;
	}
	.favorite-btn {
	    font-size: 22px;
	    cursor: pointer;
	    line-height: 1;
	    margin-right: 10px; /* 버튼 사이 간격 */
	    transition: transform 0.1s ease;
	    text-decoration: none;
	}
	.favorite-btn:hover { transform: scale(1.2); }
	.starOn { color: #f59e0b; } /* 노란색 */
	.starOff { color: #d1d5db; } /* 회색 */
	.img-preview {
	    max-width: 200px;
	    max-height: 200px;
	    object-fit: cover; /* 영역에 맞게 자르기 */
	    border: 1px solid #e5e7eb;
	    margin-top: 5px;
	    display: block;
	}
	
	.chat-file-msg a {
	    display: inline-flex;
	    align-items: center;
	    gap: 5px;
	    padding: 8px;
	    background: #f8f9fa;
	    border-radius: 8px;
	}
	.unread-divider {
	    display: flex;
	    align-items: center;
	    justify-content: center;
	    margin: 30px 0 !important;
	    position: relative;
	}
	.unread-divider::before {
	    content: "";
	    position: absolute;
	    left: 0;
	    top: 50%;
	    width: 100%;
	    height: 1px;
	    background-color: #ffd600;
	    z-index: 1;
	}
	.unread-divider span {
	    position: relative;
	    z-index: 2;
	    background-color: #fff9c4 !important;
	    color: #f57f17 !important;
	    padding: 4px 15px;
	    border-radius: 20px;
	    font-size: 12px;
	    border: 1px solid #ffd600 !important;
	}
  </style>
</head>
<body>
<div class="wrap">
	<!-- 채팅방 상단 채팅방명, 여러 버튼들 -->
	<div class="header">
	    <strong th:text="${displayTitle}"></strong>
	    
	    <a href="javascript:void(0);" id="favoriteBtn" class="favorite-btn"
           th:classappend="${isFavorite == 'Y'} ? 'starOn' : 'starOff'"
           onclick="toggleFavoriteInRoom()">★</a>
	    
	    <div class="header-btns">
	        <a href="javascript:void(0);" class="participantsBtn" onclick="openChatParticipants()">
	            <img th:src="@{/img/messenger/participants.png}" alt="채팅 참여자 목록">
	        </a>
	        
	        <a href="javascript:void(0);" class="editBtn" onclick="renameRoom()">
	            <img th:src="@{/img/messenger/edit.png}" alt="이름 편집">
	        </a>
	        
	        <a href="javascript:void(0);" class="exitBtn" onclick="leaveAndClose()">
			    <img th:src="@{/img/messenger/out.png}" alt="나가기">
			</a>
	    </div>
	</div>

	<!-- 채팅 올라오는 영역 -->
	<div id="messages" class="messages">
    	<th:block th:each="msg : ${chatHistory}">
    
        <div th:if="${msg.isFirstUnread and msg.memberId != myMemberId}" class="unread-divider">
            <span>여기까지 읽으셨습니다</span>
        </div>
    
        <div th:if="${msg.msgType == 'SYSTEM'}" class="system-msg">
            <span th:text="${msg.content}"></span>
        </div>

        <div th:unless="${msg.msgType == 'SYSTEM'}"
		     class="msgWrap"
		     th:classappend="${#strings.equals(msg.memberId, myMemberId)} ? 'mine' : ''"
		     th:attr="data-member-id=${msg.memberId}, data-my-id=${myMemberId}">
             
            <div class="msg-container">
                <div class="sender-name" 
                     th:if="${msg.memberId != myMemberId}" 
                     th:text="${msg.memberName}"></div>
                     
                <div class="msg-row">
                    <div class="msg">
                        <span th:if="${msg.msgType == 'TEXT'}" th:text="${msg.content}"></span>
                        <div th:if="${msg.msgType == 'IMAGE'}" class="chat-file-msg">
                             <img th:src="@{'/messenger/download/' + ${msg.attachId}}" class="img-preview" style="max-width:200px; border-radius:10px;">
                        </div>
                    </div>
                    <span class="time" th:text="${#temporals.format(msg.createdAt, 'a h:mm')}"></span>
                    <span class="unread-count" th:if="${msg.unreadCount > 0}" th:text="${msg.unreadCount}"></span>
                    
                </div>
            </div>
        </div>
    	</th:block>
	</div>

	<div class="inputBar">
		<label for="file-upload" class="attach-btn" style="cursor:pointer;">
	        <img th:src="@{/img/messenger/clip.png}" alt="첨부" style="width:24px; height:24px;">
	    </label>
	    <input type="file" id="file-upload" style="display:none;" onchange="uploadFile(this)">
	
		<input id="text" class="input" type="text" placeholder="메시지 입력" />
		<button class="btn" type="button" onclick="sendMsg()">전송</button>
	</div>
</div>

<div id="participants-overlay" class="participants-overlay" onclick="closeParticipants()"></div>

<div id="participants" class="participants-drawer">
    <div class="participants-header">
        <h3>대화 상대</h3>
        <span class="close-btn" onclick="closeParticipants()">&times;</span>
    </div>
    <div id="participants-list" class="participants-list">
    </div>
</div>

<input type="hidden" id="roomId" th:value="${roomId}">
<input type="hidden" id="myMemberId" th:value="${myMemberId}">

<script>
var stompClient = null;
var isFirstLoad = true;
var isInitialLoadComplete = false;
var firstUnreadId = null;

// 서버와의 연결 관리 함수
function connect() {
  var socket = new SockJS("/ws");
  stompClient = Stomp.over(socket);

  stompClient.connect({}, function () {
    var roomId = document.getElementById("roomId").value;
    console.log("WebSocket 연결 성공 - 방 ID: " + roomId);

    stompClient.subscribe('/topic/chatroom/' + roomId, function (message) {
        var payload = JSON.parse(message.body);

        if (payload.msgType === 'READ') {
            // 읽음 신호가 오면 숫자만 업데이트
            refreshUnreadCounts(); 
        } else {
            // 새 메시지가 오면 즉시 화면에 추가
            appendMessage(payload);
            // 이때 스크롤을 하단으로 내려줌
            scrollToBottom();
        }
    })
    
    // 연결 상태 모니터링
    stompClient.debug = function(str) {
      console.log("STOMP Debug: " + str);
    };
  }, function (error) {
    console.error("WebSocket 연결 실패:", error);
    // 3초 후 재연결 시도
    setTimeout(connect, 3000);
  });
}

// 사용자가 입력한 채팅을 서버로 전송하는 함수
function sendMsg() {
	  if (!stompClient || !stompClient.connected) {
	      console.error("WebSocket이 연결되지 않았습니다.");
	      return;
	  }

	  var roomId = document.getElementById("roomId").value;
	  var myMemberId = document.getElementById("myMemberId").value; // 내 아이디 가져오기 추가
	  var textEl = document.getElementById("text");
	  var content = textEl.value.trim();
	  
	  if (content === "") return;

	  var body = {
	    roomId: Number(roomId),
	    memberId: Number(myMemberId), 
	    content: content,
	    msgType: 'TEXT' // DB 제약조건에 msgType도 NOT NULL이므로 명시해주는 것이 안전합니다.
	  };

	  console.log("메시지 전송:", body);
	  stompClient.send("/app/chat.send", {}, JSON.stringify(body));
	  textEl.value = "";
	  
	  setTimeout(scrollToBottom, 100);
	  
	  setTimeout(function () {
		  refreshUnreadCounts();
		}, 300);
	}

function appendMessage(msg) {
    var box = document.getElementById("messages");
    
    // 1. 중복 방지 (이미 화면에 있는 메시지인지 ID 등으로 체크하면 좋음. 여기선 생략)
    if (msg.msgType === 'SYSTEM') {
        var sysDiv = document.createElement("div");
        sysDiv.className = "system-msg";
        sysDiv.innerHTML = "<span>" + msg.content + "</span>";
        box.appendChild(sysDiv);
        scrollToBottom();
        return;
    }

    var myMemberId = Number(document.getElementById("myMemberId").value);
    var isMine = (Number(msg.memberId) === myMemberId);

    // 2. 메시지 감싸는 wrap 생성
    var wrap = document.createElement("div");
    wrap.className = "msgWrap" + (isMine ? " mine" : "");

    // 3. 내부 컨텐츠 생성 (formatMessage 활용)
    var innerContent = formatMessage(msg);
    
    var container = document.createElement("div");
    container.className = "msg-container";

    // 이름 표시 (상대방일 때만)
    if (!isMine) {
        var nameDiv = document.createElement("div");
        nameDiv.className = "sender-name";
        nameDiv.textContent = msg.memberName;
        container.appendChild(nameDiv);
    }

    // 메시지 로우 (말풍선 + 시간 + 숫자)
    var row = document.createElement("div");
    row.className = "msg-row";

    var contentDiv = document.createElement("div");
    contentDiv.className = "msg";
    contentDiv.innerHTML = innerContent;

    var timeSpan = document.createElement("span");
    timeSpan.className = "time";
    timeSpan.textContent = msg.formattedTime || new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });

    // 배치 순서 결정
    if (isMine) {
        // 내가 보낸 경우: [안읽음숫자] [시간] [말풍선]
        if (msg.unreadCount > 0) {
            var countSpan = document.createElement("span");
            countSpan.className = "unread-count";
            countSpan.textContent = msg.unreadCount;
            row.appendChild(countSpan);
        }
        row.appendChild(timeSpan);
        row.appendChild(contentDiv);
    } else {
        // 남이 보낸 경우: [말풍선] [시간] [안읽음숫자]
        row.appendChild(contentDiv);
        row.appendChild(timeSpan);
        if (msg.unreadCount > 0) {
            var countSpan = document.createElement("span");
            countSpan.className = "unread-count";
            countSpan.textContent = msg.unreadCount;
            row.appendChild(countSpan);
        }
    }

    container.appendChild(row);
    wrap.appendChild(container);
    box.appendChild(wrap);

    // 4. 추가 후 즉시 하단 스크롤
    scrollToBottom();
    
    // 5. 내가 받은 메시지라면 '읽음' 처리 실행
    if (!isMine) {
        readObserver.observe(wrap); 
    }
}

// 페이지 로드 시 실행되는 함수
document.addEventListener("DOMContentLoaded", function() {
    // 1. 엔터키 메시지 전송 이벤트 등록(엔터키 입력 시 채팅이 전송되도록)
    const textInput = document.getElementById("text");
    if (textInput) {
    	textInput.addEventListener("keyup", function(event) {
    		  if (event.key === "Enter") {
    		    event.preventDefault();
    		    sendMsg();
    		  }
    	});
    }

    // 스크롤 위치 제어(안 읽은 메시지가 존재할 때에만 가장 하단으로)
    const firstUnread = document.querySelector('.first-unread');
    if (firstUnread) firstUnread.scrollIntoView({ behavior: 'auto', block: 'center' });
	else scrollToBottom();


    // 읽음 처리 및 가시성 감시
    setTimeout(() => {
        observeMessages();
        markAsRead();
        refreshUnreadCounts();
    }, 500);
});

// 마지막으로 불러온 메시지의 개수를 저장
var lastMsgCount = 0; 

// 화면을 싹 지우고 다시 그리는 함수
function renderMessages(chatList) {
  var box = document.getElementById("messages");
  var myMemberId = Number(document.getElementById("myMemberId").value);

  var html = "";

  chatList.forEach(function(msg) {

    // (id 없으면 index/flag로만 처리하거나 createdAt 기준으로 처리)
    if (msg.isFirstUnread && Number(msg.memberId) !== myMemberId) {
      html += '<div class="system-msg unread-divider"><span>여기까지 읽으셨습니다</span></div>';
    }

    if (msg.msgType === "SYSTEM") {
      html += '<div class="system-msg"><span>' + (msg.content || "") + '</span></div>';
      return;
    }

    var isMine = (msg.memberId != null && Number(msg.memberId) === myMemberId);
    var mineClass = isMine ? " mine" : "";
    var firstUnreadClass = msg.isFirstUnread ? " first-unread" : "";

    var nameHtml = !isMine ? '<div class="sender-name">' + (msg.memberName || "") + '</div>' : "";
    var unreadHtml = (msg.unreadCount > 0) ? '<span class="unread-count">' + msg.unreadCount + '</span>' : "";
    var timeHtml = '<span class="time">' + (msg.formattedTime || "") + '</span>';

    var innerContent = formatMessage(msg);

    var rowContent = "";
    if (isMine) {
        rowContent = '<div class="msg" style="order:3;">' + innerContent + '</div> ' 
                   + '<span class="time" style="order:2;">' + (msg.formattedTime || "") + '</span> '
                   + (msg.unreadCount > 0 ? '<span class="unread-count" style="order:1;">' + msg.unreadCount + '</span>' : "");
    } else {
        rowContent = '<div class="msg">' + innerContent + "</div> " 
                   + '<span class="time">' + (msg.formattedTime || "") + "</span> " 
                   + unreadHtml;
    }
  });

  box.innerHTML = html;
  observeMessages();
}


// 채팅방 이름 변경 함수
function renameRoom() {
    var roomId = document.getElementById("roomId").value;
    var newName = prompt("변경할 채팅방 이름을 입력해주세요.");
    
    if (!newName || newName.trim() === "") return;

    fetch('/messenger/api/rename', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ roomId: Number(roomId), newName: newName })
    })
    .then(res => {
        if(res.ok) {
            alert("방 이름이 변경되었습니다.");
            
            // 부모 채팅창(채팅 리스트창)이 열려 있으면 새로고침
            if (window.opener && !window.opener.closed) {
                window.opener.location.reload();
            }
            
            location.reload(); // 제목 갱신을 위해 새로고침
        }
    });
}

function leaveAndClose() {
    if (!confirm('정말 이 채팅방을 나가시겠습니까? 나가면 대화 내용이 모두 삭제됩니다.')) return;

    var roomId = document.getElementById("roomId").value;

    // 서버에 나가기 요청 (POST 방식 권장)
    fetch('/messenger/api/leave/' + roomId, {
        method: 'POST'
    })
    .then(res => {
        if (res.ok) {
            // 1. 부모 창(채팅 목록 페이지)이 열려있다면 새로고침
            if (window.opener && !window.opener.closed) {
                window.opener.location.reload();
            }
            // 2. 현재 채팅방 창 닫기
            window.close();
        } else {
            alert("나가기 처리 중 오류가 발생했습니다.");
        }
    })
    .catch(err => console.error("Error:", err));
}

// 참여자 목록 열기
function openChatParticipants() {
    const drawer = document.getElementById('participants');
    const overlay = document.getElementById('participants-overlay');
    
    drawer.classList.add('active');
    overlay.classList.add('active');
    
    loadParticipants(); // 목록 새로고침
}

// 참여자 목록 닫기
function closeParticipants() {
    const drawer = document.getElementById('participants');
    const overlay = document.getElementById('participants-overlay');
    
    drawer.classList.remove('active');
    overlay.classList.remove('active');
}

function loadParticipants() {
    var roomId = document.getElementById("roomId").value;
    var listContainer = document.getElementById("participants-list");
    var myId = Number(document.getElementById("myMemberId").value);
    
    fetch('/messenger/api/members/' + roomId)
        .then(res => res.json())
        .then(members => {
            listContainer.innerHTML = ""; 
            members.forEach(m => {
                var item = document.createElement("div");
                item.className = "participant-item"; 
                
                // 1. 이름 영역
                var nameDiv = document.createElement("div");
                nameDiv.className = "participant-name";
                var displayName = m.memberName;
                if (Number(m.memberId) === myId) {
                    displayName += " (나)";
                }
                nameDiv.textContent = displayName;
                
                // 2. 부서 / 직급 정보 영역
                var infoDiv = document.createElement("div");
                infoDiv.className = "participant-info";
                infoDiv.textContent = m.deptName + " / " + m.positionName;

                // 3. 구성 요소 합치기
                item.appendChild(nameDiv);
                item.appendChild(infoDiv);
                listContainer.appendChild(item);
            });
        })
        .catch(err => console.error("멤버 로드 실패:", err));
}

function toggleFavoriteInRoom() {
    const btn = document.getElementById("favoriteBtn");
    const isAdding = btn.classList.contains('starOff');
    const status = isAdding ? 'Y' : 'N';
    const roomId = document.getElementById("roomId").value;
    const myId = document.getElementById("myMemberId").value;

    fetch('/messenger/api/favorite', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ roomId: Number(roomId), myMemberId: Number(myId), status: status })
    }).then(res => {
        if (res.ok) {
            btn.classList.toggle('starOn');
            btn.classList.toggle('starOff');
            
            // 1. BroadcastChannel을 통해 열려있는 모든 채팅창에 알림
            if (window.BroadcastChannel) {
                const bc = new BroadcastChannel('messenger_sync');
                bc.postMessage({ type: 'ROOM_FAVORITE_CHANGED', roomId: roomId, status: status });
            }
            // 2. 부모 창(채팅 리스트) 즉시 갱신
            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({ type: 'REFRESH_LIST' }, "*");
            }
        }
    });
}

// 파일 업로드
function uploadFile(input) {
    if (!input.files || !input.files[0]) return;

    const roomId = document.getElementById("roomId").value;
    const myMemberId = document.getElementById("myMemberId").value;
    const file = input.files[0];
    const formData = new FormData();
    formData.append("file", file);
    formData.append("roomId", roomId);

    fetch('/messenger/api/upload', {
        method: 'POST',
        body: formData 
    })
    .then(res => res.json())
    .then(attach => {
        const fileMsg = {
            roomId: Number(roomId),
            memberId: Number(myMemberId),
            memberName: "나", // 본인 이름
            content: attach.originalName, 
            msgType: attach.isImage === 'Y' ? 'IMAGE' : 'FILE',
            attachId: attach.id,
            formattedTime: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' }),
            unreadCount: 1 // 1:1 채팅이면 일단 1로 표시
        };
        
        // [수정] 전체 리스트를 다시 그리지 않고 방금 보낸 파일만 화면에 붙임
        stompClient.send("/app/chat.send", {}, JSON.stringify(fileMsg));
        input.value = ""; 
    })
    .catch(err => alert("파일 전송 오류: " + err.message));
}

//chatroom.html 내부의 formatMessage 함수 전체 수정
function formatMessage(msg) {
	if (msg.msgType === "IMAGE") {
	    return ''
	      + '<div class="chat-file-msg" style="display:flex; flex-direction:column; gap:8px;">'
	      // 클릭 시 /view/ 주소로 연결하여 새 창에서 원본 보기
	      +   '<a href="/messenger/view/' + msg.attachId + '" target="_blank">' 
	      +     '<img src="/messenger/download/' + msg.attachId + '" class="img-preview" '
	      +          'onload="scrollToBottom()" style="max-width:200px; border-radius:10px; cursor:pointer; display:block;">'
	      +   '</a>'
	      // 다운로드 버튼은 기존 /download/ 주소 유지
	      +   '<a href="/messenger/download/' + msg.attachId + '" class="file-link" ...>'
	      +     '<span class="icon">📎</span>'
	      +     '<span class="file-name">' + (msg.content || "") + '</span>'
	      +     '<span class="download-text">(다운로드)</span>'
	      +   '</a>'
	      + '</div>';
	  }

  if (msg.msgType === "FILE") {
    return ''
      + '<div class="chat-file-msg">'
      +   '<a href="/messenger/download/' + msg.attachId + '" class="file-link" '
      +      'style="text-decoration:none; color:#2563eb; display:flex; align-items:center; gap:5px;">'
      +     '<span class="icon">📎</span>'
      +     '<span class="file-name" style="word-break:break-all;">' + (msg.content || "") + '</span>'
      +     '<span class="download-text" style="font-size:11px; color:#9ca3af;">(다운로드)</span>'
      +   '</a>'
      + '</div>';
  }

  return '<span class="msg-text">' + (msg.content || "") + '</span>';
}



//chatroom.html 스크립트 부분 수정

function refreshUnreadCounts() {
    var roomId = document.getElementById("roomId").value;
    
    fetch('/messenger/api/chat/' + roomId)
        .then(res => res.json())
        .then(chatList => {
            // 모든 메시지 묶음을 가져옴
            const msgWraps = document.querySelectorAll('.msgWrap');
            
            chatList.forEach((msg, index) => {
                // [주의] index 기반은 구분선이 있으면 밀릴 수 있으므로 
                // 실제 서비스 시에는 msg-id 속성을 활용하는 것이 좋습니다.
                const wrap = msgWraps[index];
                if (!wrap) return;

                const countSpan = wrap.querySelector('.unread-count');
                const row = wrap.querySelector('.msg-row');
                
                if (msg.unreadCount > 0) {
                    if (countSpan) {
                        countSpan.textContent = msg.unreadCount;
                    } else {
                        // 새로 숫자가 생겨야 하는 경우
                        const newSpan = document.createElement('span');
                        newSpan.className = 'unread-count';
                        newSpan.textContent = msg.unreadCount;
                        row.appendChild(newSpan); // CSS row-reverse가 위치를 잡아줌
                    }
                } else if (countSpan) {
                    countSpan.remove();
                }
            });
        });
}

function scrollToBottom() {
    var box = document.getElementById("messages");
    box.scrollTop = box.scrollHeight;
}

(function () {
    if (!('BroadcastChannel' in window)) return;

    var bc = new BroadcastChannel('messenger_sync');

    bc.onmessage = function (e) {
        var msg = e.data || {};
        if (msg.type !== 'ROOM_FAVORITE_CHANGED') return;

        var myRoomId = Number(document.getElementById("roomId").value);
        if (Number(msg.roomId) !== myRoomId) return;

        var btn = document.getElementById("favoriteBtn");
        if (!btn) return;

        if (msg.status === 'Y') {
            btn.classList.add('starOn');
            btn.classList.remove('starOff');
        } else {
            btn.classList.add('starOff');
            btn.classList.remove('starOn');
        }
    };
})();

//readObserver 설정 변경 (더 민감하게)
const readObserver = new IntersectionObserver((entries, observer) => {
  entries.forEach(entry => {
    if (!entry.isIntersecting) return;

    const roomId = document.getElementById("roomId").value;

    fetch("/messenger/api/read/" + roomId, { method: "POST" })
      .then(res => {
        if (!res.ok) throw new Error("read failed");
        observer.unobserve(entry.target);

        // [수정] 화면 전체를 다시 그리지 말고 숫자만 UI에서 제거/변경
        // 서버에 웹소켓으로 내가 읽었음을 알림
        if (stompClient && stompClient.connected) {
          stompClient.send("/app/chat.read", {}, JSON.stringify({ roomId: Number(roomId) }));
        }
        
        // 내 화면의 안 읽은 숫자 UI 업데이트 (새로고침 없이)
        const counts = entry.target.querySelectorAll('.unread-count');
        counts.forEach(c => c.remove());
      })
      .catch(err => console.error(err));
  });
}, { threshold: 0.5 }); // 50% 이상 보일 때 읽은 것으로 간주


// 메시지 감시 시작 함수
function observeMessages() {
    // 내가 보낸 메시지를 제외하고 상대방 메시지들만 감시
    const messages = document.querySelectorAll('.msgWrap:not(.mine)');
    messages.forEach(msg => readObserver.observe(msg));
}

function markAsRead() {
    var roomId = document.getElementById("roomId").value;
    fetch('/messenger/api/read/' + roomId, { method: 'POST' })
        .then(res => {
            if (res.ok) {
                const unreadSpans = document.querySelectorAll('.msgWrap:not(.mine) .unread-count');
                unreadSpans.forEach(span => span.remove());
            }
        });
}
