<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
	<meta charset="UTF-8">
	<title>채팅</title>
	<style>
    html, body { height: 100%; margin: 0; }
    .wrap { height: 100vh; display: flex; flex-direction: column; }
    .header {
	    height: 52px;
	    border-bottom: 1px solid #e5e5e5;
	    display: flex;
	    align-items: center;
	    padding: 0 16px;
	    background-color: #fff;
	}
	.header strong {
	    flex: 1;
	    font-size: 16px;
	    color: #333;
	    overflow: hidden;
	    text-overflow: ellipsis;
	    white-space: nowrap;
	}
	.header-btns {
	    display: flex;
	    gap: 12px;
	    align-items: center;
	}
	.header-btns img {
	    width: 22px;
	    height: 22px;
	    cursor: pointer;
	    opacity: 0.6;
	    transition: all 0.2s ease;
	}
	.header-btns img:hover {
	    opacity: 1;
	    transform: scale(1.1);
	}
    .messages { flex: 1; overflow-y: auto; padding: 12px; }
    .msg { padding: 8px 10px; border: 1px solid #eee; border-radius: 10px; margin-bottom: 8px; max-width: 80%; }
    .mine { margin-left: auto; }
    .inputBar { border-top: 1px solid #e5e5e5; padding: 10px; display:flex; gap:8px; }
    .input { flex: 1; height: 38px; border: 1px solid #ddd; border-radius: 8px; padding: 0 10px; }
    .btn { width: 72px; height: 38px; border: none; border-radius: 8px; cursor: pointer; }
	.msgWrap { display: flex; align-items: flex-end; margin-bottom: 12px; gap: 6px; }
	.msgWrap.mine { flex-direction: row-reverse; } /* 내가 보낸 건 시간-메시지 순서 */
	.msg { margin-bottom: 0 !important; } /* 기존 여백 제거 */
	.time { font-size: 11px; color: #888; white-space: nowrap; margin-bottom: 2px; }
	.msg-container { display: flex; flex-direction: column; max-width: 80%; }
	.mine .msg-container { align-items: flex-end; }
	.sender-name {
	    font-size: 11px;
	    color: #666;
	    margin-bottom: 2px;
	    margin-left: 2px;
	}
	.mine .sender-name { display: none; } /* 내가 보낸 건 이름을 숨기고 싶을 때 */
	
	/* 메시지와 시간 가로 정렬 */
	.msg-row { display: flex; align-items: flex-end; gap: 6px; }
	.mine .msg-row { flex-direction: row-reverse; }
	/* 시스템 메시지 스타일 */
	.system-msg {
	    width: 100%;
	    text-align: center;
	    margin: 15px 0;
	}
	.system-msg span {
	    background-color: #f0f0f0;
	    color: #666;
	    padding: 4px 12px;
	    border-radius: 12px;
	    font-size: 12px;
	}
  </style>

  <!-- SockJS / Stomp -->
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<div class="wrap">
	<div class="header">
	    <strong th:text="${displayTitle}"></strong>
	
	    <div class="header-btns">
	        <a href="javascript:void(0);" onclick="renameRoom()">
	            <img th:src="@{/img/messenger/edit.png}" alt="이름 편집">
	        </a>
	        
	        <a href="javascript:void(0);" onclick="leaveAndClose()">
			    <img th:src="@{/img/messenger/out.png}" alt="나가기">
			</a>
	    </div>
	</div>

	<div id="messages" class="messages">
	    <div th:each="msg : ${chatHistory}">
	        <div th:if="${msg.msgType == 'SYSTEM'}" class="system-msg">
	            <span th:text="${msg.content}"></span>
	        </div>
	
	        <div th:unless="${msg.msgType == 'SYSTEM'}" class="msgWrap" th:classappend="${msg.memberId == myMemberId} ? 'mine' : ''">
	            <div class="msg-container">
	                <div class="sender-name" th:text="${msg.memberName}"></div>
	                <div class="msg-row">
	                    <div class="msg" th:text="${msg.content}"></div>
	                    <span class="time" th:text="${#temporals.format(msg.createdAt, 'a h:mm')}"></span>
	                </div>
	            </div>
	        </div>
	    </div>
	</div>

  <div class="inputBar">
    <input id="text" class="input" type="text" placeholder="메시지 입력" />
    <button class="btn" type="button" onclick="sendMsg()">전송</button>
  </div>
</div>

<input type="hidden" id="roomId" th:value="${roomId}">
<input type="hidden" id="myMemberId" th:value="${myMemberId}">

<script>
var stompClient = null;

// 서버와의 연결 관리 함수
function connect() {
  var socket = new SockJS("/ws");
  stompClient = Stomp.over(socket);

  stompClient.connect({}, function () {
    var roomId = document.getElementById("roomId").value;
    console.log("WebSocket 연결 성공 - 방 ID: " + roomId);

    stompClient.subscribe("/topic/chatroom/" + roomId, function (message) {
      var payload = JSON.parse(message.body);
      console.log("데이터 도착함:", message.body);
      appendMessage(payload);
    });
    
    // 연결 상태 모니터링
    stompClient.debug = function(str) {
      console.log("STOMP Debug: " + str);
    };
  }, function (error) {
    console.error("WebSocket 연결 실패:", error);
    // 3초 후 재연결 시도
    setTimeout(connect, 3000);
  });
}

// 사용자가 입력한 채팅을 서버로 전송하는 함수
function sendMsg() {
	  if (!stompClient || !stompClient.connected) {
	      console.error("WebSocket이 연결되지 않았습니다.");
	      return;
	  }

	  var roomId = document.getElementById("roomId").value;
	  var myMemberId = document.getElementById("myMemberId").value; // 내 아이디 가져오기 추가
	  var textEl = document.getElementById("text");
	  var content = textEl.value.trim();
	  
	  if (content === "") return;

	  var body = {
	    roomId: Number(roomId),
	    memberId: Number(myMemberId), 
	    content: content,
	    msgType: 'TEXT' // DB 제약조건에 msgType도 NOT NULL이므로 명시해주는 것이 안전합니다.
	  };

	  console.log("메시지 전송:", body);
	  stompClient.send("/app/chat.send", {}, JSON.stringify(body));
	  textEl.value = "";
	}

// 받은 메시지를 채팅창 화면에 나타내는 함수
function appendMessage(msg) {
    var box = document.getElementById("messages");
    
    if (msg.msgType === 'SYSTEM') {
        var sysDiv = document.createElement("div");
        sysDiv.className = "system-msg";
        sysDiv.innerHTML = "<span>" + msg.content + "</span>";
        box.appendChild(sysDiv);
        box.scrollTop = box.scrollHeight;
        return;
    }
    
    var myMemberId = Number(document.getElementById("myMemberId").value);
    
    var wrap = document.createElement("div");
    wrap.className = "msgWrap" + (msg.memberId === myMemberId ? " mine" : "");
    
    // 이름과 메시지 행을 감싸는 컨테이너 생성
    var container = document.createElement("div");
    container.className = "msg-container";

    // 1. 이름 추가
    var nameDiv = document.createElement("div");
    nameDiv.className = "sender-name";
    nameDiv.textContent = msg.senderName; // Controller에서 보낸 senderName 사용
    container.appendChild(nameDiv);

    // 2. 메시지 본문과 시간 행 생성
    var row = document.createElement("div");
    row.className = "msg-row";

    var contentDiv = document.createElement("div");
    contentDiv.className = "msg";
    contentDiv.textContent = msg.content;
    
    var timeSpan = document.createElement("span");
    timeSpan.className = "time";
    timeSpan.textContent = msg.formattedTime;
    
    row.appendChild(contentDiv);
    row.appendChild(timeSpan);
    container.appendChild(row);
    wrap.appendChild(container);
    
    box.appendChild(wrap);
    box.scrollTop = box.scrollHeight;
}

// 엔터키 클릭이벤트(엔터키 클릭 시 채팅이 바로 전송되도록)
document.addEventListener("DOMContentLoaded", function() {
    var textInput = document.getElementById("text");

    // 입력창에서 키를 눌렀을 때 실행
    textInput.addEventListener("keyup", function(event) {
        // 눌린 키가 'Enter'인지 확인 (event.keyCode === 13 도 가능)
        if (event.key === "Enter") {
            event.preventDefault(); // 기본 동작 방지
            sendMsg(); // 메시지 전송 함수 호출
        }
    });
});

//[추가] 마지막으로 불러온 메시지의 개수를 저장
var lastMsgCount = 0; 

function pollingMessages() {
    var roomId = document.getElementById("roomId").value;
    
    // 1단계에서 만든 API 주소 호출
    fetch('/messenger/api/chat/' + roomId)
        .then(response => response.json())
        .then(data => {
            // 메시지 개수가 늘어났을 때만 화면 갱신 (불필요한 깜빡임 방지)
            if (data.length > lastMsgCount) {
                console.log("새 메시지 발견! 화면 갱신");
                renderMessages(data);
                lastMsgCount = data.length;
            }
        })
        .catch(err => console.error("Polling Error:", err));
}

// 화면을 싹 지우고 다시 그리는 함수
function renderMessages(chatList) {
    var box = document.getElementById("messages");
    var myMemberId = Number(document.getElementById("myMemberId").value);
    
    box.innerHTML = ""; 

    chatList.forEach(msg => {
    	if (msg.msgType === 'SYSTEM') {
            var sysDiv = document.createElement("div");
            sysDiv.className = "system-msg";
            sysDiv.innerHTML = "<span>" + msg.content + "</span>";
            box.appendChild(sysDiv);
            return; // 다음 메시지로 넘어감
        }
    	
        var wrap = document.createElement("div");
        wrap.className = "msgWrap" + (msg.memberId === myMemberId ? " mine" : "");
        
        var container = document.createElement("div");
        container.className = "msg-container";

        // 이름 추가 (API 결과에 memberName 필드가 있어야 함)
        var nameDiv = document.createElement("div");
        nameDiv.className = "sender-name";
        nameDiv.textContent = msg.memberName; 
        container.appendChild(nameDiv);

        var row = document.createElement("div");
        row.className = "msg-row";

        var contentDiv = document.createElement("div");
        contentDiv.className = "msg";
        contentDiv.textContent = msg.content;
        
        var timeSpan = document.createElement("span");
        timeSpan.className = "time";
        
        var date = new Date(msg.createdAt);
        var timeStr = (date.getHours() >= 12 ? "오후 " : "오전 ") + 
                      (date.getHours() % 12 || 12) + ":" + 
                      String(date.getMinutes()).padStart(2, '0');
        timeSpan.textContent = timeStr; 
        
        row.appendChild(contentDiv);
        row.appendChild(timeSpan);
        container.appendChild(row);
        wrap.appendChild(container);
        box.appendChild(wrap);
    });
    
    box.scrollTop = box.scrollHeight;
}

// [핵심] 1초(1000ms)마다 pollingMessages 실행
setInterval(pollingMessages, 500);

// 페이지 로드 시 1번 즉시 실행
document.addEventListener("DOMContentLoaded", function() {
    pollingMessages();
    // ... 기존 엔터키 이벤트 ...
});

function renameRoom() {
    var roomId = document.getElementById("roomId").value;
    var newName = prompt("변경할 채팅방 이름을 입력해주세요.");
    
    if (!newName || newName.trim() === "") return;

    fetch('/messenger/api/rename', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ roomId: Number(roomId), newName: newName })
    })
    .then(res => {
        if(res.ok) {
            alert("방 이름이 변경되었습니다.");
            location.reload(); // 제목 갱신을 위해 새로고침
        }
    });
}

function leaveAndClose() {
    if (!confirm('정말 이 채팅방을 나가시겠습니까? 나가면 대화 내용이 모두 삭제됩니다.')) return;

    var roomId = document.getElementById("roomId").value;

    // 서버에 나가기 요청 (POST 방식 권장)
    fetch('/messenger/api/leave/' + roomId, {
        method: 'POST'
    })
    .then(res => {
        if (res.ok) {
            // 1. 부모 창(채팅 목록 페이지)이 열려있다면 새로고침
            if (window.opener && !window.opener.closed) {
                window.opener.location.reload();
            }
            // 2. 현재 채팅방 창 닫기
            window.close();
        } else {
            alert("나가기 처리 중 오류가 발생했습니다.");
        }
    })
    .catch(err => console.error("Error:", err));
}

connect();
</script>
</body>
</html>
