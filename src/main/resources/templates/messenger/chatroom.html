<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>채팅</title>
  <style>
    html, body { height: 100%; margin: 0; }
    .wrap { height: 100vh; display: flex; flex-direction: column; }
    .header { height: 52px; border-bottom: 1px solid #e5e5e5; display:flex; align-items:center; padding:0 12px; }
    .messages { flex: 1; overflow-y: auto; padding: 12px; }
    .msg { padding: 8px 10px; border: 1px solid #eee; border-radius: 10px; margin-bottom: 8px; max-width: 80%; }
    .mine { margin-left: auto; }
    .inputBar { border-top: 1px solid #e5e5e5; padding: 10px; display:flex; gap:8px; }
    .input { flex: 1; height: 38px; border: 1px solid #ddd; border-radius: 8px; padding: 0 10px; }
    .btn { width: 72px; height: 38px; border: none; border-radius: 8px; cursor: pointer; }
	.msgWrap { display: flex; align-items: flex-end; margin-bottom: 12px; gap: 6px; }
	.msgWrap.mine { flex-direction: row-reverse; } /* 내가 보낸 건 시간-메시지 순서 */
	.msg { margin-bottom: 0 !important; } /* 기존 여백 제거 */
	.time { font-size: 11px; color: #888; white-space: nowrap; margin-bottom: 2px; }
  </style>

  <!-- SockJS / Stomp -->
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
<div class="wrap">
	<div class="header">
		<strong th:text="${displayTitle}"></strong>
	</div>

	<div id="messages" class="messages">
		<div th:each="msg : ${chatHistory}" class="msgWrap" th:classappend="${msg.memberId == myMemberId} ? 'mine' : ''">
			<div class="msg" th:text="${msg.content}"></div>
			<span class="time" th:text="${#temporals.format(msg.createdAt, 'a h:mm')}"></span>
		</div>
	</div>

  <div class="inputBar">
    <input id="text" class="input" type="text" placeholder="메시지 입력" />
    <button class="btn" type="button" onclick="sendMsg()">전송</button>
  </div>
</div>

<input type="hidden" id="roomId" th:value="${roomId}">
<input type="hidden" id="myMemberId" th:value="${myMemberId}">

<script>
var stompClient = null;

// 서버와의 연결 관리 함수
function connect() {
  var socket = new SockJS("/ws");
  stompClient = Stomp.over(socket);

  stompClient.connect({}, function () {
    var roomId = document.getElementById("roomId").value;

    stompClient.subscribe("/topic/chatroom/" + roomId, function (message) {
      var payload = JSON.parse(message.body);
      appendMessage(payload);
    });
  });
}

// 사용자가 입력한 채팅을 서버로 전송하는 함수
function sendMsg() {
	  if (!stompClient) return;

	  var roomId = document.getElementById("roomId").value;
	  var myMemberId = document.getElementById("myMemberId").value; // 내 아이디 가져오기 추가
	  var textEl = document.getElementById("text");
	  var content = textEl.value.trim();
	  
	  if (content === "") return;

	  var body = {
	    roomId: Number(roomId),
	    memberId: Number(myMemberId), 
	    content: content,
	    msgType: 'TEXT' // DB 제약조건에 msgType도 NOT NULL이므로 명시해주는 것이 안전합니다.
	  };

	  stompClient.send("/app/chat.send", {}, JSON.stringify(body));
	  textEl.value = "";
	}

// 받은 메시지를 채팅창 화면에 나타내는 함수
function appendMessage(msg) {
	var box = document.getElementById("messages");
	var myMemberId = Number(document.getElementById("myMemberId").value);
	
	var wrap = document.createElement("div");
	wrap.className = "msgWrap" + (msg.memberId === myMemberId ? " mine" : "");
	
	var contentDiv = document.createElement("div");
	contentDiv.className = "msg";
	contentDiv.textContent = msg.content;
	
	var timeSpan = document.createElement("span");
	timeSpan.className = "time";
	timeSpan.textContent = msg.formattedTime; // 서버에서 받은 문자열 사용
	
	wrap.appendChild(contentDiv);
	wrap.appendChild(timeSpan);
	
	box.appendChild(wrap);
	box.scrollTop = box.scrollHeight;
}

connect();
</script>
</body>
</html>
