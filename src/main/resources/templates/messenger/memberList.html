<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>사원 목록</title>
	<th:block th:replace="~{messenger/messengerLayout :: messengerStyle}"></th:block>
	<style>
    html, body { height: 100%; margin: 0; }
    .wrapper { display: flex; height: 100vh; }
    .main { flex: 7; display: flex; flex-direction: column; }

    .status { border-bottom: 1px solid #e5e5e5; height: 25px; display:flex; align-items:center; padding: 0 12px; font-size: 12px; color:#666; }
    .searchBarArea { border-bottom: 1px solid #e5e5e5; height: 50px; display:flex; align-items:center; padding: 0 12px; }
    .searchBar { width: 100%; height: 36px; padding: 0 12px; border: 1px solid #ddd; border-radius: 8px; }

    /* 리스트 영역 */
    .memberList { flex: 1; overflow-y: auto; background: #fff; }

    /* 한 줄(row) */
    .memberRow {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
    }
    .memberRow:hover { background: #fafafa; }

    /* 프로필 */
    .avatarWrap { position: relative; width: 42px; height: 42px; flex: 0 0 42px; }
    .avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: #e9edf5;
      display:flex; align-items:center; justify-content:center;
      font-weight: 700; color: #4b5563;
      user-select: none;
    }
    .dot {
      position: absolute;
      right: -1px; bottom: -1px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #22c55e; /* 온라인 초록 */
      border: 2px solid #fff;
    }

    /* 가운데 텍스트 */
    .memberInfo { flex: 1; min-width: 0; }
    .memberName { font-size: 15px; font-weight: 700; color: #111827; line-height: 1.2; }
    .memberDept { font-size: 12px; color: #6b7280; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 오른쪽 상태/즐겨찾기 */
    .memberRight { display: flex; align-items: center; gap: 12px; }
    .workStatus { font-size: 12px; color: #6b7280; min-width: 70px; text-align: right; }
    .starBtn {
      width: 28px; height: 28px;
      border: none; background: transparent;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }
    .starOn { color: #f59e0b; }  /* 노랑 */
    .starOff { color: #9ca3af; } /* 회색 */

    .empty { padding: 16px; color: #6b7280; }
    
    .searchBarArea { gap: 8px; }
	
	.searchBtn{
	  height: 36px;
	  padding: 0 14px;
	  border: 1px solid #ddd;
	  border-radius: 8px;
	  background: #fff;
	  cursor: pointer;
	  white-space: nowrap;
	}
	.searchBtn:hover { background: #f6f6f6; }
	
	.memberRow.my-row {
	    background-color: #f9f9f9; /* 연한 회색 배경 */
	    cursor: default; /* 포인터 커서 해제 */
	}
	
	.memberRow.my-row:hover {
	    background-color: #f9f9f9 !important; /* 호버 시 색상 변화 방지 */
	}
	
	.memberRow.my-row .memberName {
	    color: #999; /* 이름 색상을 약간 흐리게 */
	}
  </style>
</head>

<body>
<div class="wrapper">
    <div class="sidebar-area"
	    th:insert="~{messenger/messengerLayout :: messengerSidebar('members')}">
	</div>


	<div class="main">
		
		<div class="searchBarArea">
			<input id="memberSearch" type="text" class="searchBar" placeholder="사원 또는 부서로 검색">
			<button type="button" class="searchBtn" onclick="applySearch()">검색</button>
		</div>
		
		<div class="memberList">
			<div class="memberRow"
			     th:each="member : ${memberList}"
			     th:object="${member}"
			     th:classappend="${member.memberId == myMemberId} ? 'my-row' : ''"
			     th:attr="data-id=*{memberId}, data-name=*{memberName}, data-dept=*{departmentName}"
			     ondblclick="goChat(this)">
			
			    <button th:if="${member.memberId != myMemberId}" 
				        type="button" 
				        class="starBtn" 
				        th:classappend="${member.isFavorite == 'Y'} ? 'starOn' : 'starOff'"
				        th:onclick="'toggleFavoriteMember(' + ${member.memberId} + ', this)'"
				        ondblclick="event.stopPropagation();"> ★
				</button>
			    
			    <div th:if="${member.memberId == myMemberId}" class="starBtn"></div>
			    
			    <div class="memberName">
			        <span th:text="*{memberName}"></span>
			        <span th:if="${member.memberId == myMemberId}" style="font-size: 12px; color: #1f3bff; margin-left: 4px;">(나)</span>
			    </div>
			
			    <div class="memberDept">
			        <span th:text="*{departmentName}"></span>
			    </div>
			</div>
		</div>
	
	</div>
</div>

<input type="hidden" id="myMemberId" th:value="${myMemberId}">

<script>
function goChat(el) {
	  var memberId = el.dataset.id;
	  var myId = document.getElementById("myMemberId").value;
	  const target = event.target;

	  var w = 470;
	  var h = 720;
	  var left = Math.max(0, screen.width / 2);
	  var top = Math.max(0, (screen.height - h) / 2);

	  var url = "/messenger/direct?memberId=" + memberId;

	  window.open(
	    url,
	    "chat_" + memberId,
	    "width=" + w + ",height=" + h + ",left=" + left + ",top=" + top + ",resizable=yes,scrollbars=yes"
	  );
}

function norm(s) {
  return (s || "").toString().trim().toLowerCase();
}

function applySearch() {
  var input = document.getElementById("memberSearch");
  var list = document.querySelector(".memberList");
  if (!list) return;

  var q = norm(input.value);

  var rows = list.querySelectorAll(".memberRow");
  rows.forEach(function (row) {
    var name = norm(row.dataset.name);
    var dept = norm(row.dataset.dept);

    var ok = (q === "") || name.includes(q) || dept.includes(q) || dept.includes(q);

    row.style.display = ok ? "" : "none";
  });
}

(function () {
  var input = document.getElementById("memberSearch");

  // 타이핑할 때 즉시 필터
  input.addEventListener("input", applySearch);

  // 엔터 눌렀을 때도 필터(폼 제출 방지)
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();
      applySearch();
    }
  });
})();

function toggleFavoriteMember(targetId, btn) {
    if (event) {
        event.stopPropagation();
        event.preventDefault();
    }
    
    const isAdding = btn.classList.contains('starOff');
    const status = isAdding ? 'Y' : 'N';
    const myId = document.getElementById("myMemberId").value;

    fetch('/messenger/api/favorite/member', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ targetMemberId: targetId, myMemberId: myId, status: status })
    })
    .then(res => res.json())
    .then(data => {
        // 1. 별 아이콘 UI 즉시 변경
        btn.classList.toggle('starOn');
        btn.classList.toggle('starOff');
        
        const row = btn.closest('.memberRow');
        const listContainer = document.querySelector(".memberList");

        // 2. 리스트 순서 조정
        if (status === 'Y') {
            listContainer.prepend(row);
        } else {
        	location.reload();
        }

        // 3. [핵심 수정] 새 탭 방지 로직 추가
        if (data.roomId) {
		    const winName = 'chatWindow_' + data.roomId;
		    
		    if (data && data.roomId) {
		        if ('BroadcastChannel' in window) {
		            var bc = new BroadcastChannel('messenger_sync');
		            bc.postMessage({
		                type: 'ROOM_FAVORITE_CHANGED',
		                roomId: Number(data.roomId),
		                status: status // 'Y' or 'N'
		            });
		            bc.close();
		        }
		    }
		}
    })
    .catch(err => console.error("즐겨찾기 요청 실패:", err));
}
</script>

<div th:replace="~{messenger/messengerLayout :: messengerScript}"></div>

</body>
</html>
