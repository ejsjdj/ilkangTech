<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
   <meta charset="UTF-8">
   <title>Insert title here</title>
</head>
<style>
   html, body {
       height: 100%;
       margin: 0;
   }
   .wrapper {
      display: flex;
      height: 100vh;
   }
   .sidebar {
      flex: 1;
      background-color: blue;
   }
   .main {
      flex: 7;
   }
   .status {
      border: 1px solid grey;
      height: 25px;
   }
   .searchBarArea {
      border: 1px solid grey;
      height: 50px;
      align-items: center;
   }
   .searchBar {
      width: 100%;
      height: 40px;
   }
   .accountList {
      border: 1px solid grey;
   }
</style>
<body>
   
   <div class="wrapper">
      <div class="sidebar">사이드바</div>
      <div class="main">
         <div class="status">상태</div>
         <div class="searchBarArea">
            <input type="text" class="searchBar" placeholder="사원 또는 목록으로 검색">
         </div>
         <div class="accountList">사원리스트</div>
      </div>
   </div>
   
   // 임시2
   
</body>
</html>
