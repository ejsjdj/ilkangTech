<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="messengerStyle">
    <style>
        .sidebar {
            width: 70px;
            height: 100vh;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            position: fixed; /* 사이드바 고정 */
            left: 0;
            top: 0;
        }
        .sidebar-area { width: 70px; flex-shrink: 0; }
        .sidebar a {
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            border-radius: 12px;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .sidebar a img {
            width: 28px;
            height: 28px;
            filter: brightness(0) invert(1);
            opacity: 0.7;
        }
        .sidebar a:hover { background-color: rgba(255, 255, 255, 0.1); }
        .sidebar a:hover img { opacity: 1; }
        .sidebar a.active {
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .sidebar a.active img { opacity: 1; transform: scale(1.1); }
        .blank { height: 20px; }
        
        .chatListBtn { position: relative; }
        
        /*  알림 표시(빨간 점) */
	    .notification-container { position: relative; display: inline-block; }
	    .red-dot {
		    position: absolute;
		    bottom: 12px; 
		    right: 4px;
		    width: 10px;
		    height: 10px;
		    background-color: #ff3b30; 
		    border-radius: 50%;
		    border: 2px solid #fff; 
		    display: none; 
		    z-index: 10;
		}
    </style>
</head>
<body>
    <div th:fragment="messengerSidebar(active)">
        <div class="sidebar">
            <div class="blank"></div>
            <a th:href="@{/messenger/memberList}"
               class="memberListBtn"
               th:classappend="${active == 'members'} ? ' active' : ''">
                <img th:src="@{/img/messenger/memberList.png}" alt="사원 목록">
            </a>
            <a th:href="@{/messenger/chatList}"
               class="chatListBtn"
               th:classappend="${active == 'chats'} ? ' active' : ''">
                <img th:src="@{/img/messenger/chatList.png}" alt="채팅 목록">
                <span id="main-unread-dot" class="red-dot"></span>
            </a>
        </div>
    </div>
   
<footer th:fragment="messengerScript">
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:inline="javascript">
const myId = /*[[${myMemberId}]]*/ 0;
   
   document.addEventListener("DOMContentLoaded", function() {
       const listDot = document.getElementById('main-unread-dot');

       // 1. 초기 로드 시 체크
       fetch('/messenger/api/unread-exists')
           .then(res => res.json())
           .then(exists => { 
               if(listDot) listDot.style.display = exists ? 'block' : 'none'; 
           });

       // 2. 웹소켓 실시간 구독
       function connectNotification() {
           const socket = new SockJS("/ws");
           const stomp = Stomp.over(socket);
           stomp.debug = null; 

           stomp.connect({}, function () {
               stomp.subscribe("/topic/user/" + myId + "/list", function (message) {
                   const payload = JSON.parse(message.body);
                   
                   if (payload.msgType === 'READ') {
                       // 누군가 읽었다면 다시 서버에 남은 게 있는지 확인
                       fetch('/messenger/api/unread-exists')
                           .then(res => res.json())
                           .then(exists => {
                               listDot.style.display = exists ? 'block' : 'none';
                           });
                   } else if (payload.memberId !== myId) {
                       // 내가 보낸 게 아닌 새 메시지면 점 표시
                       listDot.style.display = 'block';
                   }
               });
           });
       }
       if (myId) connectNotification();
   });
</script>
</footer>
</body>
</html>
