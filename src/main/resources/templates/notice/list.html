<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
	<meta charset="UTF-8">
	<title>공지사항</title>
	
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	
	<th:block layout:fragment="style">
		<style>
			/* 기존 스타일 유지 */
	        .page-container { 
		        background: #ffffff; border-radius: 12px; padding: 30px; 
		        box-shadow: 0 4px 20px rgba(0,0,0,0.05); min-height: 800px;
                display: flex; flex-direction: column;
	        }
            .page-header { margin-bottom: 20px; }
            .page-title { font-size: 24px; font-weight: 700; color: #333; margin-bottom: 10px; }
	        
            /* --- [추가] 검색창 컨트롤 영역 스타일 --- */
            .header-control { margin-bottom: 15px !important; }
            .header-control form { width: 100%; display: flex; justify-content: space-between; align-items: center; }
            
            .search-left-group { display: flex; align-items: center; gap: 8px; }
            .search-right-group { display: flex; align-items: center; gap: 5px; }

            /* 입력창/버튼 높이 통일 (38px) */
            .input-date-fixed, .search-select, .search-input, 
            .btn-search, .btn-reset, .btn-custom-blue { 
                height: 38px !important; line-height: 1.5; font-size: 13px; box-sizing: border-box;
                vertical-align: middle; border-radius: 4px; 
            }

            .input-date-fixed { width: 150px; padding: 0 10px; border: 1px solid #ced4da; color: #666; }
            .search-select { width: 100px; border: 1px solid #ced4da; padding: 0 10px; cursor: pointer; }
            .search-input { width: 220px; border: 1px solid #ced4da; padding: 0 10px; }
            
            .btn-search {
                background-color: #fff; border: 1px solid #5c6bc0; color: #5c6bc0;
                padding: 0 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
                text-decoration: none; font-weight: 600;
            }
            .btn-search:hover { background-color: #5c6bc0; color: white; }

            .btn-reset {
                border: 1px solid #ced4da; background: #fff; color: #666; width: 38px; padding: 0; display: inline-flex; align-items: center; 
                justify-content: center; text-decoration: none !important; 
            }

            .btn-custom-blue {
                background-color: #fff; border: 1px solid #5c6bc0; color: #5c6bc0; 
                padding: 0 15px; display: inline-flex; align-items: center; justify-content: center; 
                font-weight: 600; text-decoration: none; cursor: pointer;
            }
            .btn-custom-blue:hover { background-color: #5c6bc0; color: white; }

	        /* 페이지네이션 스타일 */
	        .pagination .page-item { margin: 0 3px; }
	        .pagination .page-link {
	            width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
	            border-radius: 6px !important; border: 1px solid #e2e8f0;
	            color: #64748b; font-size: 14px; font-weight: 500; background-color: #fff;
	            transition: all 0.2s;
                cursor: pointer;
	        }
	        .pagination .page-item.active .page-link {
	            background-color: #6366f1 !important; border-color: #6366f1 !important; color: #ffffff !important;
	        }
	        .pagination .page-item.disabled .page-link {
	            background-color: #f8fafc; color: #cbd5e1; border-color: #f1f5f9; cursor: default;
	        }
	        .pagination .page-link:hover:not(.active):not(.disabled) {
	            background-color: #f1f5f9; border-color: #cbd5e1; color: #1e293b;
	        }
	
            /* 테이블 스타일 */
			.table-responsive {
			    border-radius: 10px; border: 1px solid #e0e0e0 !important; overflow: hidden; background-color: #fff; margin-top: 10px;
			    margin-top: 0px;
			}
			.table { margin-bottom: 0; border-style: hidden; }
			.table-light { background-color: #f8fafc !important; border-bottom: 1px solid #e0e0e0; }
			.custom-table thead th {
			    background-color: #f8f9fa; color: #495057; font-weight: 600; text-align: center; border-bottom: 1px solid #dee2e6; padding: 12px;
			}
			.custom-table tbody tr.pinned-row td { background-color: #cff4fc !important; }
			.table th, .table td { border-bottom: 1px solid #f1f5f9; }
            .pinned-icon { color: #ff6b6b; margin-right: 5px; } /* 고정 아이콘 스타일 */
		</style>
	</th:block>
</head>
<body>
	<div layout:fragment="content">
		<div class="page-container">
            
            <div class="page-header">
			    <h2 class="page-title">공지사항</h2>
			</div>
            
            <div class="header-control mb-3">
                <form action="/notice/list" method="get" id="searchForm">
                    <input type="hidden" name="page" id="page" value="0">

                    <div class="search-left-group">
                        <input type="date" name="startDate" class="input-date-fixed" 
                               th:value="${searchDTO.startDate}">
                        <span class="fw-bold text-secondary">~</span>
                        <input type="date" name="endDate" class="input-date-fixed"
                               th:value="${searchDTO.endDate}">
                        
                        <button type="submit" class="btn btn-search">조회</button>
                        <a href="/notice/list" class="btn-reset" title="초기화">
                            <i class="fa-solid fa-arrows-rotate"></i>
                        </a>
                    </div>

                    <div class="search-right-group">
                        <select name="searchType" class="search-select">
                            <option value="title" th:selected="${searchDTO.searchType == 'title'}">제목</option>
                            <!-- <option value="content" th:selected="${searchDTO.searchType == 'content'}">내용</option> -->
                            <option value="writer" th:selected="${searchDTO.searchType == 'writer'}">작성자</option>
                        </select>
                        
                        <input type="text" name="keyword" class="search-input" placeholder="검색어 입력" 
                               th:value="${searchDTO.keyword}">
                        
                        <a th:if="${canWrite}" th:href="@{/notice/write}" class="btn-custom-blue">
                            <i class="fa-solid fa-plus" style="margin-right: 4px;"></i> 공지 등록
                        </a>
                    </div>
                </form>
            </div>
	
            <div class="table-responsive bg-white rounded-3 shadow-sm">
	            <table class="table table-hover custom-table align-middle mb-0 text-center" style="min-width: 900px;">
	                <thead class="table-light">
	                    <tr style="height: 50px; font-size: 15px; color: #64748b;">
	                        <th style="width: 80px;">No.</th>
	                        <th class="text-start" style="color: #495057;">제목</th>
	                        <th style="width: 150px;">작성자(직급)</th>
	                        <th style="width: 150px;">등록일</th>
	                        <th style="width: 100px;">조회수</th>
	                        <th style="width: 100px;">첨부파일</th>
	                    </tr>
	                </thead>
	                <tbody>
                        <tr th:each="p : ${pinnedList}" class="table-info pinned-row" style="background-color: #cff4fc !important;">
	                        <td><span class="badge bg-indigo text-white px-2 py-1" style="background-color: #6366f1; font-size: 11px;">고정</span></td>
	                        <td class="text-start fw-bold">
	                            <a th:href="@{/notice/detail/{id}(id=${p.id})}" th:text="${p.title}" class="text-decoration-none text-dark"></a>
	                        </td>
	                        <td th:text="${p.writerInfo}" style="color: #475569;"></td>
	                        <td th:text="${#temporals.format(p.regDate, 'yyyy-MM-dd')}" style="color: #64748b;"></td>
	                        <td th:text="${p.viewCount}" style="color: #64748b;"></td>
	                        <td><i th:if="${p.hasAttachment}" class="fa-solid fa-paperclip text-secondary"></i></td>
	                    </tr>
	
                        <tr th:if="${noticeList.totalElements == 0}">
                            <td colspan="6" class="text-center py-4 text-muted">검색 결과가 없습니다.</td>
                        </tr>
	                    <tr th:each="n : ${noticeList.content}">
	                        <td th:text="${n.id}" style="color: #94a3b8;"></td>
	                        <td class="text-start">
	                            <a th:href="@{/notice/detail/{id}(id=${n.id})}" th:text="${n.title}" class="text-decoration-none text-dark"></a>
	                        </td>
	                        <td th:text="${n.writerInfo}" style="color: #475569;"></td>
	                        <td th:text="${#temporals.format(n.regDate, 'yyyy-MM-dd')}" style="color: #64748b;"></td>
	                        <td th:text="${n.viewCount}" style="color: #64748b;"></td>
	                        <td><i th:if="${n.hasAttachment}" class="fa-solid fa-paperclip text-secondary" style="opacity: 0.5;"></i></td>
	                    </tr>
	                </tbody>
	            </table>
	        </div>
	
            <div class="mt-5 d-flex justify-content-center">
			    <nav th:if="${noticeList.totalPages > 0}">
			        <ul class="pagination pagination-sm align-items-center">
                        <li class="page-item" th:classappend="${noticeList.first} ? 'disabled'">
                            <a class="page-link" href="javascript:void(0)" th:onclick="'goPage(' + ${noticeList.number - 1} + ')'">«</a>
			            </li>
			            
                        <li th:each="i : ${#numbers.sequence(0, noticeList.totalPages - 1)}" 
			                th:if="${i >= (noticeList.number / 10) * 10 and i < ((noticeList.number / 10) + 1) * 10}"
			                class="page-item" th:classappend="${i == noticeList.number} ? 'active'">
			                <a class="page-link" href="javascript:void(0)" th:text="${i + 1}" th:onclick="'goPage(' + ${i} + ')'"></a>
			            </li>
			
                        <li class="page-item" th:classappend="${noticeList.last} ? 'disabled'">
			                <a class="page-link" href="javascript:void(0)" th:onclick="'goPage(' + ${noticeList.number + 1} + ')'">›</a>
			            </li>
			        </ul>
			    </nav>
			</div>
		</div>
	</div>

    <th:block layout:fragment="script">
        <script>
            function goPage(page) {
                if(page < 0) return;
                // hidden input에 페이지 번호 설정 후 폼 제출 (검색 조건 유지)
                document.getElementById('page').value = page;
                document.getElementById('searchForm').submit();
            }
        </script>
    </th:block>
</body>
</html>
