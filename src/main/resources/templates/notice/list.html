<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
	<meta charset="UTF-8">
	<title>공지사항</title>
	
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	
	<th:block layout:fragment="style">
		<style>
			.page-container { 
            	background: #ffffff; border-radius: 8px; padding: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); min-height: 800px;
                position: relative; display: flex; flex-direction: column; 
            }
            .page-container { 
            background: #ffffff; border-radius: 12px; padding: 30px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); min-height: 800px;
        }
        
        /* 캡처 화면(image_90ca6f.png) 페이지네이션 스타일 재현 */
        .pagination .page-item { margin: 0 3px; }
        .pagination .page-link {
            width: 38px; height: 38px; display: flex; align-items: center; justify-content: center;
            border-radius: 6px !important; border: 1px solid #e2e8f0;
            color: #64748b; font-size: 14px; font-weight: 500; background-color: #fff;
            transition: all 0.2s;
        }
        
        /* 활성화된 페이지 (보라색 포인트) */
        .pagination .page-item.active .page-link {
            background-color: #6366f1 !important;
            border-color: #6366f1 !important;
            color: #ffffff !important;
        }
        
        /* 비활성화된 아이콘 (회색) */
        .pagination .page-item.disabled .page-link {
            background-color: #f8fafc; color: #cbd5e1; border-color: #f1f5f9;
        }
        
        .pagination .page-link:hover:not(.active):not(.disabled) {
            background-color: #f1f5f9; border-color: #cbd5e1; color: #1e293b;
        }

        /* 고정 게시글 배경색 및 배지 */
        .custom-table tbody tr.pinned-row td { background-color: #f5f7ff !important; }
        .badge-pinned { 
            background-color: #6366f1; color: white; padding: 4px 10px; 
            border-radius: 6px; font-size: 11px; font-weight: 700;
        }
        .table-hover {
        	border: 1px solid #e0e0e0;
        }
        /* 테이블을 감싸는 영역의 테두리와 둥근 모서리 설정 */
		.table-responsive {
		    border-radius: 10px; /* 모서리 둥글게 */
		    border: 1px solid #e0e0e0 !important; /* 전체 외곽 테두리 */
		    overflow: hidden; /* 내부 요소가 모서리를 튀어나가지 않게 함 */
		    background-color: #fff;
		}
		
		/* 테이블 자체의 중복 테두리 제거 */
		.table {
		    margin-bottom: 0; /* 하단 여백 제거 */
		    border-style: hidden; /* responsive 영역 테두리와 겹치지 않게 함 */
		}
		
		/* 헤더 배경색이 모서리를 가리지 않도록 설정 */
		.table-light {
		    background-color: #f8fafc !important;
		    border-bottom: 1px solid #e0e0e0; 
		}
		.custom-table thead th {
		    background-color: #f8f9fa;
		    color: #495057;
		    font-weight: 600;
		    text-align: center;
		    border-bottom: 1px solid #dee2e6;
		    padding: 12px;
		}
		
		/* [추가] 고정 게시글 배경색 우선순위 (이전 질문 답변 반영) */
		.custom-table tbody tr.pinned-row td { 
		    background-color: #f5f7ff !important; 
		}
		
		/* 테이블 내부 셀 테두리 설정 (캡처 화면 느낌) */
		.table th, .table td {
		    border-bottom: 1px solid #f1f5f9;
		}
		/* 테스트 주석 */
		</style>
	</th:block>
</head>
<body>
	<div layout:fragment="content">
		<div class="page-container">
			<div class="d-flex justify-content-between align-items-center mb-4">
	            <h2 class="fw-bold m-0" style="font-size: 24px;">공지사항</h2>
	            <a th:if="${canWrite}" th:href="@{/notice/write}" class="btn btn-primary px-4 py-2" 
	               style="border-radius: 8px; font-weight: 600;">+ 공지 등록</a>
	        </div>
	
	        <div class="table-responsive bg-white rounded-3 shadow-sm">
	            <table class="table table-hover custom-table align-middle mb-0 text-center" style="min-width: 900px;">
	                <thead class="table-light">
	                    <tr style="height: 50px; font-size: 15px; color: #64748b;">
	                        <th style="width: 80px;">No.</th>
	                        <th class="text-start" style="color: #495057;">제목</th>
	                        <th style="width: 150px;">작성자(직급)</th>
	                        <th style="width: 150px;">등록일</th>
	                        <th style="width: 100px;">조회수</th>
	                        <th style="width: 100px;">첨부파일</th>
	                    </tr>
	                </thead>
	                <tbody>
	                    <tr th:each="p : ${pinnedList}" class="table-info" style="background-color: #f0f7ff !important;">
	                        <td><span class="badge bg-indigo text-white px-2 py-1" style="background-color: #6366f1; font-size: 11px;">고정</span></td>
	                        <td class="text-start fw-bold">
	                            <a th:href="@{/notice/detail/{id}(id=${p.id})}" th:text="${p.title}" class="text-decoration-none text-dark"></a>
	                        </td>
	                        <td th:text="${p.writerInfo}" style="color: #475569;">작성자(직급)</td>
	                        <td th:text="${#temporals.format(p.regDate, 'yyyy-MM-dd')}" style="color: #64748b;"></td>
	                        <td th:text="${p.viewCount}" style="color: #64748b;"></td>
	                        <td><i th:if="${p.hasAttachment}" class="fa-solid fa-paperclip text-secondary"></i></td>
	                    </tr>
	
	                    <tr th:each="n : ${noticeList.content}">
	                        <td th:text="${n.id}" style="color: #94a3b8;"></td>
	                        <td class="text-start">
	                            <a th:href="@{/notice/detail/{id}(id=${n.id})}" th:text="${n.title}" class="text-decoration-none text-dark"></a>
	                        </td>
	                        <td th:text="${n.writerInfo}" style="color: #475569;"></td>
	                        <td th:text="${#temporals.format(n.regDate, 'yyyy-MM-dd')}" style="color: #64748b;"></td>
	                        <td th:text="${n.viewCount}" style="color: #64748b;"></td>
	                        <td><i th:if="${n.hasAttachment}" class="fa-solid fa-paperclip text-secondary" style="opacity: 0.5;"></i></td>
	                    </tr>
	                </tbody>
	            </table>
	        </div>
	
	        <div class="mt-5 d-flex justify-content-center">
			    <nav th:if="${noticeList.totalPages > 0}">
			        <ul class="pagination pagination-sm align-items-center">
			            <li class="page-item" th:classappend="${noticeList.first} ? 'disabled'">
			                <a class="page-link" th:href="@{/notice/list(page=0)}">«</a>
			            </li>
			            
			            <li class="page-item" th:classappend="${noticeList.first} ? 'disabled'">
			                <a class="page-link" th:href="@{/notice/list(page=${noticeList.number - 1})}">‹</a>
			            </li>
			
			            <li th:each="i : ${#numbers.sequence(0, noticeList.totalPages - 1)}" 
			                th:if="${i >= (noticeList.number / 10) * 10 and i < ((noticeList.number / 10) + 1) * 10}"
			                class="page-item" th:classappend="${i == noticeList.number} ? 'active'">
			                <a class="page-link" th:href="@{/notice/list(page=${i})}" th:text="${i + 1}"></a>
			            </li>
			
			            <li class="page-item" th:classappend="${noticeList.last} ? 'disabled'">
			                <a class="page-link" th:href="@{/notice/list(page=${noticeList.number + 1})}">›</a>
			            </li>
			            
			            <li class="page-item" th:classappend="${noticeList.last} ? 'disabled'">
			                <a class="page-link" th:href="@{/notice/list(page=${noticeList.totalPages - 1})}">»</a>
			            </li>
			        </ul>
			    </nav>
			</div>
		</div>
	</div>
</body>
</html>
