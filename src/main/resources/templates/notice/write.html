<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>공지사항 등록</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <th:block layout:fragment="style">
        <style>
            .page-container { 
                background: #ffffff; border-radius: 12px; padding: 30px; 
                box-shadow: 0 4px 20px rgba(0,0,0,0.05); min-height: 800px;
            }
            .page-title { font-size: 24px; font-weight: 700; color: #1f2937; margin-bottom: 25px; }
            .form-label { font-weight: 600; color: #495057; margin-bottom: 8px; }
            .form-control, .form-select { border-radius: 6px; padding: 10px; }

            /* 토글 스위치 스타일 */
            .switch { position: relative; display: inline-block; width: 50px; height: 26px; vertical-align: middle; }
            .switch input { opacity: 0; width: 0; height: 0; }
            .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
            .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
            input:checked + .slider { background-color: #6366f1; }
            input:checked + .slider:before { transform: translateX(24px); }
            .toggle-label { margin-left: 10px; font-weight: 600; color: #64748b; }
            input:checked ~ .toggle-label { color: #6366f1; }

            /* [추가] 이미지 미리보기 영역 스타일 */
            #imagePreviewArea {
                min-height: 150px; 
                background-color: #f8f9fa; 
                border: 1px dashed #ced4da; 
                border-radius: 6px;
                display: flex;
                flex-wrap: wrap;
                gap: 15px;
                padding: 15px;
                justify-content: center;
                align-items: center;
            }
            .img-preview-box {
                position: relative;
                width: 150px;
                height: 150px;
                border-radius: 8px;
                overflow: hidden;
                box-shadow: 0 2px 5px rgba(0,0,0,0.1);
                background: white;
            }
            .img-preview-box img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
            .btn-img-delete {
                position: absolute;
                top: 5px;
                right: 5px;
                background: rgba(220, 53, 69, 0.9);
                color: white;
                border: none;
                border-radius: 50%;
                width: 24px;
                height: 24px;
                font-size: 12px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* [추가] 첨부파일 리스트 스타일 */
            .file-list-item {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px 15px;
                border-bottom: 1px solid #f0f0f0;
                background-color: #fff;
            }
            .file-list-item:first-child { border-top: 1px solid #f0f0f0; margin-top: 10px; }
            .file-info { display: flex; align-items: center; gap: 10px; color: #333; font-size: 14px; }
            .file-size { font-size: 12px; color: #888; }
            .btn-file-delete {
                border: 1px solid #dc3545;
                background: white;
                color: #dc3545;
                font-size: 12px;
                padding: 4px 10px;
                border-radius: 4px;
                cursor: pointer;
                transition: all 0.2s;
            }
            .btn-file-delete:hover {
                background: #dc3545;
                color: white;
            }
        </style>
    </th:block>
</head>
<body>
    <div layout:fragment="content">
        <div class="page-container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="page-title">공지사항 등록</h2>
            </div>

            <form action="/notice/register" method="post" enctype="multipart/form-data" id="noticeForm">
                
                <div class="mb-4">
                    <label for="title" class="form-label">제목 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="title" name="title" placeholder="제목을 입력하세요">
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="templateSelect" class="form-label">공지 양식 선택</label>
                        <select class="form-select" id="templateSelect">
                            <option value="">-- 양식을 선택하세요 --</option>
                            <option value="1">1. 회사 경영 및 전체 공지문</option>
                            <option value="2">2. 연휴 관련 사내 공휴일 보도문</option>
                            <option value="3">3. 사내 이슈 및 주의문</option>
                            <option value="4">4. 회사 전산 시스템 점검 및 수정 사항 공지문</option>
                        </select>
                    </div>

                    <div class="col-md-6 d-flex align-items-center mt-4">
                        <label class="switch">
                            <input type="checkbox" id="isPinned" name="isPinned">
                            <span class="slider round"></span>
                        </label>
                        <span class="toggle-label" id="toggleText">일반 공지</span>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="content" class="form-label">내용 <span class="text-danger">*</span></label>
                    <textarea class="form-control" id="content" name="content" rows="10" placeholder="내용을 입력하세요"></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label">썸네일 파일 (이미지 / 다중 가능 / 최대 5개)</label>
                    <input type="file" class="form-control" id="imageInput" accept="image/*" multiple>
                    <input type="file" name="imageFiles" id="realImageInput" style="display:none;" multiple>
                    
                    <div class="form-text mb-2">※ JPG, PNG, GIF 파일만 가능합니다.</div>
                    
                    <div id="imagePreviewArea">
                        <span class="text-muted small">이미지가 선택되지 않았습니다.</span>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">자료 파일 (다중 업로드 가능 / 최대 10개)</label>
                    <input type="file" class="form-control" id="fileInput" multiple>
                    <input type="file" name="generalFiles" id="realFileInput" style="display:none;" multiple>
                    
                    <div class="form-text">가능 확장자: pdf, doc, docx, xls, xlsx, ppt, pptx, txt, zip</div>
                    
                    <div id="fileListArea"></div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="/notice/list" class="btn btn-secondary px-4 py-2" style="border-radius: 8px;">취소</a>
                    <button type="submit" class="btn btn-primary px-4 py-2" style="border-radius: 8px; font-weight: 600;">등록</button>
                </div>
            </form>
        </div>
    </div>

    <th:block layout:fragment="script">
        <script>
            $(document).ready(function() {
                
                // 파일 누적을 위한 DataTransfer 객체 생성
                const dtImages = new DataTransfer();
                const dtFiles = new DataTransfer();

                // ==========================================
                // 1. 이미지 처리 로직
                // ==========================================
                $('#imageInput').change(function() {
                    const files = this.files;
                    
                    if (dtImages.items.length + files.length > 5) {
                        alert("이미지는 최대 5개까지만 등록 가능합니다.");
                        this.value = ''; // 초기화
                        return;
                    }

                    // 선택된 파일들을 DataTransfer에 추가
                    for (let i = 0; i < files.length; i++) {
                        // 중복 체크 (선택 사항)
                        let isDuplicate = false;
                        for(let j=0; j<dtImages.files.length; j++){
                            if(dtImages.files[j].name === files[i].name && dtImages.files[j].size === files[i].size){
                                isDuplicate = true; break;
                            }
                        }
                        if(!isDuplicate) dtImages.items.add(files[i]);
                    }

                    // 실제 input에 값 할당
                    $('#realImageInput')[0].files = dtImages.files;
                    
                    // UI 렌더링
                    renderImagePreviews();
                    
                    // 입력창 초기화 (같은 파일 다시 선택 가능하도록)
                    this.value = ''; 
                });

                function renderImagePreviews() {
                    const $area = $('#imagePreviewArea');
                    $area.empty();

                    if (dtImages.files.length === 0) {
                        $area.html('<span class="text-muted small">이미지가 선택되지 않았습니다.</span>');
                        return;
                    }

                    // 파일 읽기 및 미리보기 생성
                    Array.from(dtImages.files).forEach((file, index) => {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            const html = `
                                <div class="img-preview-box">
                                    <img src="${e.target.result}" alt="preview">
                                    <button type="button" class="btn-img-delete" onclick="removeImage(${index})">
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                </div>
                            `;
                            $area.append(html);
                        }
                        reader.readAsDataURL(file);
                    });
                }

                // 이미지 삭제 함수 (전역 호출을 위해 window에 할당)
                window.removeImage = function(index) {
                    const newDt = new DataTransfer();
                    // 삭제할 인덱스를 제외하고 다시 담기
                    Array.from(dtImages.files).forEach((file, i) => {
                        if (i !== index) newDt.items.add(file);
                    });
                    
                    // 전역 변수 업데이트
                    dtImages.items.clear();
                    Array.from(newDt.files).forEach(file => dtImages.items.add(file));
                    
                    // 실제 input 업데이트
                    $('#realImageInput')[0].files = dtImages.files;
                    
                    // UI 다시 그리기
                    renderImagePreviews();
                }


                // ==========================================
                // 2. 첨부파일 처리 로직
                // ==========================================
                $('#fileInput').change(function() {
                    const files = this.files;
                    const allowedExt = ['pdf', 'doc', 'docx', 'xls', 'xlsx', 'ppt', 'pptx', 'txt', 'zip'];

                    if (dtFiles.items.length + files.length > 10) {
                        alert("파일은 최대 10개까지만 등록 가능합니다.");
                        this.value = '';
                        return;
                    }

                    for (let i = 0; i < files.length; i++) {
                        // 확장자 체크
                        const ext = files[i].name.split('.').pop().toLowerCase();
                        if(!allowedExt.includes(ext)) {
                            alert('허용되지 않는 파일 확장자입니다: ' + files[i].name);
                            continue;
                        }

                        // 중복 체크 및 추가
                        let isDuplicate = false;
                        for(let j=0; j<dtFiles.files.length; j++){
                            if(dtFiles.files[j].name === files[i].name && dtFiles.files[j].size === files[i].size){
                                isDuplicate = true; break;
                            }
                        }
                        if(!isDuplicate) dtFiles.items.add(files[i]);
                    }

                    $('#realFileInput')[0].files = dtFiles.files;
                    renderFileList();
                    this.value = '';
                });

                function renderFileList() {
                    const $area = $('#fileListArea');
                    $area.empty();

                    if (dtFiles.files.length === 0) return;

                    Array.from(dtFiles.files).forEach((file, index) => {
                        const fileSize = (file.size / 1024).toFixed(1) + ' KB';
                        const html = `
                            <div class="file-list-item">
                                <div class="file-info">
                                    <i class="fa-regular fa-file-lines text-secondary"></i>
                                    <span class="fw-bold">${file.name}</span>
                                    <span class="file-size">(${fileSize})</span>
                                </div>
                                <button type="button" class="btn-file-delete" onclick="removeFile(${index})">
                                    <i class="fa-solid fa-xmark"></i> 삭제
                                </button>
                            </div>
                        `;
                        $area.append(html);
                    });
                }

                window.removeFile = function(index) {
                    const newDt = new DataTransfer();
                    Array.from(dtFiles.files).forEach((file, i) => {
                        if (i !== index) newDt.items.add(file);
                    });
                    
                    dtFiles.items.clear();
                    Array.from(newDt.files).forEach(file => dtFiles.items.add(file));
                    
                    $('#realFileInput')[0].files = dtFiles.files;
                    renderFileList();
                }


                // ==========================================
                // 3. 기타 기존 로직 (템플릿, 토글, 유효성 검사)
                // ==========================================
                const templates = {
                    "1": "[전사 공지]\n\n안녕하십니까, 경영지원팀입니다.\n회사의 주요 경영 사항 및 전체 공지 내용을 아래와 같이 전달해 드립니다.\n\n1. 주요 내용:\n2. 시행 일자:\n3. 문의 사항:\n\n임직원 여러분의 많은 협조 부탁드립니다.",
                    "2": "[휴무 안내]\n\n즐거운 명절/공휴일을 맞이하여 사내 휴무 일정을 안내드립니다.\n\n- 휴무 기간: 2026년 00월 00일 ~ 00월 00일\n- 업무 재개: 2026년 00월 00일\n\n연휴 기간 동안 보안 및 시설물 점검에 유의해 주시기 바랍니다.",
                    "3": "[사내 이슈/주의]\n\n최근 사내에서 발생한 이슈와 관련하여 주의 사항을 안내드립니다.\n\n- 발생 내용:\n- 주의 사항:\n\n쾌적하고 안전한 근무 환경을 위해 협조 바랍니다.",
                    "4": "[시스템 점검]\n\n안정적인 서비스 제공을 위해 전산 시스템 정기 점검이 진행될 예정입니다.\n\n- 점검 일시: 2026년 00월 00일 00:00 ~ 00:00 (약 0시간)\n- 점검 대상: 그룹웨어 및 ERP 시스템\n- 유의 사항: 점검 시간 동안 접속이 제한됩니다."
                };

                $('#templateSelect').change(function() {
                    const val = $(this).val();
                    if(val && templates[val]) {
                        if(confirm('작성 중인 내용이 사라지고 선택한 양식으로 대체됩니다. 적용하시겠습니까?')) {
                            $('#content').val(templates[val]);
                        }
                    }
                });

                $('#isPinned').change(function() {
                    if($(this).is(':checked')) {
                        $.ajax({
                            url: '/notice/api/check-pinned',
                            type: 'GET',
                            success: function(isLimitReached) {
                                if(isLimitReached) {
                                    alert("이미 3개의 고정 공지가 있습니다.\n기존 고정 공지를 해제한 후 시도해주세요.");
                                    $('#isPinned').prop('checked', false);
                                    $('#toggleText').text('일반 공지').css('color', '#64748b');
                                } else {
                                    $('#toggleText').text('고정 공지').css('color', '#6366f1');
                                }
                            }
                        });
                    } else {
                        $('#toggleText').text('일반 공지').css('color', '#64748b');
                    }
                });

                $('#noticeForm').submit(function(e) {
                    const title = $('#title').val().trim();
                    const content = $('#content').val().trim();
                    if(!title || !content) {
                        alert('제목과 내용은 필수 입력입니다.');
                        e.preventDefault();
                        return false;
                    }
                    // 파일은 이미 realInput에 동기화되어 있으므로 별도 체크 불필요
                });
            });
        </script>
    </th:block>
</body>
</html>
