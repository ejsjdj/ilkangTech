<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>공정 대시보드</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        /* [공통 레이아웃] */
        .dashboard-container { background-color: #f4f7fa; min-height: 100vh; padding: 2rem; }
        .dashboard-title { font-weight: 800; color: #1e293b; margin-bottom: 1.5rem; letter-spacing: -0.5px; }
        
        /* [상단 요약 카드] */
        .stat-card {
            border: none; border-radius: 16px; transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); background: #fff;
        }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .stat-label { font-size: 0.85rem; color: #64748b; font-weight: 600; }
        .stat-value { font-size: 1.75rem; font-weight: 800; margin-top: 0.5rem; display: block; }
        
        /* [라인 현황 - 가로 배치 핵심] */
        .process-flow-container {
            display: flex; align-items: center; gap: 12px; margin-top: 1rem;
            overflow-x: auto; padding: 10px 0;
        }
        .line-info { min-width: 120px; text-align: center; border-right: 1px solid #e2e8f0; padding-right: 15px; }
        .process-step {
            flex: 1; min-width: 140px; height: 90px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
            font-size: 0.85rem; color: #94a3b8; transition: all 0.2s;
        }
        .process-step.active { border: 2px solid #4f46e5; color: #4f46e5; font-weight: 700; background: #f5f3ff; }
        .process-step.warning { border: 2px solid #f97316; color: #ea580c; background: #fff7ed; }
        
        /* [테이블 스타일] */
        .action-card { border-radius: 16px; border: none; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .table thead th { background-color: #f8fafc; color: #475569; font-weight: 700; border-bottom: 2px solid #e2e8f0; text-align: center; }
        .table td { vertical-align: middle; text-align: center; color: #334155; font-size: 0.9rem; padding: 1rem; }
        
        /* 포인트 컬러 */
        .text-indigo { color: #4f46e5 !important; }
        .text-orange { color: #f97316 !important; }
    </style>
</head>
<body>

<th:block layout:fragment="content">
    <div class="dashboard-container">
        <h2 class="dashboard-title">공정현황 대시보드</h2>

        <div class="row g-4 mb-5">
            <div class="col-md-4">
                <div class="stat-card p-4">
                    <span class="stat-label">오늘 작업지시</span>
                    <span class="stat-value">구현중 <small class="text-success fs-6 fw-normal ms-2"><i class="bi bi-arrow-up"></i> 구현중</small></span>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card p-4">
                    <span class="stat-label">진행 중 작업</span>
                    <span class="stat-value text-primary">구현중</span>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stat-card p-4">
                    <span class="stat-label">QC 대기 / 불합격</span>
                    <span class="stat-value"><span class="text-indigo">3</span> <span class="text-muted fs-4">/</span> 0</span>
                </div>
            </div>
        </div>

        <div class="card stat-card p-4 mb-5">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h5 class="fw-bold m-0">라인 현황 <small class="text-muted fw-normal ms-2" style="font-size: 0.8rem;">진행중 기준</small></h5>
                <div class="d-flex gap-2" style="font-size: 0.75rem;">
                    <span class="badge rounded-pill bg-success-subtle text-success border border-success px-3">정상</span>
                    <span class="badge rounded-pill bg-warning-subtle text-warning border border-warning px-3">주의</span>
                    <span class="badge rounded-pill bg-danger-subtle text-danger border border-danger px-3">지연</span>
                </div>
            </div>
            
            <div class="process-flow-container">
                <div class="line-info">
                    <span class="fw-bold d-block">1라인</span>
                    <small class="text-muted" style="font-size: 0.7rem;">WO-20260201</small>
                </div>
                <div class="process-step">블렌딩</div>
                <div class="process-step">여과</div>
                <div class="process-step">충전</div>
                <div class="process-step">캡·펌프</div>
                <div class="process-step warning">
                    <span class="fw-bold">QC대기</span>
                    <small style="font-size: 0.7rem;">761시간 48분</small>
                </div>
                <div class="process-step">포장</div>
            </div>
        </div>

        <div class="card action-card p-4">
            <h5 class="fw-bold mb-4">즉시 조치 작업 대상 리스트</h5>
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>NO.</th>
                            <th>작업지시번호</th>
                            <th>제품</th>
                            <th>현재 공정</th>
                            <th>상태</th>
                            <th>예정 종료</th>
                            <th>상세</th>
                        </tr>
                    </thead>
                    <tbody id="action-list-tbody">
                        <tr>
                            <td>1</td>
                            <td class="fw-bold">WO-20260201-0003</td>
                            <td>한결5g (HG005)</td>
                            <td>QC 검사 (지연)</td>
                            <td><span class="text-danger"><i class="bi bi-circle-fill me-1" style="font-size: 8px;"></i>지연</span></td>
                            <td>2026-02-03 18:00</td>
                            <td><button class="btn btn-sm btn-outline-primary px-3" style="font-size: 11px;">상세</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>

</body>
</html>
