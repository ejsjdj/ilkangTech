<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>생산계획 등록</title>

    <style>
      .modal {
        display: none;
        position: fixed;
        z-index: 999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.4);
      }

      .modal-content {
        background-color: #fff;
        margin: 10% auto;
        padding: 20px;
        width: 60%;
      }

      .close {
        float: right;
        font-size: 24px;
        cursor: pointer;
      }
    </style>

    <link
      rel="stylesheet"
      href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css"
    />
    <link
      rel="stylesheet"
      href="https://uicdn.toast.com/grid/latest/tui-grid.css"
    />
  </head>

  <body layout:fragment="content">
    <h2>작업지시 목록</h2>

    <!-- 검색 영역 -->
    <input type="text" id="keyword" placeholder="작업지시코드 또는 품목코드" />
    <button id="searchBtn">검색</button>
    <button id="createBtn" style="margin-left: 10px">작업지시 등록</button>

    <div id="grid" style="margin-top: 20px"></div>

    <div id="detailModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h3>작업지시 상세</h3>

        <div id="detailInfo"></div>

        <h4 style="margin-top: 20px">공정별 작업자</h4>
        <table border="1" width="100%">
          <thead>
            <tr>
              <th>공정</th>
              <th>작업자</th>
              <th>상태</th>
            </tr>
          </thead>
          <tbody id="workerTable"></tbody>
        </table>
      </div>
    </div>
  </body>

  <th:block layout:fragment="script">
    <script
      src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"
    ></script>
    <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>

    <script th:src="@{/js/productionInstruct.js}"></script>
  </th:block>
</html>
