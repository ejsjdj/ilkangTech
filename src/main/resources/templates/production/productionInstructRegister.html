<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout/layout}">

<head>
  <title>작업지시 등록</title>

  <link rel="stylesheet" href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
  <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
</head>

<body layout:fragment="content">
  <div style="padding: 20px">
    <h2>신규 작업지시 생성</h2>

    <label>생산계획 선택</label>
    <select id="planeSelect">
      <option value="">-- 생산계획을 선택하세요 --</option>
    </select>

    <br /><br />

    <div>
      <label>작업지시코드</label>
      <input type="text" id="instructCode" readonly />
    </div>

    <br />

    <div>
      <label>계획수량</label>
      <input type="number" id="instructQty" min="1" />
    </div>

    <div>
      <label>지시일자</label>
      <input type="number" id="instructQty" min="1" />
    </div>

    <div>
      <label>시작시간</label>
      <input type="time" id="startTime" />
    </div>

    <div>
      <label>종료시간</label>
      <input type="time" id="endTime" />
    </div>

    <br /><br />

    <!-- 공정 목록 표시 영역 -->
    <div id="processArea">
      <table border="1" style="border-collapse: collapse; width: 100%">
        <thead>
          <tr>
            <th>순번</th>
            <th>품목 ID</th>
            <th>품목명</th>
            <th>공정코드</th>
            <th>공정명</th>
            <th>최소 생산수량</th>
            <th>추가 생산수량</th>
            <th>담당자</th>
          </tr>
        </thead>
        <tbody id="processTableBody">
        </tbody>
      </table>
    </div>

    <br /><br />

    <button id="registerBtn" style="padding: 6px 12px">지시 등록</button>
  </div>
</body>

<th:block layout:fragment="script">
  <script src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
  <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>

  <script th:src="@{/js/productionInstructRegister.js}"></script>
</th:block>

</html>
