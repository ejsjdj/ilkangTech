<!doctype html>
<html
  lang="ko"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  layout:decorate="~{layout/layout}"
>
  <head>
    <title>생산계획 등록</title>

    <style>
      /* 모달 기본 스타일 */
      .modal {
        display: none;
        position: fixed;
        z-index: 9999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(2px);
      }
      .modal-content {
        background-color: #fff;
        margin: 10% auto;
        padding: 28px;
        border-radius: 16px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      }
      .modal-title {
        font-size: 18px;
        font-weight: 800;
        color: #1e293b;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .modal-title::before {
        content: "";
        width: 3px;
        height: 18px;
        background: #4f46e5;
        border-radius: 2px;
      }
      .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 20px;
      }
      .btn-close-modal {
        padding: 8px 16px;
        background: #f1f5f9;
        color: #64748b;
        border-radius: 8px;
        border: none;
        font-weight: 600;
      }
      .btn-action-modal {
        padding: 8px 16px;
        background: #4f46e5;
        color: #fff;
        border-radius: 8px;
        border: none;
        font-weight: 600;
      }
    </style>

    <link
      rel="stylesheet"
      href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css"
    />
    <link
      rel="stylesheet"
      href="https://uicdn.toast.com/grid/latest/tui-grid.css"
    />
  </head>

  <body layout:fragment="content">
    <div style="padding: 20px">
      <h2>신규 생산계획 등록</h2>

      <label>수주코드</label>
      <select id="orderSelect">
        <option value="">-- 수주코드를 선택하세요 --</option>
        <option value="1">ORD-001</option>
        <option value="2">ORD-002</option>
        <option value="3">ORD-003</option>
      </select>

      <br /><br />

      <!-- 🔥 분석 결과 테이블 -->
      <div id="analysisGrid"></div>

      <br />

      <button onclick="goRegister()" style="padding: 6px 12px">
        계획 등록
      </button>
    </div>

    <div id="shortageModal" class="modal">
      <div class="modal-content" style="width: 500px">
        <div class="modal-title">신규 자재 요청</div>

        <div id="shortageContent"></div>

        <div class="modal-footer">
          <button class="btn-close-modal" onclick="closeShortageModal()">
            닫기
          </button>
          <button class="btn-action-modal" onclick="requestMaterials()">
            요청
          </button>
        </div>
      </div>
    </div>
  </body>

  <th:block layout:fragment="script">
    <script
      src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"
    ></script>
    <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>

    <script th:src="@{/js/productionRegist.js}"></script>
  </th:block>
</html>
