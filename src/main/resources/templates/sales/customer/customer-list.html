<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>고객사 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap');

        body { background-color: #FFF5F7; font-family: 'Gamja Flower', cursive; }
        .diary-wrapper { display: flex; max-width: 900px; margin: 50px auto; }
        .diary-bookmarks { display: flex; flex-direction: column; gap: 10px; padding-top: 40px; }
        .bookmark { border: none; padding: 15px 20px; border-radius: 20px 0 0 20px; font-size: 1.1rem; cursor: pointer; transition: all 0.2s; box-shadow: -4px 4px 0px rgba(0,0,0,0.05); }
        .bookmark.pink { background-color: #FFDEE9; color: #FF8E9E; }
        .bookmark.yellow { background-color: #FEF9E7; color: #F7DC6F; }
        .bookmark.active { transform: translateX(10px); font-weight: bold; box-shadow: none; }
        .diary-page { flex: 1; background: white; border: 5px solid #FFDEE9; border-radius: 40px; padding: 40px; min-height: 600px; position: relative; box-shadow: 15px 15px 0px #FFEDF2; }
        .masking-tape { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: rgba(173, 216, 230, 0.6); border-left: 2px dashed #fff; border-right: 2px dashed #fff; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-add-sticker { background: #FF8E9E; color: white; border: none; border-radius: 50px; padding: 8px 20px; box-shadow: 2px 4px 0px #FF5E7E; cursor: pointer; }
        .cute-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .cute-table th { color: #FF8E9E; border-bottom: 2px solid #FFDEE9; padding: 10px; }
        .cute-table td { padding: 15px 10px; border-bottom: 1px solid #F0F0F0; }

        /* 페이지네이션 스타일 */
        .cute-pagination { display: flex; justify-content: center; gap: 8px; margin-top: 24px; }
        .cute-pagination button {
            border: 2px solid #FFDEE9;
            background: white;
            color: #FF8E9E;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-family: 'Gamja Flower', cursive;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cute-pagination button:hover { background: #FFDEE9; }
        .cute-pagination button.active {
            background: #FF8E9E;
            color: white;
            border-color: #FF8E9E;
            font-weight: bold;
            box-shadow: 2px 3px 0px #FF5E7E;
        }
        .cute-pagination button:disabled { opacity: 0.35; cursor: not-allowed; }

        /* 모달 스타일 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.3); z-index: 9999; backdrop-filter: blur(3px); }
        .modal-diary-page { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 40px; border-radius: 30px; border: 4px solid #ADE8F4; width: 400px; box-shadow: 20px 20px 0px rgba(173, 232, 244, 0.5); }
        .yellow-tape { background: rgba(254, 249, 231, 0.8) !important; width: 100px !important; }
        .input-group-cute { margin-bottom: 20px; }
        .input-group-cute label { display: block; color: #FF8E9E; margin-bottom: 5px; }
        .input-group-cute input, .input-group-cute select { width: 100%; padding: 10px; border: 2px dashed #FFDEE9; border-radius: 10px; outline: none; }
        .modal-btns { display: flex; gap: 10px; margin-top: 30px; }
        .btn-sticker { flex: 1; border: none; padding: 10px; border-radius: 20px; color: white; font-weight: bold; cursor: pointer; }
        .btn-sticker.pink { background: #FF8E9E; }
        .btn-sticker.blue { background: #ADE8F4; color: #0077B6; }
    </style>
</head>
<body>

<div layout:fragment="content">
    <div class="diary-wrapper">
        <div class="diary-bookmarks">
            <button class="bookmark pink active"
                    data-category="supplier"
                    onclick="showList(this)">협력사</button>
            <button class="bookmark yellow"
                    data-category="client"
                    onclick="showList(this)">고객사</button>
        </div>

        <div class="diary-page">
            <div class="masking-tape"></div>
            <div class="page-header">
                <h2 id="list-title">협력사 리스트</h2>
                <button type="button" id="openModalBtn" class="btn-add-sticker">+ 추가하기</button>
            </div>

            <table class="cute-table">
                <thead>
                <tr>
                    <th>이름</th>
                    <th>전화번호</th>
                    <th>이메일/메모</th>
                    <th>상세보기</th>
                </tr>
                </thead>
                <tbody id="list-body"></tbody>
            </table>

            <!-- ✅ 페이지네이션 영역 -->
            <div id="pagination" class="cute-pagination"></div>
        </div>
    </div>

    <!-- 모달 -->
    <div id="addModal" class="modal-overlay">
        <div class="modal-diary-page">
            <div class="masking-tape yellow-tape"></div>
            <h3>✨ 새 거래처 등록</h3>

            <form id="addForm">
                <div class="input-group-cute">
                    <label>거래처 명</label>
                    <input type="text" id="newName" placeholder="회사 이름을 적어주세요" required>
                </div>
                <div class="input-group-cute">
                    <label>연락처</label>
                    <input type="text" id="newPhone" placeholder="010-0000-0000">
                </div>
                <div class="input-group-cute">
                    <label>이메일/메모</label>
                    <input type="text" id="newEmail" placeholder="특이사항을 적어주세요">
                </div>
                <div class="input-group-cute">
                    <label>담당자 이름</label>
                    <input type="text" id="newManager" placeholder="담당자 이름">
                </div>
                <div class="input-group-cute">
                    <label>구분</label>
                    <select id="newCategory">
                        <option value="supplier">협력사</option>
                        <option value="client">고객사</option>
                        <option value="partner">둘 다 (협력/고객)</option>
                    </select>
                </div>
                <div class="modal-btns">
                    <button type="button" class="btn-sticker pink" onclick="closeModal()">닫기</button>
                    <button type="submit" class="btn-sticker blue">저장하기!</button>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        'use strict';

        // ✅ 페이지 상태 중앙 관리
        const state = {
            currentPage: 0,
            totalPages: 0,
            currentCategory: 'supplier'
        };

        document.addEventListener('DOMContentLoaded', () => {
            loadList('supplier', 0);

            document.getElementById('openModalBtn')?.addEventListener('click', openModal);
            document.getElementById('addForm')?.addEventListener('submit', handleFormSubmit);
        });

        function openModal() {
            document.getElementById('addModal').style.display = 'block';
        }

        function closeModal() {
            const modal = document.getElementById('addModal');
            const form = document.getElementById('addForm');
            modal.style.display = 'none';
            form?.reset();
        }

        function showList(element) {
            document.querySelectorAll('.bookmark').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            const category = element.dataset.category;
            if (!category) return;

            document.getElementById('list-title').textContent =
                category === 'supplier' ? '협력사 리스트' : '고객사 리스트';

            // ✅ 탭 전환 시 페이지 초기화
            loadList(category, 0);
        }

        async function loadList(category, page = 0) {
            const tbody = document.getElementById('list-body');
            if (!tbody) return;

            state.currentCategory = category;
            state.currentPage = page;

            const url = `/api/sales/company/list?category=${category}&page=${page}&size=10`;

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const json = await res.json();
                console.log('서버 응답:', json);

                if (!json.success) {
                    alert(`로드 실패: ${json.message || '알 수 없는 오류'}`);
                    return;
                }

                const pageData = json.data;
                const items = pageData?.content ?? [];

                // ✅ totalPages 저장 후 페이지네이션 렌더링
                state.totalPages = pageData?.totalPages ?? 0;
                renderPagination();

                tbody.innerHTML = items.length === 0
                    ? '<tr><td colspan="4" style="text-align:center; padding:30px;">등록된 내역이 없어요 ☁️</td></tr>'
                    : '';

                items.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${escapeHtml(item.name ?? '')}</td>
                        <td>${escapeHtml(item.phone ?? '-')}</td>
                        <td>${escapeHtml(item.email ?? '-')} <br>
                            <small style="color:#FF8E9E;">담당: ${escapeHtml(item.manager ?? '없음')}</small>
                        </td>
                        <td><button class="btn-add-sticker" style="padding:2px 10px; font-size:0.8rem;">보기</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error('리스트 로드 오류:', err);
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">서버 연결 오류가 발생했습니다.</td></tr>';
            }
        }

        // ✅ 페이지네이션 버튼 렌더링
        function renderPagination() {
            const container = document.getElementById('pagination');
            if (!container) return;

            container.innerHTML = '';

            if (state.totalPages <= 1) return;

            // 이전 버튼
            const prevBtn = createPageBtn('‹', state.currentPage === 0, () =>
                loadList(state.currentCategory, state.currentPage - 1)
            );
            container.appendChild(prevBtn);

            // 페이지 번호 버튼 (최대 5개 윈도우)
            const { start, end } = getPageWindow(state.currentPage, state.totalPages, 5);

            for (let i = start; i < end; i++) {
                const btn = createPageBtn(String(i + 1), false, () =>
                    loadList(state.currentCategory, i)
                );
                if (i === state.currentPage) btn.classList.add('active');
                container.appendChild(btn);
            }

            // 다음 버튼
            const nextBtn = createPageBtn('›', state.currentPage >= state.totalPages - 1, () =>
                loadList(state.currentCategory, state.currentPage + 1)
            );
            container.appendChild(nextBtn);
        }

        function createPageBtn(label, disabled, onClick) {
            const btn = document.createElement('button');
            btn.textContent = label;
            btn.disabled = disabled;
            if (!disabled) btn.addEventListener('click', onClick);
            return btn;
        }

        // 현재 페이지 기준 슬라이딩 윈도우 계산
        function getPageWindow(current, total, windowSize) {
            let start = Math.max(0, current - Math.floor(windowSize / 2));
            let end = start + windowSize;
            if (end > total) {
                end = total;
                start = Math.max(0, end - windowSize);
            }
            return { start, end };
        }

        async function handleFormSubmit(e) {
            e.preventDefault();

            const payload = {
                name:     document.getElementById('newName')?.value.trim() ?? '',
                phone:    document.getElementById('newPhone')?.value.trim() ?? '',
                email:    document.getElementById('newEmail')?.value.trim() ?? '',
                manager:  document.getElementById('newManager')?.value.trim() ?? '',
                category: document.getElementById('newCategory')?.value ?? ''
            };

            if (!payload.name) { alert('거래처 명은 필수입니다!'); return; }
            if (!['supplier', 'client', 'partner'].includes(payload.category)) {
                alert('구분을 올바르게 선택해주세요!'); return;
            }

            try {
                const res = await fetch('/api/sales/company/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) {
                    let msg = '저장 실패';
                    try { const errData = await res.json(); msg = errData.message || msg; } catch {}
                    throw new Error(msg);
                }

                alert('성공적으로 저장되었습니다! ✨');
                closeModal();
                loadList(state.currentCategory, state.currentPage);
            } catch (err) {
                console.error('저장 오류:', err);
                alert(`저장 실패: ${err.message || '네트워크 오류가 발생했습니다.'}`);
            }
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</div>

</body>
</html>
