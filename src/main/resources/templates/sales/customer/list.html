<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>고객사 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        /* 폰트 적용 (Google Fonts 등에서 나눔손글씨 추천) */
        @import url('https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap');

        body {
            background-color: #FFF5F7; /* 아주 연한 핑크 배경 */
            font-family: 'Gamja Flower', cursive;
        }

        .diary-wrapper {
            display: flex;
            max-width: 900px;
            margin: 50px auto;
        }

        /* 왼쪽 탭: 스티커 느낌 */
        .diary-bookmarks {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-top: 40px;
        }

        .bookmark {
            border: none;
            padding: 15px 20px;
            border-radius: 20px 0 0 20px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: -4px 4px 0px rgba(0,0,0,0.05);
        }

        .bookmark.pink { background-color: #FFDEE9; color: #FF8E9E; }
        .bookmark.yellow { background-color: #FEF9E7; color: #F7DC6F; }

        .bookmark.active {
            transform: translateX(10px); /* 눌린 느낌 */
            font-weight: bold;
            box-shadow: none;
        }

        /* 다이어리 속지 */
        .diary-page {
            flex: 1;
            background: white;
            border: 5px solid #FFDEE9; /* 두꺼운 핑크 테두리 */
            border-radius: 40px;
            padding: 40px;
            min-height: 600px;
            position: relative;
            box-shadow: 15px 15px 0px #FFEDF2;
        }

        /* 상단 마스킹 테이프 꾸미기 */
        .masking-tape {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background: rgba(173, 216, 230, 0.6); /* 반투명 하늘색 테이프 */
            border-left: 2px dashed #fff;
            border-right: 2px dashed #fff;
        }

        .btn-add-sticker {
            background: #FF8E9E;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 8px 20px;
            box-shadow: 2px 4px 0px #FF5E7E;
        }

        /* 테이블 디자인 */
        .cute-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .cute-table th {
            color: #FF8E9E;
            border-bottom: 2px solid #FFDEE9;
            padding: 10px;
        }

        .cute-table td {
            padding: 15px 10px;
            border-bottom: 1px solid #F0F0F0;
        }

        .cute-table tr:hover {
            background-color: #FFF9FA;
        }
    </style>
</head>
<body>
<div layout:fragment="content" class="diary-container">
    <div class="diary-container">
        <div class="diary-wrapper">
            <div class="diary-bookmarks">
                <button class="bookmark pink active" onclick="showList('vendor')">
                    <span>협력사</span>
                </button>
                <button class="bookmark yellow" onclick="showList('customer')">
                    <span>고객사</span>
                </button>
            </div>

            <div class="diary-page">
                <div class="masking-tape"></div>

                <div class="page-header">
                    <h2 id="list-title">My 협력사 리스트</h2>
                    <button class="btn-add-sticker">+ 추가하기</button>
                </div>

                <table class="cute-table">
                    <thead>
                    <tr>
                        <th>이름</th>
                        <th>전화번호</th>
                        <th>이메일</th>
                        <th>상세정보</th>
                    </tr>
                    </thead>
                    <tbody id="list-body">
                    <tr>
                        <td>(주)무지개컴퍼니</td>
                        <td>010-1234-5678</td>
                        <td>매주 화요일 방문 ✨</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>

<script>
    function showList(type) {
    // 1. 모든 북마크 활성화 해제 및 클릭된 것 활성화
    document.querySelectorAll('.bookmark').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    // 2. 제목 변경
    const title = type === 'vendor' ? '협력사 목록' : '고객사 목록';
    document.getElementById('list-title').innerText = title;

    // 3. 데이터 가져오기 (Fetch API 사용 예시)
    fetch(`/api/partners?type=${type}`)
        .then(response => response.json())
        .then(data => {
            renderTable(data);
        });
}

function renderTable(data) {
    const tbody = document.getElementById('list-body');
    tbody.innerHTML = data.map(item => `
        <tr>
            <td>${item.code}</td>
            <td>${item.name}</td>
            <td>${item.phone}</td>
            <td>${item.status}</td>
        </tr>
    `).join('');
}
</script>
