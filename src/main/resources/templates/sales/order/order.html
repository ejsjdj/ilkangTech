<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>수주 내역</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap');

        body { background-color: #FFF5F7; font-family: 'Gamja Flower', cursive; }
        .diary-wrapper { display: flex; max-width: 900px; margin: 50px auto; }
        .diary-bookmarks { display: flex; flex-direction: column; gap: 10px; padding-top: 40px; }
        .bookmark { border: none; padding: 15px 20px; border-radius: 20px 0 0 20px; font-size: 1.1rem; cursor: pointer; transition: all 0.2s; box-shadow: -4px 4px 0px rgba(0,0,0,0.05); }
        .bookmark.pink { background-color: #FFDEE9; color: #FF8E9E; }
        .bookmark.yellow { background-color: #FEF9E7; color: #F7DC6F; }
        .bookmark.active { transform: translateX(10px); font-weight: bold; box-shadow: none; }
        .diary-page { flex: 1; background: white; border: 5px solid #FFDEE9; border-radius: 40px; padding: 40px; min-height: 600px; position: relative; box-shadow: 15px 15px 0px #FFEDF2; }
        .masking-tape { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: rgba(173, 216, 230, 0.6); border-left: 2px dashed #fff; border-right: 2px dashed #fff; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-add-sticker { background: #FF8E9E; color: white; border: none; border-radius: 50px; padding: 8px 20px; box-shadow: 2px 4px 0px #FF5E7E; cursor: pointer; }
        .cute-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .cute-table th { color: #FF8E9E; border-bottom: 2px solid #FFDEE9; padding: 10px; }
        .cute-table td { padding: 15px 10px; border-bottom: 1px solid #F0F0F0; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.3); z-index: 9999; backdrop-filter: blur(3px); }
        .modal-diary-page { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 40px; border-radius: 30px; border: 4px solid #ADE8F4; width: 400px; box-shadow: 20px 20px 0px rgba(173, 232, 244, 0.5); }
        .yellow-tape { background: rgba(254, 249, 231, 0.8) !important; width: 100px !important; }
        .input-group-cute { margin-bottom: 20px; }
        .input-group-cute label { display: block; color: #FF8E9E; margin-bottom: 5px; }
        .input-group-cute input, .input-group-cute select { width: 100%; padding: 10px; border: 2px dashed #FFDEE9; border-radius: 10px; outline: none; }
        .modal-btns { display: flex; gap: 10px; margin-top: 30px; }
        .btn-sticker { flex: 1; border: none; padding: 10px; border-radius: 20px; color: white; font-weight: bold; cursor: pointer; }
        .btn-sticker.pink { background: #FF8E9E; }
        .btn-sticker.blue { background: #ADE8F4; color: #0077B6; }
    </style>
</head>
<body>

<div layout:fragment="content">
    <div class="diary-wrapper">

        <div class="diary-bookmarks">
            <button class="bookmark pink active"
                    data-category="PENDING"
                    onclick="showList(this)">납품예정</button>
            <button class="bookmark yellow"
                    data-category="COMPLETED"
                    onclick="showList(this)">납품완료</button>
        </div>

        <div class="diary-page">
            <div class="masking-tape"></div>
            <div class="page-header">
                <h2 id="list-little">납품예정</h2>
                <button type="button" id="openModalBtn" class="btn-add-sticker">+ 추가하기</button>
            </div>

            <table class="cute-table">
                <thead>
                <tr>
                    <th>주문코드</th>
                    <th>고객사명</th>
                    <th>납품예정일</th>
                    <th>상세</th>
                </tr>
                </thead>
                <tbody id="list-body"></tbody>
            </table>

            <div id="pagination-bar" class="mt-3" style="text-align:center;"></div>
        </div>

        <div id="addModal" class="modal-overlay">
            <div class="modal-diary-page" style="width: 450px;">
                <div class="masking-tape yellow-tape"></div>
                <h3>새 주문 등록</h3>

                <form id="addForm">
                    <div class="input-group-cute">
                        <label>주문코드 <span class="text-danger">*</span></label>
                        <input type="text" id="newCode" placeholder="새 주문 코드를 입력하세요" required>
                    </div>

                    <div class="input-group-cute">
                        <label>고객사명 <span class="text-danger">*</span></label>
                        <select id="companyId" required>
                            <option value="">-- 고객사 선택 ---</option>
                        </select>
                    </div>

                    <div class="input-group-cute">
                        <label>납품예정일 <span class="text-danger">*</span></label>
                        <input type="date" id="deliveryDate" required>
                    </div>

                    <div class="input-group-cute">
                        <label>주문 품목</label>
                        <table class="table table-sm" id="itemTable">
                            <thead>
                            <tr>
                                <th>품목</th>
                                <th>수량</th>
                                <th></th>
                            </tr>
                            </thead>
                            <tbody id="orderItemList"></tbody>
                        </table>
                        <button type="button" class="btn btn-outline-secondary btn-sm" id="addItemBtn">
                            + 품목 추가
                        </button>
                    </div>

                    <div class="modal-btns">
                        <button type="submit" class="btn-sticker pink">등록</button>
                        <button type="button" class="btn-sticker blue" id="closeModalBtn">취소</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script th:inline="javascript">
        let currentCategory = 'PENDING';

        document.getElementById('openModalBtn').addEventListener('click', () => {
            document.getElementById('addModal').style.display = 'block';
        });
        document.getElementById('closeModalBtn').addEventListener('click', () => {
            document.getElementById('addModal').style.display = 'none';
        });

        function showList(element) {
            document.querySelectorAll('.bookmark').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            const category = element.dataset.category;
            if (!category) return;

            currentCategory = category;
            document.getElementById('list-little').textContent =
                category === 'PENDING' ? '납품예정' : '납품완료';

            loadList(category, 0);
        }

        async function loadList(category, page = 0) {
            const tbody = document.getElementById('list-body');
            if (!tbody) return;
            const url = `/api/orders/list?category=${category}&page=${page}&size=10`;

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const json = await res.json();

                if (!json.success) {
                    alert(`로드 실패: ${json.message || '알 수 없는 오류'}`);
                    return;
                }

                const orders = json.data?.content ?? [];

                tbody.innerHTML = orders.length === 0
                    ? '<tr><td colspan="4" style="text-align:center; padding:30px;">등록된 내역이 없어요 ☁️</td></tr>'
                    : '';

                orders.forEach(order => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${order.orderCode ?? '-'}</td>
                        <td>${order.companyName ?? '-'}</td>
                        <td>${order.deliveryDate ?? '-'}</td>
                        <td>
                            <button class="btn-add-sticker"
                                    style="padding:2px 10px; font-size:0.8rem;"
                                    onclick="openDetail(${order.orderId})">자세히</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                renderPagination(category, json.data);

            } catch (err) {
                console.error('리스트 로드 오류:', err);
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">서버 연결 오류가 발생했습니다.</td></tr>';
            }
        }

        function renderPagination(category, pageData) {
            const bar = document.getElementById('pagination-bar');
            if (!bar) return;

            const totalPages = pageData?.totalPages ?? 0;
            const currentPage = pageData?.number ?? 0;

            bar.innerHTML = '';

            for (let i = 0; i < totalPages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i + 1;
                btn.className = 'btn btn-sm mx-1 ' + (i === currentPage ? 'btn-danger' : 'btn-outline-secondary');
                btn.onclick = () => loadList(category, i);
                bar.appendChild(btn);
            }
        }

        document.getElementById('addItemBtn').addEventListener('click', () => {
            const tbody = document.getElementById('orderItemList');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>
                    <select class="form-select form-select-sm item-select">
                        <option value="">-- 선택 --</option>
                    </select>
                </td>
                <td>
                    <input type="number" class="form-control form-control-sm item-qty" min="1" value="1">
                </td>
                <td>
                    <button type="button" class="btn btn-danger btn-sm"
                        onclick="this.closest('tr').remove()">✕</button>
                </td>
            `;
            tbody.appendChild(row);
            loadItemOptions(row.querySelector('.item-select'));
        });

        function loadItemOptions(selectEl) {
            // TODO: fetch('/api/items').then(...)
        }

        loadList('PENDING', 0);
    </script>

</div>

</body>
</html>
