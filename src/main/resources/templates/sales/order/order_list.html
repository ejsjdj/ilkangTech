<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>수주 내역</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap');

        body { background-color: #FFF5F7; font-family: 'Gamja Flower', cursive; }
        .diary-wrapper { display: flex; max-width: 900px; margin: 50px auto; }
        .diary-bookmarks { display: flex; flex-direction: column; gap: 10px; padding-top: 40px; }
        .bookmark { border: none; padding: 15px 20px; border-radius: 20px 0 0 20px; font-size: 1.1rem; cursor: pointer; transition: all 0.2s; box-shadow: -4px 4px 0px rgba(0,0,0,0.05); }
        .bookmark.pink { background-color: #FFDEE9; color: #FF8E9E; }
        .bookmark.yellow { background-color: #FEF9E7; color: #F7DC6F; }
        .bookmark.active { transform: translateX(10px); font-weight: bold; box-shadow: none; }
        .diary-page { flex: 1; background: white; border: 5px solid #FFDEE9; border-radius: 40px; padding: 40px; min-height: 600px; position: relative; box-shadow: 15px 15px 0px #FFEDF2; }
        .masking-tape { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: rgba(173, 216, 230, 0.6); border-left: 2px dashed #fff; border-right: 2px dashed #fff; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-add-sticker { background: #FF8E9E; color: white; border: none; border-radius: 50px; padding: 8px 20px; box-shadow: 2px 4px 0px #FF5E7E; cursor: pointer; }
        .cute-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .cute-table th { color: #FF8E9E; border-bottom: 2px solid #FFDEE9; padding: 10px; }
        .cute-table td { padding: 15px 10px; border-bottom: 1px solid #F0F0F0; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.3); z-index: 9999; backdrop-filter: blur(3px); }
        .modal-diary-page { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 40px; border-radius: 30px; border: 4px solid #ADE8F4; width: 400px; box-shadow: 20px 20px 0px rgba(173, 232, 244, 0.5); }
        .yellow-tape { background: rgba(254, 249, 231, 0.8) !important; width: 100px !important; }
        .input-group-cute { margin-bottom: 20px; }
        .input-group-cute label { display: block; color: #FF8E9E; margin-bottom: 5px; }
        .input-group-cute input, .input-group-cute select { width: 100%; padding: 10px; border: 2px dashed #FFDEE9; border-radius: 10px; outline: none; }
        .modal-btns { display: flex; gap: 10px; margin-top: 30px; }
        .btn-sticker { flex: 1; border: none; padding: 10px; border-radius: 20px; color: white; font-weight: bold; cursor: pointer; }
        .btn-sticker.pink { background: #FF8E9E; }
        .btn-sticker.blue { background: #ADE8F4; color: #0077B6; }
    </style>
</head>
<body>

    <div layout:fragment="content">
        <div class="diary-wrapper">
            <div class="diary-bookmarks">
                <button class="bookmark pink active" data-status="PENDING" onclick="changeStatus(this)">납품예정</button>
                <button class="bookmark yellow" data-status="COMPLETED" onclick="changeStatus(this)">납품완료</button>
            </div>

            <div class="diary-page">
                <div class="masking-tape"></div>
                <div class="page-header">
                    <h2 id="list-title">수주 현황 (납품예정)</h2>
                    <button type="button" class="btn-add-sticker" onclick="openAddModal()">+ 신규 수주</button>
                </div>

                <table class="cute-table">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>고객사명</th>
                        <th>주문일시</th>
                        <th>납기예정일</th>
                        <th>상태</th>
                        <th>관리</th>
                    </tr>
                    </thead>
                    <tbody id="list-body"></tbody>
                </table>
                <div id="pagination" class="cute-pagination"></div>
            </div>
        </div>

        <!-- 1. 신규 수주 등록 모달 -->
        <div id="addModal" class="modal-overlay">
            <div class="modal-diary-page" style="width: 700px; max-height: 90vh; overflow-y: auto;">
                <div class="masking-tape yellow-tape"></div>
                <h3>✨ 신규 수주 등록</h3>
                <form id="addOrderForm">
                    <div class="row">
                        <div class="col-md-6 input-group-cute">
                            <label>고객사 <span class="text-danger">*</span></label>
                            <select id="companySelect" class="form-select" required style="border: 2px dashed #FFDEE9; border-radius: 10px; padding: 10px;">
                                <option value="">-- 고객사 선택 --</option>
                            </select>
                        </div>
                        <div class="col-md-6 input-group-cute">
                            <label>납기 요청일시 <span class="text-danger">*</span></label>
                            <input type="datetime-local" id="expectedDeliveryDate" required style="width: 100%; padding: 10px; border: 2px dashed #FFDEE9; border-radius: 10px; outline: none;">
                        </div>
                    </div>

                    <div style="margin-top: 20px; border-top: 2px dashed #FFDEE9; padding-top: 20px;">
                        <h5 style="color: #FF8E9E;">📦 주문 품목</h5>
                        <table class="table table-sm" style="font-size: 0.9rem;">
                            <thead>
                                <tr>
                                    <th>품목</th>
                                    <th style="width: 100px;">수량</th>
                                    <th style="width: 150px;">단가</th>
                                    <th style="width: 50px;"></th>
                                </tr>
                            </thead>
                            <tbody id="orderItemsBody">
                                <!-- 품목 행이 추가될 곳 -->
                            </tbody>
                        </table>
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="addItemRow()">+ 품목 추가</button>
                    </div>

                    <div class="modal-btns">
                        <button type="button" class="btn-sticker pink" onclick="closeModal('addModal')">닫기</button>
                        <button type="submit" class="btn-sticker blue">등록하기!</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 2. 수주 상세 보기 모달 -->
        <div id="detailModal" class="modal-overlay">
            <div class="modal-diary-page" style="width: 600px;">
                <div class="masking-tape yellow-tape"></div>
                <h3>📖 수주 상세 내역</h3>
                <div id="detailHeader" style="background: #FEF9E7; padding: 15px; border-radius: 15px; border: 2px dashed #F7DC6F; margin-bottom: 20px;">
                    <!-- 상세 헤더 정보 -->
                </div>
                <h5 style="color: #FF8E9E;">📦 품목 리스트</h5>
                <div style="max-height: 300px; overflow-y: auto;">
                    <table class="cute-table" style="font-size: 0.9rem;">
                        <thead>
                            <tr>
                                <th>품목코드</th>
                                <th>품목명</th>
                                <th>수량</th>
                                <th>단가</th>
                                <th>합계</th>
                            </tr>
                        </thead>
                        <tbody id="detailItemsBody"></tbody>
                    </table>
                </div>
                <div class="modal-btns">
                    <button type="button" class="btn-sticker blue" id="btnDeliver" style="display: none;">납기하기</button>
                    <button type="button" class="btn-sticker pink" onclick="closeModal('detailModal')">닫기</button>
                </div>
            </div>
        </div>

        <script th:inline="javascript">
            'use strict';

            const state = {
                currentStatus: 'PENDING',
                currentPage: 0,
                totalPages: 0,
                companies: [],
                items: []
            };

            document.addEventListener('DOMContentLoaded', () => {
                loadList('PENDING', 0);
                fetchInitialData();
                document.getElementById('addOrderForm').addEventListener('submit', handleOrderSubmit);
            });

            async function fetchInitialData() {
                try {
                    // 고객사 목록 (client 타입만 또는 전체)
                    const companyRes = await fetch('/api/sales/company/list?companyType=client&size=100');
                    const companyJson = await companyRes.json();
                    state.companies = companyJson.data?.content || [];
                    
                    const companySelect = document.getElementById('companySelect');
                    state.companies.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c.companyId;
                        opt.textContent = c.companyName;
                        companySelect.appendChild(opt);
                    });

                    // 품목 목록 (완제품 중심)
                    const itemRes = await fetch('/api/item/list?type=FG&size=100');
                    const itemJson = await itemRes.json();
                    state.items = itemJson.data?.content || [];
                } catch (err) {
                    console.error('초기 데이터 로딩 실패:', err);
                }
            }

            function changeStatus(btn) {
                document.querySelectorAll('.bookmark').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.currentStatus = btn.dataset.status;
                document.getElementById('list-title').textContent = `수주 현황 (${btn.textContent})`;
                loadList(state.currentStatus, 0);
            }

            async function loadList(status, page = 0) {
                const tbody = document.getElementById('list-body');
                state.currentPage = page;
                
                try {
                    const res = await fetch(`/api/sales/orders?page=${page}&size=10&sort=orderId,desc`);
                    if (!res.ok) throw new Error('서버 응답 오류');
                    const json = await res.json();
                    
                    const orders = json.data || [];
                    // 클라이언트 사이드 필터링 (원래는 서버에서 처리해야 함)
                    const filtered = orders.filter(o => {
                        if (status === 'PENDING') {
                            return ['PENDING', 'READY', 'NEED_PRODUCTION', '결제대기', '납기가능', '생산필요'].includes(o.orderStatus);
                        }
                        if (status === 'COMPLETED') {
                            return ['COMPLETED', '주문완료', '납품완료'].includes(o.orderStatus);
                        }
                        return o.orderStatus === status;
                    });

                    tbody.innerHTML = filtered.length === 0 
                        ? '<tr><td colspan="6" style="text-align:center; padding:30px;">내역이 없습니다.</td></tr>' 
                        : '';

                    filtered.forEach(o => {
                        const tr = document.createElement('tr');
                        const statusClass = (status) => {
                            if (status === 'READY' || status === '납기가능') return 'bg-primary';
                            if (status === 'NEED_PRODUCTION' || status === '생산필요') return 'bg-danger';
                            if (status === 'PENDING' || status === '결제대기') return 'bg-info';
                            if (status === 'COMPLETED' || status === '납품완료') return 'bg-success';
                            if (status === 'CANCELED' || status === '주문취소') return 'bg-secondary';
                            return 'bg-info';
                        };

                        tr.innerHTML = `
                            <td>${o.orderId}</td>
                            <td>${escapeHtml(o.companyName || '-')}</td>
                            <td>${formatDate(o.orderDate)}</td>
                            <td>${formatDate(o.expectedDeliveryDate)}</td>
                            <td><span class="badge ${statusClass(o.orderStatus)}">${o.orderStatus}</span></td>
                            <td><button class="btn btn-sm btn-outline-primary" onclick="loadOrderDetail(${o.orderId})">상세보기</button></td>
                        `;
                        tbody.appendChild(tr);
                    });
                } catch (err) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">데이터를 불러오지 못했습니다.</td></tr>';
                }
            }

            function openAddModal() {
                document.getElementById('addModal').style.display = 'block';
                document.getElementById('orderItemsBody').innerHTML = '';
                addItemRow(); // 기본 행 하나 추가
            }

            function closeModal(id) {
                document.getElementById(id).style.display = 'none';
                if(id === 'addModal') document.getElementById('addOrderForm').reset();
            }

            function addItemRow() {
                const tbody = document.getElementById('orderItemsBody');
                const tr = document.createElement('tr');
                
                let itemOptions = state.items.map(it => `<option value="${it.itemId}" data-price="${it.standardPrice || 0}">[${it.itemCode}] ${it.itemName}</option>`).join('');

                tr.innerHTML = `
                    <td>
                        <select class="form-select form-select-sm item-select" required onchange="updateRowPrice(this)">
                            <option value="">-- 품목 선택 --</option>
                            ${itemOptions}
                        </select>
                    </td>
                    <td><input type="number" class="form-control form-control-sm item-qty" min="1" value="1" required></td>
                    <td><input type="number" class="form-control form-control-sm item-price" min="0" value="0" required></td>
                    <td><button type="button" class="btn btn-sm text-danger" onclick="this.closest('tr').remove()"><i class="bi bi-trash"></i></button></td>
                `;
                tbody.appendChild(tr);
            }

            function updateRowPrice(select) {
                const opt = select.options[select.selectedIndex];
                const price = opt.dataset.price || 0;
                const row = select.closest('tr');
                row.querySelector('.item-price').value = price;
            }

            async function handleOrderSubmit(e) {
                e.preventDefault();
                
                const rows = document.querySelectorAll('#orderItemsBody tr');
                const orderDetails = Array.from(rows).map(row => ({
                    itemId: row.querySelector('.item-select').value,
                    quantity: row.querySelector('.item-qty').value,
                    unitPrice: row.querySelector('.item-price').value
                }));

                const payload = {
                    companyId: document.getElementById('companySelect').value,
                    expectedDeliveryDate: document.getElementById('expectedDeliveryDate').value,
                    orderDetails: orderDetails
                };

                try {
                    const res = await fetch('/api/sales/orders', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (res.ok) {
                        alert('수주가 성공적으로 등록되었습니다! ✨');
                        closeModal('addModal');
                        loadList(state.currentStatus, 0);
                    } else {
                        throw new Error('등록 실패');
                    }
                } catch (err) {
                    alert('수주 등록 중 오류가 발생했습니다.');
                }
            }

            async function loadOrderDetail(id) {
                try {
                    const res = await fetch(`/api/sales/orders/${id}`);
                    const json = await res.json();
                    const order = json.data;

                    document.getElementById('detailHeader').innerHTML = `
                        <div class="row">
                            <div class="col-6"><strong>고객사:</strong> ${escapeHtml(order.companyName)}</div>
                            <div class="col-6"><strong>상태:</strong> ${order.orderStatus}</div>
                            <div class="col-6"><strong>주문일시:</strong> ${formatDate(order.orderDate)}</div>
                            <div class="col-6"><strong>납기예정:</strong> ${formatDate(order.expectedDeliveryDate)}</div>
                        </div>
                    `;

                    const itemsBody = document.getElementById('detailItemsBody');
                    itemsBody.innerHTML = '';
                    let total = 0;
                    order.orderDetails.forEach(d => {
                        const sum = (d.quantity || 0) * (d.unitPrice || 0);
                        total += sum;
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${escapeHtml(d.itemCode || '-')}</td>
                            <td>${escapeHtml(d.itemName || '-')}</td>
                            <td>${d.quantity}</td>
                            <td>${(d.unitPrice || 0).toLocaleString()}</td>
                            <td>${sum.toLocaleString()}</td>
                        `;
                        itemsBody.appendChild(tr);
                    });
                    
                    const totalTr = document.createElement('tr');
                    totalTr.innerHTML = `<td colspan="4" style="text-align:right; font-weight:bold;">총 합계:</td><td style="font-weight:bold;">${total.toLocaleString()}</td>`;
                    itemsBody.appendChild(totalTr);

                    const btnDeliver = document.getElementById('btnDeliver');
                    if (['READY', '납기가능'].includes(order.orderStatus)) {
                        btnDeliver.style.display = 'block';
                        btnDeliver.onclick = () => performDelivery(order.orderId);
                    } else {
                        btnDeliver.style.display = 'none';
                    }

                    document.getElementById('detailModal').style.display = 'block';
                } catch (err) {
                    alert('상세 정보를 불러오지 못했습니다.');
                }
            }

            async function performDelivery(orderId) {
                if (!confirm('납기 처리를 완료하시겠습니까?\n이 작업은 재고를 차감하며 되돌릴 수 없습니다.')) return;

                try {
                    const res = await fetch(`/api/sales/orders/${orderId}/delivery`, {
                        method: 'POST'
                    });
                    const json = await res.json();

                    if (res.ok && json.success) {
                        alert('납기 처리가 완료되었습니다. ✨');
                        closeModal('detailModal');
                        loadList(state.currentStatus, state.currentPage);
                    } else {
                        throw new Error(json.message || '납기 처리 실패');
                    }
                } catch (err) {
                    alert(`오류: ${err.message}`);
                }
            }

            function formatDate(dtStr) {
                if(!dtStr) return '-';
                const d = new Date(dtStr);
                return d.toLocaleString('ko-KR', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
            }

            function escapeHtml(unsafe) {
                if(!unsafe) return '';
                return unsafe.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
            }
        </script>
    </div>



</body>
</html>
