<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>일정 관리</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <th:block layout:fragment="style">
        <style>
            /* --- 기존 스타일 유지 --- */
            .page-container { 
            	background: #ffffff; border-radius: 8px; padding: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); min-height: 800px;
                position: relative; display: flex; flex-direction: column; 
            }
            .page-header { margin-bottom: 20px; }
            .page-title { font-size: 24px; font-weight: 700; color: #333; margin-bottom: 10px; }
            
            .header-control form { width: 100%; display: flex; justify-content: space-between; align-items: center; }
            .header-control { margin-bottom: 15px !important; }
            
            .search-left-group { display: flex; align-items: center; gap: 8px; }
            .search-right-group { display: flex; align-items: center; gap: 5px; }

            /* 입력창/버튼 높이 통일 (38px) */
            .input-date-fixed, .search-select, .search-input, 
            .btn-search, .btn-reset, .btn-custom-blue { 
            	height: 38px !important; line-height: 1.5; font-size: 13px; box-sizing: border-box;
                vertical-align: middle; border-radius: 4px; 
            }
            .input-date-fixed { width: 150px; padding: 0 10px; border: 1px solid #ced4da; color: #666; }
            .search-select { width: 100px; border: 1px solid #ced4da; padding: 0 10px; cursor: pointer; }
            .search-input { width: 220px; border: 1px solid #ced4da; padding: 0 10px; }
            
            .btn-search {
                background-color: #fff; border: 1px solid #5c6bc0; color: #5c6bc0;
                padding: 0 15px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
            }
            .btn-search:hover { background-color: #5c6bc0; color: white; }

            .btn-custom-blue {
                background-color: #fff; border: 1px solid #5c6bc0; color: #5c6bc0; padding: 0 15px; display: inline-flex; align-items: center; 
                justify-content: center; font-weight: 600; text-decoration: none; cursor: pointer;
            }
            .btn-custom-blue:hover { background-color: #5c6bc0; color: white; }
            
            .btn-reset {
                border: 1px solid #ced4da; background: #fff; color: #666; width: 38px; padding: 0; display: inline-flex; align-items: center; 
                justify-content: center; text-decoration: none !important; 
            }

            /* 테이블 스타일 */
            .custom-table { width: 100%; border-collapse: collapse; font-size: 14px; border: 1px solid #e0e0e0; }
            .custom-table thead th { background-color: #f8f9fa; color: #495057; font-weight: 600; text-align: center; border-bottom: 1px solid #dee2e6; padding: 12px; }
            .custom-table tbody td { padding: 12px; border-bottom: 1px solid #f0f0f0; color: #333; text-align: center; vertical-align: middle; }
            .custom-table tbody tr:hover { background-color: #f1f3f5; }
            .sort-icon { font-size: 10px; color: #aaa; margin-left: 4px; cursor: pointer; }
            .no-data { text-align: center; padding: 50px 0; color: #adb5bd; }

            /* 페이지네이션 */
            .pagination-container { margin-top: 30px; margin-bottom: 30px; display: flex; justify-content: center; width: 100%;}
            .pagination .page-link { 
	            display: flex; justify-content: center; align-items: center; width: 34px; height: 34px; color: #333; background-color: #fff; 
	            border: 1px solid #dee2e6; border-radius: 4px; text-decoration: none; transition: all 0.2s; cursor: pointer; 
	        }
            .pagination .page-item.active .page-link { background-color: #5c6bc0; border-color: #5c6bc0; color: #fff; z-index: 1; font-weight: 600; }
            .pagination .page-link:hover { background-color: #e9ecef; color: #5c6bc0; border-color: #dee2e6; }
            .pagination .page-item.disabled .page-link { color: #ccc; pointer-events: none; background-color: #f8f9fa; border-color: #dee2e6; }
            
            ul.pagination { 
	            display: flex !important; flex-direction: row !important; list-style: none !important; padding: 0 !important; 
	            margin: 0 !important; gap: 5px; align-items: center !important; 
	        }
            li.page-item { list-style: none !important; margin: 0 !important; padding: 0 !important; display: flex !important; }
            
            .clickable-th { cursor: pointer; user-select: none; }
            
            /* --- [모달 관련 스타일 추가] --- */
            .modal-header { background-color: #f8f9fa; border-bottom: 1px solid #dee2e6; }
            .modal-title { font-weight: 700; color: #333; font-size: 18px; }
            .form-label { font-weight: 600; color: #495057; font-size: 14px; margin-bottom: 6px; }
            .required-star { color: #dc3545; margin-left: 2px; }
            
            /* 파일 미리보기 영역 */
            #filePreviewArea {
                margin-top: 10px; padding: 10px; border: 1px dashed #ced4da; border-radius: 4px; background: #fafafa;
                min-height: 50px; display: flex; align-items: center; justify-content: center; color: #888;
            }
            #filePreviewArea img { max-width: 100%; max-height: 200px; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

            /* 검색 결과 리스트 (스크롤) */
            .search-result-box { max-height: 300px; overflow-y: auto; border: 1px solid #dee2e6; border-radius: 4px; margin-top: 10px; }
            .search-result-item { padding: 10px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; cursor: pointer; }
            .search-result-item:hover { background-color: #f8f9fa; }
            .search-result-item:last-child { border-bottom: none; }
            .search-result-item input[type="checkbox"] { margin-right: 10px; transform: scale(1.2); cursor: pointer; }
            /* --- [커스텀 배지 색상 적용] --- */
            .badge-company { background-color: #ff5b7f !important; color: #fff !important; }
            .badge-team { background-color: #3da5ff !important; color: #fff !important; }
            .badge-personal { background-color: #f1c40f !important; color: #fff !important; }
            .badge-leave { background-color: #b7f3c4 !important; color: #333 !important; }
            .badge-specific { background-color: #9C27B0 !important; color: #fff !important; }
        </style>
    </th:block>
</head>
<body>

<div layout:fragment="content">
    <div class="page-container">
        
        <div class="page-header">
            <h2 class="page-title">일정관리</h2>
        </div>

        <div class="header-control mb-3">
            <form action="/schedule/list" method="get" id="searchForm">
                <input type="hidden" name="sortField" id="sortField" th:value="${sortField}">
                <input type="hidden" name="sortDir" id="sortDir" th:value="${sortDir}">
                <input type="hidden" name="page" id="page" value="1">

                <div class="search-left-group">
                    <input type="date" name="startDate" id="startDate" class="input-date-fixed" 
                           th:value="${searchParams.startDate != null ? #temporals.format(searchParams.startDate, 'yyyy-MM-dd') : ''}">
                    <span class="fw-bold text-secondary">~</span>
                    <input type="date" name="endDate" id="endDate" class="input-date-fixed"
                           th:value="${searchParams.endDate != null ? #temporals.format(searchParams.endDate, 'yyyy-MM-dd') : ''}">
                    <button type="submit" class="btn btn-search">조회</button>
                    <a th:href="@{/schedule/list}" class="btn-reset" title="초기화"><i class="fa-solid fa-arrows-rotate"></i></a>
                </div>

                <div class="search-right-group"> 
                    <select name="searchType" class="search-select">
                        <option value="title" th:selected="${searchParams.searchType == 'title'}">제목</option>
                        <option value="type" th:selected="${searchParams.searchType == 'type'}">종류</option>
                        <option value="content" th:selected="${searchParams.searchType == 'content'}">내용</option>
                        <option value="writer" th:selected="${searchParams.searchType == 'writer'}">작성자</option>
                    </select>
                    <input type="text" name="keyword" class="search-input" placeholder="검색어 입력" th:value="${searchParams.keyword}">
                    
                    <button type="button" class="btn btn-custom-blue" id="btnOpenScheduleModal">
                        <i class="fa-solid fa-plus" style="margin-right: 4px;"></i> 일정 등록
                    </button>
                </div>
            </form>
        </div>

        <div class="table-responsive">
            <table class="table custom-table text-center">
                <thead>
                    <tr>
                        <th style="width: 60px;">No.</th>
                        <th class="clickable-th" onclick="goSort('title')">일정제목 <span class="sort-icon" th:text="${sortField == 'title' ? (sortDir == 'asc' ? '▲' : '▼') : '▽'}"></span></th>
                        <th style="width: 80px;" class="clickable-th" onclick="goSort('type')">종류 <span class="sort-icon" th:text="${sortField == 'type' ? (sortDir == 'asc' ? '▲' : '▼') : '▽'}"></span></th>
                        <th style="width: 160px;" class="clickable-th" onclick="goSort('startDate')">일정시작 <span class="sort-icon" th:text="${sortField == 'startDate' ? (sortDir == 'asc' ? '▲' : '▼') : '▽'}"></span></th>
                        <th style="width: 160px;" class="clickable-th" onclick="goSort('endDate')">일정마감 <span class="sort-icon" th:text="${sortField == 'endDate' ? (sortDir == 'asc' ? '▲' : '▼') : '▽'}"></span></th>
                        <th style="width: 100px;" class="clickable-th" onclick="goSort('writer.name')">작성자 <span class="sort-icon" th:text="${sortField == 'writer.name' ? (sortDir == 'asc' ? '▲' : '▼') : '▽'}"></span></th>
                        <th>내용</th>
                        <th style="width: 80px;">첨부파일</th>
                        <th style="width: 80px;">상세</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${schedules.totalElements == 0}"><td colspan="8" class="no-data">등록된 일정이 없습니다.</td></tr>
                    <tr th:each="dto, state : ${schedules}">
                        <td th:text="${(schedules.number * schedules.size) + state.count}">1</td>
                        <td class="fw-bold text-dark"><span th:text="${dto.title}">제목</span></td>
                        <td>
                            <span class="badge rounded-pill"
						          th:classappend="${(dto.title.contains('[연차]') or dto.title.contains('[반차]')) ? 'badge-leave' : 
						                          (dto.type == 'COMPANY' ? 'badge-company' : 
						                          (dto.type == 'TEAM' ? 'badge-team' : 
						                          (dto.type == 'PERSONAL' ? 'badge-personal' : 
						                          (dto.type == 'LEAVE' ? 'badge-leave' : 
						                          'badge-specific'))))}"
						          th:text="${dto.title.contains('[연차]') ? '연차' : 
						                   (dto.title.contains('[반차]') ? '반차' : 
						                   (dto.type == 'COMPANY' ? '회사' : 
						                   (dto.type == 'TEAM' ? '팀' : 
						                   (dto.type == 'PERSONAL' ? '개인' : 
						                   (dto.type == 'LEAVE' ? '연차' : '특정')))))}">
						    </span>
                        </td>
                        <td th:text="${#temporals.format(dto.startDate, 'yyyy-MM-dd HH:mm')}"></td>
                        <td th:text="${#temporals.format(dto.endDate, 'yyyy-MM-dd HH:mm')}"></td>
                        <td th:text="${dto.writerName}"></td>
                        <td class="text-muted text-truncate" style="max-width: 200px; margin: 0 auto;" th:text="${dto.content}">내용</td>
                        <td>
				            <span th:if="${dto.thumbnailPath != null or (dto.fileList != null and !dto.fileList.empty)}">
							    <i class="fa-solid fa-paperclip text-secondary" title="첨부파일 있음"></i> (첨부)
							</span>
							
							<span th:unless="${dto.thumbnailPath != null or (dto.fileList != null and !dto.fileList.empty)}" 
							      class="text-muted" style="font-size: 13px;">
							    미첨부
							</span>
				        </td>
                        <td>
                        	<button type="button" class="btn btn-sm btn-outline-primary btn-detail" 
						            th:data-id="${dto.id}">
						        상세
						    </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination-container" th:if="${schedules.totalElements > 0}">
            <nav aria-label="Page navigation">
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                        <a class="page-link" href="javascript:void(0)" th:onclick="'goPage(1)'">«</a>
                    </li>
                    <li class="page-item" th:classappend="${schedules.first} ? 'disabled'">
                        <a class="page-link" href="javascript:void(0)" th:onclick="'goPage(' + ${currentPage - 1} + ')'">‹</a>
                    </li>
                    <li class="page-item" th:each="page: ${#numbers.sequence(startPage, endPage)}" th:classappend="${page == currentPage} ? 'active'">
                        <a class="page-link" href="javascript:void(0)" th:text="${page}" th:onclick="'goPage(' + ${page} + ')'">1</a>
                    </li>
                    <li class="page-item" th:classappend="${schedules.last} ? 'disabled'">
                        <a class="page-link" href="javascript:void(0)" th:onclick="'goPage(' + ${currentPage + 1} + ')'">›</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == schedules.totalPages} ? 'disabled'">
                        <a class="page-link" href="javascript:void(0)" th:onclick="'goPage(' + ${schedules.totalPages} + ')'">»</a>
                    </li>
                </ul>
            </nav>
        </div>

    </div> 
    <div class="modal fade" id="scheduleModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title"><i class="fa-regular fa-calendar-check me-2"></i>일정 등록</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="scheduleForm" enctype="multipart/form-data">
                        
                        <div class="mb-3">
                            <label class="form-label">제목 <span class="required-star">*</span></label>
                            <input type="text" class="form-control" id="schedTitle" name="title" placeholder="일정 제목을 입력하세요">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">공유 범위 <span class="required-star">*</span></label>
                            <div class="row g-2">
                                <div class="col-md-3">
                                    <select class="form-select" id="schedType" name="type">
                                        <option value="PERSONAL" selected>개인</option>
                                        <!-- <option value="LEAVE">연차</option> -->
                                        <option value="COMPANY">회사</option>
                                        <option value="TEAM">팀</option>
                                        <option value="SPECIFIC">특정</option>
                                    </select>
                                </div>
                                
                                <div class="col-md-9" id="shareTargetArea" style="display:none;">
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="selectedTargetNames" readonly placeholder="공유할 대상을 선택하세요" style="background-color: #f8f9fa;">
                                        <button class="btn btn-outline-primary" type="button" id="btnOpenTargetModal">
                                            + 조직도 선택
                                        </button>
                                    </div>
                                    <div id="hiddenIdArea"></div>
                                </div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">시작 시간 <span class="required-star">*</span></label>
                                <input type="datetime-local" class="form-control" id="schedStart" name="startDate">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">종료 시간 <span class="required-star">*</span></label>
                                <input type="datetime-local" class="form-control" id="schedEnd" name="endDate">
                            </div>
                        </div>

                        <div class="mb-3">
						    <label class="form-label">썸네일 파일 (이미지)</label>
						    <div class="input-group">
						        <input type="file" class="form-control" id="schedThumbnail" name="thumbnail" accept="image/*">
						    </div>
						    <div class="form-text text-muted">※ 게시글의 대표 이미지를 등록해주세요.</div>
						    <div id="thumbnailPreview" class="mt-2 p-2 border rounded bg-light text-center" style="display:none;">
						        <img src="" style="max-height: 150px; border-radius: 5px;">
						    </div>
						</div>
						
						<div class="mb-3">
						    <label class="form-label">자료 파일 (다중 업로드 가능)</label>
						    <div class="input-group">
						        <input type="file" class="form-control" id="schedDataFiles" name="dataFiles" multiple>
						    </div>
						    <div id="fileListPreview" class="mt-2">
						        </div>
						</div>

                        <div class="mb-3">
                            <label class="form-label">일정 메모 <span class="required-star">*</span></label>
                            <textarea class="form-control" id="schedContent" name="content" rows="5" placeholder="일정 내용을 입력하세요"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" id="btnRegister">등록</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="searchTargetModal" tabindex="-1" aria-hidden="true" style="z-index: 1060;">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h6 class="modal-title" id="searchModalTitle">조직도에서 공유자 선택</h6>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="input-group mb-2">
                        <input type="text" class="form-control" id="targetSearchKeyword" placeholder="이름 검색">
                        <button class="btn btn-outline-secondary" type="button" id="btnTargetSearch">검색</button>
                    </div>
                    
                    <div class="search-result-box" id="targetResultList"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                    <button type="button" class="btn btn-primary" id="btnConfirmTarget">적용</button>
                </div>
            </div>
        </div>
    </div>
	<div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
	    <div class="modal-dialog modal-lg">
	        <div class="modal-content">
	            <div class="modal-header">
	                <h5 class="modal-title">일정 상세 / 수정</h5>
	                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
	            </div>
	            <div class="modal-body">
	                <form id="detailForm" enctype="multipart/form-data">
	                    <input type="hidden" id="detailId" name="id"> <div class="mb-3">
	                        <label for="detailTitle" class="form-label">제목</label>
	                        <input type="text" class="form-control" id="detailTitle" name="title">
	                    </div>
	
	                    <div class="mb-3">
	                        <label class="form-label">공유 범위</label>
	                        <div class="row g-2">
	                        	<div class="col-md-3">
	                        		<select class="form-select" id="detailType" name="type">
						                <option value="PERSONAL">개인</option>
						                <option value="COMPANY">회사 전체</option>
						                <option value="TEAM">팀 공유</option>
						                <option value="SPECIFIC">특정 사원 공유</option>
						                <!-- <option value="LEAVE">연차</option> -->
						            </select>
	                        	</div>
	                        	<div class="col-md-9" id="detailShareTargetArea" style="display:none;">
						            <div class="input-group">
						                <input type="text" class="form-control" id="detailTargetNames" readonly placeholder="공유 대상" style="background-color: #f8f9fa;">
						                <button class="btn btn-outline-primary" type="button" id="btnOpenDetailTargetModal">
						                    + 변경
						                </button>
						            </div>
						            <div id="detailHiddenIdArea"></div>
						        </div>
	                        </div>
	                    </div>
	
	                    <div class="row mb-3">
	                        <div class="col">
	                            <label class="form-label">시작일</label>
	                            <input type="datetime-local" class="form-control" id="detailStartDate" name="startDate">
	                        </div>
	                        <div class="col">
	                            <label class="form-label">종료일</label>
	                            <input type="datetime-local" class="form-control" id="detailEndDate" name="endDate">
	                        </div>
	                    </div>
	
	                    <div class="mb-3">
	                        <label class="form-label">작성자</label>
	                        <input type="text" class="form-control" id="detailWriterName" readonly disabled>
	                    </div>
	
	                    <div class="mb-3">
						    <label class="form-label">썸네일 이미지</label>
						    
						    <div id="detailThumbnailArea" class="mb-2 text-center" style="display:none; background: #f8f9fa; padding: 10px; border-radius: 8px;">
						        <img src="" id="detailThumbnailImg" style="max-width: 100%; max-height: 200px; border-radius: 5px; margin-bottom: 10px;">
						        <br>
						        <a id="btnDownloadThumbnail" href="#" class="btn btn-sm btn-dark">
						            <i class="fa-solid fa-download me-1"></i> 썸네일 저장
						        </a>
						    </div>
						
						    <div class="input-group">
						        <input type="file" class="form-control" id="detailThumbnailFile" name="thumbnail" accept="image/*">
						    </div>
						    <div class="form-text text-muted">※ 새로운 이미지를 선택하면 기존 썸네일이 교체됩니다.</div>
						</div>
						
						<div class="mb-3">
						    <label class="form-label">첨부 파일</label>
						    <div id="detailFileListArea" class="border rounded p-2 bg-light mb-2">
						        <span class="text-muted small">첨부된 파일이 없습니다.</span>
						    </div>
						
						    <input type="file" class="form-control" id="detailDataFiles" name="dataFiles" multiple>
						    
						    <div id="detailNewFilePreview" class="mt-2"></div>
						</div>
	
	                    <div class="mb-3">
	                        <label class="form-label">내용</label>
	                        <textarea class="form-control" id="detailContent" name="content" rows="5"></textarea>
	                    </div>
	                </form>
	            </div>
	            <div class="modal-footer">
	                <button type="button" class="btn btn-danger" id="btnDelete">삭제</button>
	                <button type="button" class="btn btn-primary" id="btnUpdate">수정하기</button>
	                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
	            </div>
	        </div>
	    </div>
	</div>
</div> 
<th:block layout:fragment="script">
    <script th:inline="javascript">
		$(document).ready(function() {
		        
		        // 모달 구분 변수 ('regist' or 'detail')
		        let activeModalSource = 'regist'; 
		        // [추가] 파일 누적 저장을 위한 전역 배열
		        let totalSelectedFiles = [];
		        
		        // [추가] 파일 목록 UI 렌더링 함수
		        function updateFilePreview() {
		        	const $area = (activeModalSource === 'regist') 
				                  ? $('#fileListPreview') 
				                  : $('#detailNewFilePreview');
		            $area.empty();

		            if (totalSelectedFiles.length > 0) {
		                let html = '<ul class="list-group list-group-flush">';
		                totalSelectedFiles.forEach((file, index) => {
		                    // 파일 크기 계산 (KB)
		                    let size = (file.size / 1024).toFixed(1) + ' KB';
		                    html += `
		                        <li class="list-group-item d-flex justify-content-between align-items-center py-1">
		                            <span>
		                                <i class="fa-solid fa-file me-2 text-secondary"></i>
		                                ${file.name} <span class="text-muted" style="font-size:12px;">(${size})</span>
		                            </span>
		                            <button type="button" class="btn btn-sm btn-outline-danger btn-remove-file" data-index="${index}" style="font-size: 12px; padding: 2px 6px;">
		                                <i class="fa-solid fa-xmark"></i> 삭제
		                            </button>
		                        </li>`;
		                });
		                html += '</ul>';
		                $area.html(html);
		            } else {
		                // 파일이 없을 때 메시지 (선택 사항)
		                // $area.html('<span class="text-muted small p-2">선택된 파일이 없습니다.</span>');
		            }
		        }

		        // [추가] 파일 개별 삭제 버튼 이벤트 (동적 바인딩)
		        $(document).on('click', '.btn-remove-file', function() {
		            const index = $(this).data('index');
		            // 배열에서 해당 인덱스의 파일 제거
		            totalSelectedFiles.splice(index, 1);
		            // UI 갱신
		            updateFilePreview();
		        });
		
		        // 1. [공통] UI 제어 및 조직도 검색 관련 함수
		        // (1) 공유 범위(Type)에 따라 입력창 숨기기/보이기 처리
		        function updateShareUI(source, type) {
		            // source에 따라 제어할 ID 결정
		            const $targetArea = (source === 'regist') ? $('#shareTargetArea') : $('#detailShareTargetArea');
		            const $btnLabel   = (source === 'regist') ? $('#btnOpenTargetModal') : $('#btnOpenDetailTargetModal');
		            
		            // "변경" 이벤트로 호출된 경우 기존 값 초기화 (상세 조회 로드 시에는 초기화 안 함)
		            // 이 함수를 호출할 때 reset=true 파라미터를 받거나, 호출부에서 처리
		            
		            if (type === 'PERSONAL' || type === 'COMPANY' || type === 'LEAVE') {
		                $targetArea.hide();
		            } else {
		                $targetArea.show().css('display', 'flex');
		                
		                let btnText = (type === 'TEAM') ? '<i class="fa-solid fa-users me-1"></i> +공유팀 지정' : '<i class="fa-solid fa-user-plus me-1"></i> +공유자 지정';
		                $btnLabel.html(btnText);
		            }
		        }
		
		        // (2) 조직도 모달 열기 및 리스트 로드
		        function openSearchModal(source) {
		            activeModalSource = source; // 현재 소스 저장 (regist or detail)
		
		            // 현재 선택된 타입 가져오기
		            const typeId = (source === 'regist') ? '#schedType' : '#detailType';
		            const type = $(typeId).val();
		
		            $('#targetResultList').empty();
		            $('#targetSearchKeyword').val('');
		
		            if(type === 'TEAM') {
		                $('#searchModalTitle').text('조직도에서 공유팀 선택');
		                loadTeamList('');
		            } else {
		                $('#searchModalTitle').text('조직도에서 공유자 선택');
		                loadMemberList('');
		            }
		            
		            var searchModal = new bootstrap.Modal(document.getElementById('searchTargetModal'));
		            searchModal.show();
		        }
		
		        // (3) AJAX Helper Functions
		        function loadTeamList(keyword) {
		            $.get('/api/search/team', { keyword: keyword }, function(data) { renderList(data, 'team'); });
		        }
		        function loadMemberList(keyword) {
		            $.get('/api/search/member', { keyword: keyword }, function(data) { renderList(data, 'member'); });
		        }
		        function renderList(list, type) {
		            const $container = $('#targetResultList');
		            $container.empty();
		            
		            if(!list || list.length === 0) {
		                $container.append('<div class="p-3 text-center text-muted">검색 결과가 없습니다.</div>');
		                return;
		            }
		            list.forEach(item => {
		                const id = item.id; 
		                const name = (type === 'team') ? item.departmentName : `${item.name} (${item.employeeNumber})`;
		                const icon = (type === 'team') ? '<i class="fa-solid fa-people-group text-info me-2"></i>' : '<i class="fa-solid fa-user text-secondary me-2"></i>';
		                const html = `
		                    <label class="search-result-item">
		                        <input class="form-check-input target-checkbox" type="checkbox" value="${id}" data-name="${name}">
		                        ${icon} <span>${name}</span>
		                    </label>`;
		                $container.append(html);
		            });
		        }
		
		        // 2. [등록 모달] 이벤트 리스너	        
		        // 등록 모달 열기
		        $('#btnOpenScheduleModal').click(function() {
		            activeModalSource = 'regist';
		            $('#scheduleForm')[0].reset();
		            
		         	// [추가] 파일 배열 및 미리보기 영역 초기화
		            totalSelectedFiles = []; 
		            $('#fileListPreview').empty();
		            
		            $('#filePreviewArea').html('<span>첨부된 파일이 없습니다.</span>');
		            $('#shareTargetArea').hide();
		            $('#hiddenIdArea').empty();
		            
		            new bootstrap.Modal(document.getElementById('scheduleModal')).show();
		        });
		
		        // 등록창 - 공유 범위 변경
		        $('#schedType').change(function() {
		            // 타입 변경 시 기존 선택 값 초기화
		            $('#selectedTargetNames').val('');
		            $('#hiddenIdArea').empty();
		            
		            updateShareUI('regist', $(this).val());
		        });
		
		        // 등록창 - [+공유 대상] 버튼 클릭
		        $('#btnOpenTargetModal').click(function() {
		            openSearchModal('regist');
		        });
		
		     	// 1. 썸네일 이미지 미리보기
		        $('#schedThumbnail').change(function() {
		            const file = this.files[0];
		            const $previewBox = $('#thumbnailPreview');
		            const $img = $previewBox.find('img');

		            if (file && file.type.startsWith('image/')) {
		                const reader = new FileReader();
		                reader.onload = function(e) {
		                    $img.attr('src', e.target.result);
		                    $previewBox.show();
		                }
		                reader.readAsDataURL(file);
		            } else {
		                $img.attr('src', '');
		                $previewBox.hide();
		            }
		        });

		     	// [수정] 자료 파일 (다중 업로드) - 누적 선택 방식
		        $('#schedDataFiles').change(function() {
		            // 1. 새로 선택된 파일들을 가져옴
		            const newFiles = Array.from(this.files);
		            
		            // 2. 전역 배열에 추가 (누적)
		            totalSelectedFiles = totalSelectedFiles.concat(newFiles);
		            
		            // 3. UI 갱신
		            updateFilePreview();
		            
		            // 4. input 값 초기화 (동일한 파일을 다시 선택해도 change 이벤트가 발생하도록, 그리고 덮어쓰기 방지 시각적 효과)
		            $(this).val('');
		        });
		     	
		     	// [추가] 상세 모달 - 파일 추가 (누적 선택)
		        $('#detailDataFiles').change(function() {
		            const newFiles = Array.from(this.files);
		            totalSelectedFiles = totalSelectedFiles.concat(newFiles); // 누적
		            updateFilePreview(); // UI 갱신
		            $(this).val(''); // input 초기화
		        });
		
		        // 등록 버튼 클릭
		        $('#btnRegister').click(function() {
		            const title = $('#schedTitle').val().trim();
		            const type = $('#schedType').val();
		            const startDate = $('#schedStart').val();
		            const endDate = $('#schedEnd').val();
		            const content = $('#schedContent').val().trim();
		
		            if (!title || !startDate || !endDate || !content) { alert("제목, 공유범위, 메모는 필수 입력입니다."); return; }
		            if (startDate > endDate) { alert("종료 시간은 시작 시간보다 빠를 수 없습니다."); return; }
		            if ((type === 'TEAM' || type === 'SPECIFIC') && $('#hiddenIdArea').children().length === 0) { alert("공유할 대상을 지정해주세요."); return; }
		
		         	// 1. 기본 Form 데이터 가져오기 (텍스트 데이터 등)
		            const formData = new FormData($('#scheduleForm')[0]);
		            
		         	// 2. 기존 input에 들어있을 수 있는 'dataFiles' 키를 제거 (중복 전송 방지)
		            formData.delete('dataFiles');
		         	
		         	// 3. 누적된 파일 배열(totalSelectedFiles)에 있는 파일들을 수동으로 추가
		            if (totalSelectedFiles.length > 0) {
		                totalSelectedFiles.forEach(file => {
		                    formData.append('dataFiles', file);
		                });
		            }
		         	
		            $.ajax({
		                url: '/schedule/regist', 
		                type: 'POST', 
		                data: formData, 
		                contentType: false, 
		                processData: false, 
		                success: function(res) { 
		                	alert('등록되었습니다.'); 
		                	location.reload(); 
		                },
		                error: function(err) { 
		                	alert('등록 실패'); 
		                	console.error(err); 
		                }
		            });
		        });
		
		     	// [추가] 상세 모달 - 썸네일 변경 시 미리보기 즉시 반영
		        $('#detailThumbnailFile').change(function() {
		            const file = this.files[0];
		            const $previewArea = $('#detailThumbnailArea');
		            const $img = $('#detailThumbnailImg');
		            
		            if (file && file.type.startsWith('image/')) {
		                const reader = new FileReader();
		                reader.onload = function(e) {
		                    $img.attr('src', e.target.result);
		                    $previewArea.show(); // 이미지가 없던 경우에도 영역 표시
		                    
		                    // (선택사항) 새로 올린 파일은 아직 서버에 없으므로 다운로드 버튼은 숨기는 게 자연스러움
		                    $('#btnDownloadThumbnail').hide(); 
		                }
		                reader.readAsDataURL(file);
		            }
		        });
		     	
		        // 상세 버튼 클릭 (데이터 로드)
		        $(document).on('click', '.btn-detail', function() {
		            activeModalSource = 'detail';
		            
		            totalSelectedFiles = []; 
		            $('#detailNewFilePreview').empty();
		            
		            let scheduleId = $(this).data('id');
		            
		            $.ajax({
		                url: '/schedule/get/' + scheduleId,
		                type: 'GET',
		                success: function(data) {
		                    // 기본 데이터 바인딩
		                    $('#detailId').val(data.id);
		                    $('#detailTitle').val(data.title);
		                    $('#detailType').val(data.type);
		                    $('#detailContent').val(data.content);
		                    $('#detailWriterName').val(data.writerName);
		                    if(data.startDate) $('#detailStartDate').val(data.startDate);
		                    if(data.endDate) $('#detailEndDate').val(data.endDate);
		
		                    // 파일 표시
		                    // 1. 썸네일 처리
		                    $('#detailThumbnailFile').val('');
							if (data.thumbnailPath) {
								// 이미지 경로 설정 (미리보기용)
							    $('#detailThumbnailImg').attr('src', '/upload/' + data.thumbnailPath); 
								
							 	// 다운로드 버튼 링크 설정
							    $('#btnDownloadThumbnail').attr('href', '/schedule/download/thumbnail/' + data.id);
							    $('#detailThumbnailArea').show();
							} else {
							    $('#detailThumbnailArea').hide();
							}
		                    
							// [수정] 2. 첨부파일 리스트 처리
							const $fileArea = $('#detailFileListArea');
							$fileArea.empty();

							if (data.fileList && data.fileList.length > 0) {
							    let html = '<ul class="list-group list-group-flush">';
							    data.fileList.forEach(f => {
							        // 다운로드 링크 + 삭제 버튼 생성
							        html += `
							            <li class="list-group-item d-flex justify-content-between align-items-center py-1" id="file-item-${f.id}">
							                <a href="/schedule/download/${f.id}" class="text-decoration-none text-dark">
							                    <i class="fa-solid fa-download text-primary me-2"></i> ${f.originalFileName}
							                </a>
							                <button type="button" class="btn btn-sm btn-outline-danger btn-delete-db-file" data-id="${f.id}" style="font-size: 11px; padding: 1px 6px;">
							                    삭제
							                </button>
							            </li>`;
							    });
							    html += '</ul>';
							    $fileArea.html(html);
							} else {
							    $fileArea.html('<span class="text-muted small">첨부된 파일이 없습니다.</span>');
							}
		
		                    // 공유 범위 UI 세팅 (값 초기화 없이 UI만 갱신)
		                    updateShareUI('detail', data.type);
		
		                    // 기존 공유 데이터(이름/ID) 복원
		                    const $hiddenArea = $('#detailHiddenIdArea');
		                    const $nameInput = $('#detailTargetNames');
		                    $hiddenArea.empty();
		                    $nameInput.val('');
		
		                    // DTO에서 받아온 리스트로 Hidden Input 생성
		                    if (data.type === 'TEAM' && data.sharedDeptIds) {
		                        $nameInput.val(data.sharedDeptNames ? data.sharedDeptNames.join(', ') : '');
		                        data.sharedDeptIds.forEach(id => {
		                            $hiddenArea.append(`<input type="hidden" name="sharedDeptIds" value="${id}">`);
		                        });
		                    } else if (data.type === 'SPECIFIC' && data.sharedMemberIds) {
		                        $nameInput.val(data.sharedMemberNames ? data.sharedMemberNames.join(', ') : '');
		                        data.sharedMemberIds.forEach(id => {
		                            $hiddenArea.append(`<input type="hidden" name="sharedMemberIds" value="${id}">`);
		                        });
		                    }
		
		                    $('#detailModal').modal('show');
		                },
		                error: function() { alert('정보를 불러오는데 실패했습니다.'); }
		            });
		        });
		
		        // 수정창 - 공유 범위 변경
		        $('#detailType').change(function() {
		            // 변경 시 값 초기화
		            $('#detailTargetNames').val('');
		            $('#detailHiddenIdArea').empty();
		            
		            updateShareUI('detail', $(this).val());
		        });
		
		        // 수정창 - [+공유 대상] 버튼 클릭
		        $('#btnOpenDetailTargetModal').click(function() {
		            openSearchModal('detail');
		        });
		
		        // 수정하기 버튼
		        $('#btnUpdate').on('click', function() {
		            if(!confirm('일정을 수정하시겠습니까?')) return;
		            
		            let formData = new FormData($('#detailForm')[0]);
		            
		         	// [추가] 기존 input의 파일 목록 제거 후 배열에 있는 파일들로 교체
		            formData.delete('dataFiles'); 
		            
		            if (totalSelectedFiles.length > 0) {
		                totalSelectedFiles.forEach(file => {
		                    formData.append('dataFiles', file);
		                });
		            }
		            
		            // 공유 대상 필수 체크 로직 추가
		            const type = $('#detailType').val();
		            if ((type === 'TEAM' || type === 'SPECIFIC') && $('#detailHiddenIdArea').children().length === 0) {
		                 alert("공유할 대상을 지정해주세요.");
		                 return;
		            }
		
		            $.ajax({
		                url: '/schedule/update', type: 'POST', data: formData, contentType: false, processData: false,
		                success: function(res) { alert(res); location.reload(); },
		                error: function(xhr) { alert(xhr.responseText || '수정 실패'); }
		            });
		        });
		
		        // 삭제 버튼
		        $('#btnDelete').on('click', function() {
		            if(!confirm('정말 삭제하시겠습니까?')) return;
		            $.post('/schedule/delete', { id: $('#detailId').val() })
		             .done(function(res) { alert(res); location.reload(); })
		             .fail(function(xhr) { alert(xhr.responseText || '삭제 실패'); });
		        });
		
		        // 4. [조직도 서브 모달] 공통 기능
		        // 검색 버튼
		        $('#btnTargetSearch').click(function() {
		            const keyword = $('#targetSearchKeyword').val();
		            const typeId = (activeModalSource === 'regist') ? '#schedType' : '#detailType';
		            const type = $(typeId).val();
		            
		            if(type === 'TEAM') loadTeamList(keyword);
		            else loadMemberList(keyword);
		        });
		
		        // 엔터키
		        $('#targetSearchKeyword').on('keyup', function(key) {
		            if(key.keyCode == 13) $('#btnTargetSearch').click();
		        });
		
		        // [중요] 적용 버튼 (Regist와 Detail 분기 처리)
		        $('#btnConfirmTarget').click(function() {
		            const selectedIds = [];
		            const selectedNames = [];
		            
		            $('.target-checkbox:checked').each(function() {
		                selectedIds.push($(this).val());
		                selectedNames.push($(this).data('name'));
		            });
		
		            if(selectedIds.length === 0) { alert('대상을 선택해주세요.'); return; }
		
		            // 현재 활성화된 모달(activeModalSource)에 따라 타겟 지정
		            const $nameInput  = (activeModalSource === 'regist') ? $('#selectedTargetNames') : $('#detailTargetNames');
		            const $hiddenArea = (activeModalSource === 'regist') ? $('#hiddenIdArea') : $('#detailHiddenIdArea');
		            const typeId      = (activeModalSource === 'regist') ? '#schedType' : '#detailType';
		            
		            // UI 표시
		            $nameInput.val(selectedNames.join(', '));
		            
		            // Hidden Input 생성
		            const type = $(typeId).val();
		            const inputName = (type === 'TEAM') ? 'sharedDeptIds' : 'sharedMemberIds';
		            
		            let html = '';
		            selectedIds.forEach(id => {
		                html += `<input type="hidden" name="${inputName}" value="${id}">`;
		            });
		            $hiddenArea.html(html);
		
		            // 서브 모달 닫기
		            bootstrap.Modal.getInstance(document.getElementById('searchTargetModal')).hide();
		        });
		
		    }); // ready End
		
		    // 페이지 이동 함수 (HTML onclick에서 호출됨)
		    function goPage(page) {
		        document.getElementById('page').value = page;
		        document.getElementById('searchForm').submit();
		    }
		    function goSort(field) {
		        const currentField = document.getElementById('sortField').value;
		        const currentDir = document.getElementById('sortDir').value;
		        if (currentField === field) {
		            document.getElementById('sortDir').value = (currentDir === 'asc') ? 'desc' : 'asc';
		        } else {
		            document.getElementById('sortField').value = field;
		            document.getElementById('sortDir').value = 'desc';
		        }
		        document.getElementById('page').value = 1;
		        document.getElementById('searchForm').submit();
		    }
		    
		 	// [추가] 기존 첨부파일 삭제 버튼 클릭 (DB 삭제)
		    $(document).on('click', '.btn-delete-db-file', function() {
		        if(!confirm('이 파일을 영구적으로 삭제하시겠습니까?')) return;

		        const fileId = $(this).data('id');
		        const $liItem = $('#file-item-' + fileId);

		        $.ajax({
		            url: '/schedule/file/delete',
		            type: 'POST',
		            data: { fileId: fileId },
		            success: function(res) {
		                alert(res); // "삭제되었습니다."
		                $liItem.remove(); // 화면에서 즉시 제거
		                
		                // 다 지워졌으면 '파일 없음' 표시
		                if ($('#detailFileListArea li').length === 0) {
		                    $('#detailFileListArea').html('<span class="text-muted small">첨부된 파일이 없습니다.</span>');
		                }
		            },
		            error: function(xhr) {
		                // 서버에서 보낸 에러 메시지(예: "파일 삭제 권한이 없습니다.")가 있으면 보여줌
		                alert(xhr.responseText || '파일 삭제에 실패했습니다.');
		            }
		        });
		    });
    </script>
</th:block>
