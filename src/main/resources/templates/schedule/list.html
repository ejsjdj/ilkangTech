<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title>일정 관리</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <th:block layout:fragment="style">
		<style>
		    /* 전체 컨테이너 스타일 */
		    .page-container {
		        background: #ffffff;
		        border-radius: 8px;
		        padding: 25px;
		        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
		        min-height: 800px;
		        position: relative;
		        display: flex;
		        flex-direction: column;
		    }
		
		    /* 타이틀 영역 */
		    .page-header {
		        margin-bottom: 20px;
		    }
		    .page-title {
		        font-size: 24px;
		        font-weight: 700;
		        color: #333;
		        margin-bottom: 10px;
		    }
		    
		    /* [수정] 검색 폼이 한 줄 전체를 차지하고 양끝 정렬 */
		    .header-control form {
		        width: 100%;
		        display: flex;
		        justify-content: space-between; 
		        align-items: center;
		    }
		
		    /* 좌측 날짜 영역 그룹 */
		    .search-left-group {
		        display: flex;
		        align-items: center;
		        gap: 8px;
		    }
		
		    /* 우측 검색어+버튼 영역 그룹 */
		    .search-right-group {
		        display: flex;
		        align-items: center;
		        gap: 5px; 
		    }
		
		    /* --- [핵심 수정] 모든 입력창/버튼 높이 38px로 강제 통일 --- */
		    
		    /* 1. 공통 스타일 (높이, 박스모델, 폰트) */
		    .input-date-fixed,
		    .search-select,
		    .search-input,
		    .btn-search,
		    .btn-reset,
		    .btn-custom-blue {
		        height: 38px !important;      /* 높이 강제 통일 */
		        line-height: 1.5;             
		        font-size: 13px;
		        box-sizing: border-box;       /* 테두리 포함 크기 계산 */
		        vertical-align: middle;
		        border-radius: 4px;
		    }
		
		    /* 2. 날짜 입력창 */
		    .input-date-fixed {
		        width: 150px;
		        padding: 0 10px;
		        color: #666;
		        display: inline-block;
		        border: 1px solid #ced4da;
		    }
		
		    /* 3. 우측 검색 드롭다운 */
		    .search-select {
		        width: 100px;                 /* 너비 고정 */
		        border: 1px solid #ced4da;
		        padding: 0 10px;
		        background-color: #fff;
		        cursor: pointer;
		        outline: none;
		    }
		    .search-select:focus {
		        border-color: #5c6bc0;
		    }
		
		    /* 4. 우측 검색어 입력창 */
		    .search-input {
		        width: 220px;                 /* 너비 조정 */
		        border: 1px solid #ced4da;
		        padding: 0 10px;
		        outline: none;
		    }
		    .search-input:focus {
		        border-color: #5c6bc0;
		    }
		
		    /* 5. 조회 버튼 */
		    .btn-search {
		        background-color: #fff;
		        border: 1px solid #5c6bc0;
		        color: #5c6bc0;
		        padding: 0 15px;              /* 좌우 패딩만 설정 (높이는 위에서 통일됨) */
		        transition: all 0.2s;
		        white-space: nowrap;
		        cursor: pointer;
		        display: inline-flex;         /* 텍스트 중앙 정렬용 */
		        align-items: center;
		        justify-content: center;
		    }
		    .btn-search:hover {
		        background-color: #5c6bc0;
		        color: white;
		    }
		
		    /* 6. 일정등록 버튼 (+일정) */
		    .btn-custom-blue {
		        background-color: #fff;
		        border: 1px solid #5c6bc0;
		        color: #5c6bc0;
		        padding: 0 15px;
		        transition: all 0.2s;
		        white-space: nowrap;
		        text-decoration: none;
		        display: inline-flex;         /* 아이콘+텍스트 중앙 정렬 */
		        align-items: center;
		        justify-content: center;
		        font-weight: 600;
		    }
		    .btn-custom-blue:hover {
		        background-color: #5c6bc0;
		        color: white;
		    }
		    
		    /* 7. 초기화 버튼 */
		    .btn-reset {
		        border: 1px solid #ced4da;
		        background: #fff;
		        color: #666;
		        width: 38px;                  /* 정사각형 */
		        padding: 0;
		        display: inline-flex;
		        align-items: center;
		        justify-content: center;
		        text-decoration: none;
		    }
		
		    /* --- 테이블 스타일 (기존 유지) --- */
		    .custom-table {
		        width: 100%;
		        border-collapse: collapse;
		        font-size: 14px;
		        border: 1px solid #e0e0e0;
		    }
		    .custom-table thead th {
		        background-color: #f8f9fa;
		        color: #495057;
		        font-weight: 600;
		        text-align: center;
		        border-bottom: 1px solid #dee2e6;
		        padding: 12px;
		        vertical-align: middle;
		    }
		    .custom-table tbody td {
		        padding: 12px;
		        border-bottom: 1px solid #f0f0f0;
		        color: #333;
		        vertical-align: middle;
		        text-align: center;
		    }
		    .custom-table tbody tr:hover {
		        background-color: #f1f3f5;
		    }
		    
		    /* 정렬 아이콘 */
		    .sort-icon {
		        font-size: 10px;
		        color: #aaa;
		        margin-left: 4px;
		        cursor: pointer;
		    }
		
		    /* No Data 스타일 */
		    .no-data {
		        text-align: center;
		        padding: 50px 0;
		        color: #adb5bd;
		        font-size: 14px;
		    }
		
		    /* 페이지네이션 */
		    .pagination {
		        display: flex !important;
		        list-style: none !important;
		        padding: 0;
		        margin: 0;
		        gap: 4px;
		        justify-content: center;
		    }
		    .pagination-container {
		        margin-top: 30px;
		        margin-bottom: 30px;
		        display: flex;
		        justify-content: center;
		    }
		    .pagination .page-link {
		        display: flex;
		        justify-content: center;
		        align-items: center;
		        width: 34px;
		        height: 34px;
		        color: #333;
		        background-color: #fff;
		        border: 1px solid #dee2e6;
		        border-radius: 4px;
		        font-size: 14px;
		        text-decoration: none;
		        transition: all 0.2s;
		    }
		    .pagination .page-item.active .page-link {
		        background-color: #5c6bc0;
		        border-color: #5c6bc0;
		        color: #fff;
		        z-index: 1;
		        font-weight: 600;
		    }
		    .pagination .page-link:hover {
		        background-color: #e9ecef;
		        color: #5c6bc0;
		        border-color: #dee2e6;
		    }
		    .pagination .page-link:focus { box-shadow: none; }
		    .pagination .page-item.disabled .page-link {
		        color: #ccc;
		        pointer-events: none;
		        background-color: #f8f9fa;
		    }
		
		    .header-control {
		        width: 100% !important;
		        padding-bottom: 10px;
		    }
		    .clickable-th {
		        cursor: pointer;
		        user-select: none;
		    }
		    .clickable-th:hover {
		        background-color: #e9ecef !important;
		    }
		</style>
    </th:block>
</head>
<body>

<div layout:fragment="content">
    <div class="page-container">
        
        <div class="page-header">
            <h2 class="page-title">일정관리</h2>
        </div>

        <div class="header-control mb-3">
            
            <form action="/schedule/list" method="get" id="searchForm">
                
                <input type="hidden" name="sortField" id="sortField" th:value="${sortField}">
                <input type="hidden" name="sortDir" id="sortDir" th:value="${sortDir}">
                <input type="hidden" name="page" id="page" value="1">

                <div class="search-left-group">
                    <input type="date" name="startDate" id="startDate" class="input-date-fixed" 
                           th:value="${searchParams.startDate != null ? #temporals.format(searchParams.startDate, 'yyyy-MM-dd') : ''}">
                    
                    <span class="fw-bold text-secondary">~</span>
                    
                    <input type="date" name="endDate" id="endDate" class="input-date-fixed"
                           th:value="${searchParams.endDate != null ? #temporals.format(searchParams.endDate, 'yyyy-MM-dd') : ''}">
                    
                    <button type="submit" class="btn btn-search">조회</button>
                    
                    <a th:href="@{/schedule/list}" class="btn-reset" title="초기화">
                        <i class="fa-solid fa-arrows-rotate"></i>
                    </a>
                </div>

                <div class="search-right-group" style="display: flex; align-items: center; gap: 4px;"> 
                	<select name="searchType" class="search-select">
				        <option value="title" th:selected="${searchParams.searchType == 'title'}">제목</option>
				        <option value="type" th:selected="${searchParams.searchType == 'type'}">종류</option>
				        <option value="content" th:selected="${searchParams.searchType == 'content'}">내용</option>
				        <option value="writer" th:selected="${searchParams.searchType == 'writer'}">작성자</option>
				    </select>
				
				    <input type="text" name="keyword" class="search-input" 
				           placeholder="검색어 입력" 
				           th:value="${searchParams.keyword}">
				    
				    <a th:href="@{/schedule/register}" class="btn btn-custom-blue">
				        <i class="fa-solid fa-plus" style="margin-right: 4px;"></i> 일정
				    </a>
				</div>

            </form>
        </div>

        <div class="table-responsive">
            <table class="table custom-table text-center">
                <thead>
                    <tr>
				        <th style="width: 60px;">No.</th>
				        
				        <th class="clickable-th" onclick="goSort('title')">
				            일정제목 
				            <span class="sort-icon" th:if="${sortField == 'title'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
				            <span class="sort-icon text-muted" th:unless="${sortField == 'title'}">▽</span>
				        </th>
				        
				        <th style="width: 80px;" class="clickable-th" onclick="goSort('type')">
				            종류 
				            <span class="sort-icon" th:if="${sortField == 'type'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
				            <span class="sort-icon text-muted" th:unless="${sortField == 'type'}">▽</span>
				        </th>
				        
				        <th style="width: 160px;" class="clickable-th" onclick="goSort('startDate')">
				            일정시작 
				            <span class="sort-icon" th:if="${sortField == 'startDate'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
				            <span class="sort-icon text-muted" th:unless="${sortField == 'startDate'}">▽</span>
				        </th>
				        
				        <th style="width: 160px;" class="clickable-th" onclick="goSort('endDate')">
				            일정마감 
				            <span class="sort-icon" th:if="${sortField == 'endDate'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
				            <span class="sort-icon text-muted" th:unless="${sortField == 'endDate'}">▽</span>
				        </th>
				        
				        <th style="width: 100px;" class="clickable-th" onclick="goSort('writer.name')">
				            작성자 
				            <span class="sort-icon" th:if="${sortField == 'writer.name'}" th:text="${sortDir == 'asc' ? '▲' : '▼'}"></span>
				            <span class="sort-icon text-muted" th:unless="${sortField == 'writer.name'}">▽</span>
				        </th>
				        
				        <th>내용</th> <th style="width: 80px;">상세</th>
				    </tr>
                </thead>
                <tbody>
                    <tr th:if="${schedules.totalElements == 0}">
				        <td colspan="8" class="no-data">
				            등록된 일정이 없습니다.
				        </td>
				    </tr>
				
				    <tr th:each="dto, state : ${schedules}">
				        <td th:text="${(schedules.number * schedules.size) + state.count}">1</td>
				        
				        <td class="fw-bold text-dark">
				            <span th:text="${dto.title}" class="text-decoration-none text-dark">
				                제목
				            </span>
				        </td>
				        
				        <td>
				            <span class="badge rounded-pill" 
				                  th:classappend="${dto.type == 'COMPANY' ? 'bg-danger' : 'bg-primary'}"
				                  th:text="${dto.type == 'COMPANY' ? '회사' : '개인'}">
				            </span>
				        </td>
				        <td th:text="${#temporals.format(dto.startDate, 'yyyy-MM-dd HH:mm')}"></td>
				        <td th:text="${#temporals.format(dto.endDate, 'yyyy-MM-dd HH:mm')}"></td>
				        <td th:text="${dto.writerName}"></td>
				        
				        <td class="text-muted text-truncate" style="max-width: 200px; margin: 0 auto;" th:text="${dto.content}">내용</td>
				        
				        <td>
				            <a th:href="@{/schedule/detail(id=${dto.id})}" class="btn btn-sm btn-outline-secondary" style="font-size: 12px;">상세</a>
				        </td>
				    </tr>
                </tbody>
            </table>
        </div>

        <div class="pagination-container" th:if="${schedules.totalElements > 0}">
            <nav aria-label="Page navigation">
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                        <a class="page-link" href="javascript:void(0)" th:onclick="'goPage(1)'">«</a>
                    </li>
                    
                    <li class="page-item" th:classappend="${schedules.first} ? 'disabled'">
                        <a class="page-link" href="javascript:void(0)" th:onclick="'goPage(' + ${currentPage - 1} + ')'">‹</a>
                    </li>

                    <li class="page-item" th:each="page: ${#numbers.sequence(startPage, endPage)}"
                        th:classappend="${page == currentPage} ? 'active'">
                        <a class="page-link" href="javascript:void(0)" th:text="${page}" th:onclick="'goPage(' + ${page} + ')'">1</a>
                    </li>

                    <li class="page-item" th:classappend="${schedules.last} ? 'disabled'">
                        <a class="page-link" href="javascript:void(0)" th:onclick="'goPage(' + ${currentPage + 1} + ')'">›</a>
                    </li>
                    
                    <li class="page-item" th:classappend="${currentPage == schedules.totalPages} ? 'disabled'">
                        <a class="page-link" href="javascript:void(0)" th:onclick="'goPage(' + ${schedules.totalPages} + ')'">»</a>
                    </li>
                </ul>
            </nav>
        </div>

    </div> 
</div>

<th:block layout:fragment="script">
    <script th:inline="javascript">
        // 페이지 이동 함수
        function goPage(page) {
            document.getElementById('page').value = page;
            document.getElementById('searchForm').submit();
        }
     	// 정렬 함수
        function goSort(field) {
            const currentField = document.getElementById('sortField').value;
            const currentDir = document.getElementById('sortDir').value;
            
            if (currentField === field) {
                document.getElementById('sortDir').value = (currentDir === 'asc') ? 'desc' : 'asc';
            } else {
                document.getElementById('sortField').value = field;
                document.getElementById('sortDir').value = 'desc';
            }

            document.getElementById('page').value = 1;
            document.getElementById('searchForm').submit();
        }
    </script>
</th:block>

</body>
</html>
