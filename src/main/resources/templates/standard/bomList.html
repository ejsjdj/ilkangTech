<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>제품 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap');

        body { background-color: #FFF5F7; font-family: 'Gamja Flower', cursive; }
        .diary-wrapper { display: flex; max-width: 900px; margin: 50px auto; }
        .diary-bookmarks { display: flex; flex-direction: column; gap: 10px; padding-top: 40px; }
        .bookmark { border: none; padding: 15px 20px; border-radius: 20px 0 0 20px; font-size: 1.1rem; cursor: pointer; transition: all 0.2s; box-shadow: -4px 4px 0px rgba(0,0,0,0.05); }
        .bookmark.pink { background-color: #FFDEE9; color: #FF8E9E; }
        .bookmark.yellow { background-color: #FEF9E7; color: #F7DC6F; }
        .bookmark.blue { background-color: #E0F7FA; color: #00BCD4; }
        .bookmark.active { transform: translateX(10px); font-weight: bold; box-shadow: none; }
        .diary-page { flex: 1; background: white; border: 5px solid #FFDEE9; border-radius: 40px; padding: 40px; min-height: 600px; position: relative; box-shadow: 15px 15px 0px #FFEDF2; }
        .masking-tape { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: rgba(173, 216, 230, 0.6); border-left: 2px dashed #fff; border-right: 2px dashed #fff; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-add-sticker { background: #FF8E9E; color: white; border: none; border-radius: 50px; padding: 8px 20px; box-shadow: 2px 4px 0px #FF5E7E; cursor: pointer; }
        .btn-add-bom { background: #F7DC6F; color: #8A6D3B; border: none; border-radius: 50px; padding: 5px 15px; box-shadow: 2px 4px 0px #E5C354; cursor: pointer; font-size: 0.9rem; }
        .cute-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .cute-table th { color: #FF8E9E; border-bottom: 2px solid #FFDEE9; padding: 10px; }
        .cute-table td { padding: 15px 10px; border-bottom: 1px solid #F0F0F0; }

        /* ✅ 페이지네이션 */
        .cute-pagination { display: flex; justify-content: center; gap: 8px; margin-top: 24px; }
        .cute-pagination button {
            border: 2px solid #FFDEE9;
            background: white;
            color: #FF8E9E;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-family: 'Gamja Flower', cursive;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .cute-pagination button:hover { background: #FFDEE9; }
        .cute-pagination button.active {
            background: #FF8E9E;
            color: white;
            border-color: #FF8E9E;
            font-weight: bold;
            box-shadow: 2px 3px 0px #FF5E7E;
        }
        .cute-pagination button:disabled { opacity: 0.35; cursor: not-allowed; }

        /* 모달 스타일 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.3); z-index: 9999; backdrop-filter: blur(3px); }
        .modal-diary-page { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 40px; border-radius: 30px; border: 4px solid #ADE8F4; box-shadow: 20px 20px 0px rgba(173, 232, 244, 0.5); }
        .yellow-tape { background: rgba(254, 249, 231, 0.8) !important; width: 100px !important; }
        .input-group-cute { margin-bottom: 20px; }
        .input-group-cute label { display: block; color: #FF8E9E; margin-bottom: 5px; }
        .input-group-cute input, .input-group-cute select { width: 100%; padding: 10px; border: 2px dashed #FFDEE9; border-radius: 10px; outline: none; }
        .modal-btns { display: flex; gap: 10px; margin-top: 30px; }
        .btn-sticker { flex: 1; border: none; padding: 10px; border-radius: 20px; color: white; font-weight: bold; cursor: pointer; }
        .btn-sticker.pink { background: #FF8E9E; }
        .btn-sticker.blue { background: #ADE8F4; color: #0077B6; }
    </style>
</head>
<body>

<div layout:fragment="content">
    <div class="diary-wrapper">
        <div class="diary-bookmarks">
            <button class="bookmark pink active" data-type="FG" onclick="showList(this)">완제품</button>
            <button class="bookmark yellow" data-type="WIP" onclick="showList(this)">중간제품</button>
            <button class="bookmark blue" data-type="RAW" onclick="showList(this)">원자재</button>
        </div>

        <div class="diary-page">
            <div class="masking-tape"></div>
            <div class="page-header">
                <h2 id="list-title">완제품 리스트</h2>
                <button type="button" id="openModalBtn" class="btn-add-sticker" onclick="openModal('addModal')">+ 신규 등록</button>
            </div>

            <table class="cute-table">
                <thead>
                <tr>
                    <th>제품코드</th>
                    <th>제품이름</th>
                    <th>제품타입</th>
                    <th>상세보기</th>
                </tr>
                </thead>
                <tbody id="list-body"></tbody>
            </table>

            <!-- ✅ 페이지네이션 영역 -->
            <div id="pagination" class="cute-pagination"></div>
        </div>
    </div>

    <!-- 1. 제품 등록 모달 -->
    <div id="addModal" class="modal-overlay">
        <div class="modal-diary-page" style="width: 450px;">
            <div class="masking-tape yellow-tape"></div>
            <h3>✨ 새 제품 등록</h3>
            <form id="addForm">
                <div class="input-group-cute">
                    <label>제품코드 <span class="text-danger">*</span></label>
                    <input type="text" id="newCode" placeholder="예: ITEM-001" required>
                </div>
                <div class="input-group-cute">
                    <label>제품이름 <span class="text-danger">*</span></label>
                    <input type="text" id="newName" placeholder="예: 최고급 원두" required>
                </div>
                <div class="input-group-cute">
                    <label>제품타입 <span class="text-danger">*</span></label>
                    <select id="newType" required>
                        <option value="FG">완제품</option>
                        <option value="WIP">중간제품</option>
                        <option value="RAW">원자재</option>
                    </select>
                </div>
                <div class="row">
                    <div class="col-6 input-group-cute">
                        <label>단위 (UOM)</label>
                        <input type="text" id="newUom" placeholder="예: EA, BOX" maxlength="10">
                    </div>
                    <div class="col-6 input-group-cute">
                        <label>기준단가 (₩)</label>
                        <input type="number" id="newPrice" placeholder="0" min="0">
                    </div>
                </div>
                <div class="modal-btns">
                    <button type="button" class="btn-sticker pink" onclick="closeModal('addModal')">닫기</button>
                    <button type="submit" class="btn-sticker blue">등록하기!</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 2. 상세조회 & BOM 리스트 모달 -->
    <div id="detailModal" class="modal-overlay">
        <div class="modal-diary-page" style="width: 550px;">
            <div class="masking-tape yellow-tape"></div>
            <h3>✨ 제품 상세 & BOM 정보</h3>
            <div id="detailContent" style="margin-bottom: 20px; background: #FEF9E7; padding: 15px; border-radius: 15px; border: 2px dashed #F7DC6F;"></div>
            <div style="display: flex; justify-content: space-between; align-items: center; border-top: 2px dashed #FFDEE9; padding-top: 20px;">
                <h5 style="color: #FF8E9E; font-weight: bold; margin: 0;">📦 소요 자재 (BOM)</h5>
                <button type="button" class="btn-add-bom" id="btnAddBom" onclick="openBomAddModal()">+ 자재 추가</button>
            </div>
            <div id="bomContent" style="max-height: 200px; overflow-y: auto; margin-bottom: 20px;">
                <table class="cute-table" style="font-size: 0.95rem; margin-top: 10px;">
                    <thead>
                    <tr>
                        <th style="position: sticky; top: 0; background: white;">자재코드</th>
                        <th style="position: sticky; top: 0; background: white;">자재이름</th>
                        <th style="position: sticky; top: 0; background: white;">소요수량</th>
                    </tr>
                    </thead>
                    <tbody id="bom-list-body"></tbody>
                </table>
            </div>
            <div class="modal-btns">
                <button type="button" class="btn-sticker pink" onclick="closeModal('detailModal')">닫기</button>
            </div>
        </div>
    </div>

    <!-- 3. BOM 추가용 서브 모달 -->
    <div id="bomAddModal" class="modal-overlay" style="z-index: 10000;">
        <div class="modal-diary-page" style="width: 400px; border-color: #F7DC6F;">
            <div class="masking-tape" style="background: rgba(255, 142, 158, 0.6);"></div>
            <h4 style="color: #8A6D3B;">🎀 새 자재 추가</h4>
            <form id="bomAddForm">
                <input type="hidden" id="childItemId">
                <input type="hidden" id="currentItemType">
                <div class="input-group-cute">
                    <label>추가될 제품 (Parent Item) <span class="text-danger">*</span></label>
                    <select id="parentItemId" required>
                        <option value="">-- 제품 선택 --</option>
                    </select>
                </div>
                <div class="input-group-cute">
                    <label>소요 수량 <span class="text-danger">*</span></label>
                    <input type="number" id="bomQuantity" min="1" placeholder="예: 2" required>
                </div>
                <div class="modal-btns">
                    <button type="button" class="btn-sticker pink" onclick="closeModal('bomAddModal')">취소</button>
                    <button type="submit" class="btn-sticker blue" style="background: #F7DC6F; color: #8A6D3B;">추가하기!</button>
                </div>
            </form>
        </div>
    </div>

    <script th:inline="javascript">
        'use strict';

        // ✅ 상태 중앙 관리
        const state = {
            currentType: 'FG',
            currentPage: 0,
            totalPages: 0
        };

        document.addEventListener('DOMContentLoaded', () => {
            loadList('FG', 0);

            document.getElementById('addForm')?.addEventListener('submit', handleAddSubmit);
            document.getElementById('bomAddForm')?.addEventListener('submit', handleBomAddSubmit);
        });

        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            if (modal) modal.style.display = 'block';
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) return;
            modal.style.display = 'none';
            modal.querySelector('form')?.reset();
        }

        function showList(element) {
            document.querySelectorAll('.bookmark').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            const type = element.dataset.type;
            const titleMap = { FG: '완제품 리스트', WIP: '중간제품 리스트', RAW: '원자재 리스트' };
            document.getElementById('list-title').textContent = titleMap[type] ?? '리스트';

            // ✅ 탭 전환 시 페이지 초기화
            loadList(type, 0);
        }

        // ✅ page 파라미터 추가
        async function loadList(type, page = 0) {
            const tbody = document.getElementById('list-body');
            if (!tbody) return;

            state.currentType = type;
            state.currentPage = page;

            try {
                const res = await fetch(`/api/item/list?type=${type}&page=${page}&size=10`);
                if (!res.ok) throw new Error(`서버 응답 오류 (HTTP ${res.status})`);

                const responseDto = await res.json();
                const pageData = responseDto.data;

                let items = [];
                if (pageData?.content) items = pageData.content;
                else if (Array.isArray(pageData)) items = pageData;
                else if (Array.isArray(responseDto)) items = responseDto;

                // ✅ totalPages 저장 후 페이지네이션 렌더링
                state.totalPages = pageData?.totalPages ?? 0;
                renderPagination();

                if (items.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:30px;">등록된 내역이 없어요 ☁️</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                items.forEach(item => {
                    const pk = item.itemId || item.id || item.item_id || '';
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${escapeHtml(item.itemCode ?? '')}</td>
                        <td>${escapeHtml(item.itemName ?? '')}</td>
                        <td>${escapeHtml(item.itemType ?? '')}</td>
                        <td><button class="btn-add-sticker" style="padding:2px 10px; font-size:0.8rem;"
                            onclick="loadDetail('${pk}')">상세보기</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error(err);
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:red;">${err.message}</td></tr>`;
            }
        }

        // ✅ 페이지네이션 렌더링
        function renderPagination() {
            const container = document.getElementById('pagination');
            if (!container) return;
            container.innerHTML = '';

            if (state.totalPages <= 1) return;

            const prevBtn = createPageBtn('‹', state.currentPage === 0, () =>
                loadList(state.currentType, state.currentPage - 1)
            );
            container.appendChild(prevBtn);

            const { start, end } = getPageWindow(state.currentPage, state.totalPages, 5);
            for (let i = start; i < end; i++) {
                const btn = createPageBtn(String(i + 1), false, () =>
                    loadList(state.currentType, i)
                );
                if (i === state.currentPage) btn.classList.add('active');
                container.appendChild(btn);
            }

            const nextBtn = createPageBtn('›', state.currentPage >= state.totalPages - 1, () =>
                loadList(state.currentType, state.currentPage + 1)
            );
            container.appendChild(nextBtn);
        }

        function createPageBtn(label, disabled, onClick) {
            const btn = document.createElement('button');
            btn.textContent = label;
            btn.disabled = disabled;
            if (!disabled) btn.addEventListener('click', onClick);
            return btn;
        }

        function getPageWindow(current, total, windowSize) {
            let start = Math.max(0, current - Math.floor(windowSize / 2));
            let end = start + windowSize;
            if (end > total) {
                end = total;
                start = Math.max(0, end - windowSize);
            }
            return { start, end };
        }

        async function handleAddSubmit(e) {
            e.preventDefault();
            const payload = {
                itemCode: document.getElementById('newCode')?.value.trim() ?? '',
                itemName: document.getElementById('newName')?.value.trim() ?? '',
                itemType: document.getElementById('newType')?.value ?? '',
                uom: document.getElementById('newUom')?.value.trim() ?? '',
                standardPrice: Number(document.getElementById('newPrice')?.value || 0)
            };

            try {
                const res = await fetch('/api/item', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error(`등록 실패 (HTTP ${res.status})`);

                alert('성공적으로 등록되었습니다! ✨');
                closeModal('addModal');
                // ✅ 등록 후 현재 페이지 유지
                loadList(state.currentType, state.currentPage);
            } catch (err) {
                alert(err.message);
            }
        }

        async function loadDetail(itemId) {
            if (!itemId || itemId === 'undefined' || itemId === 'null') {
                alert('해당 제품의 고유 ID 값을 찾을 수 없습니다.');
                return;
            }

            try {
                const res = await fetch(`/api/item/${itemId}`);
                if (!res.ok) throw new Error(`HTTP ${res.status} 오류`);
                const responseDto = await res.json();
                const item = responseDto.data ?? responseDto;

                document.getElementById('detailContent').innerHTML = `
                    <div class="row" style="line-height: 1.8;">
                        <div class="col-6"><strong>🔖 코드:</strong> ${escapeHtml(item.itemCode ?? '')}</div>
                        <div class="col-6"><strong>🏷️ 이름:</strong> ${escapeHtml(item.itemName ?? '')}</div>
                        <div class="col-6"><strong>📌 타입:</strong> ${escapeHtml(item.itemType ?? '')}</div>
                        <div class="col-6"><strong>📏 단위:</strong> ${escapeHtml(item.uom ?? '-')}</div>
                        <div class="col-12" style="margin-top: 8px;">
                            <strong>💰 기준단가:</strong> ${escapeHtml(item.standardPrice ? item.standardPrice.toLocaleString() + ' ₩' : '0 ₩')}
                        </div>
                    </div>
                `;

                document.getElementById('childItemId').value = itemId;
                document.getElementById('currentItemType').value = item.itemType;

                await loadBomList(itemId);
                openModal('detailModal');
            } catch (err) {
                alert(`상세 정보를 가져오는데 실패했습니다.\n사유: ${err.message}`);
            }
        }

        async function loadBomList(itemId) {
            const bomTbody = document.getElementById('bom-list-body');
            bomTbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">로딩 중... ☁️</td></tr>';

            try {
                const res = await fetch(`/api/bom/child/${itemId}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const responseDto = await res.json();
                const bomList = responseDto.data ?? [];

                if (bomList.length === 0) {
                    bomTbody.innerHTML = '<tr><td colspan="3" style="text-align:center; color:#999;">등록된 하위 자재(BOM)가 없습니다 🍃</td></tr>';
                    return;
                }

                bomTbody.innerHTML = '';
                bomList.forEach(bom => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${escapeHtml(bom.code || '-')}</td>
                        <td>${escapeHtml(bom.name || '-')}</td>
                        <td>${escapeHtml(bom.unit || 1)}</td>
                    `;
                    bomTbody.appendChild(tr);
                });
            } catch (err) {
                bomTbody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#FF8E9E;">조회 실패: ${err.message}</td></tr>`;
            }
        }

        async function openBomAddModal() {
            const selectBox = document.getElementById('parentItemId');
            selectBox.innerHTML = '<option value="">-- 자재 로딩 중... --</option>';
            openModal('bomAddModal');

            try {
                const currentType = document.getElementById('currentItemType').value;
                const res = await fetch(`/api/item/bomList?type=${currentType}&page=0&size=100`);
                const responseDto = await res.json();

                let items = [];
                if (responseDto.data?.content) items = responseDto.data.content;
                else if (Array.isArray(responseDto.data)) items = responseDto.data;
                else if (Array.isArray(responseDto)) items = responseDto;

                selectBox.innerHTML = '<option value="">-- 자재 선택 --</option>';
                items.forEach(item => {
                    const pk = item.itemId || item.id || item.item_id || '';
                    selectBox.innerHTML += `<option value="${pk}">[${item.itemCode}] ${item.itemName}</option>`;
                });
            } catch {
                selectBox.innerHTML = '<option value="">목록 로드 실패</option>';
            }
        }

        async function handleBomAddSubmit(e) {
            e.preventDefault();
            const parentId = document.getElementById('parentItemId').value;
            const childId = document.getElementById('childItemId').value;
            const requiredQty = document.getElementById('bomQuantity').value;

            if (!childId || !requiredQty) return;

            try {
                const res = await fetch('/api/bom/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        parentItemId: Number(parentId),
                        childItemId: Number(childId),
                        requiredQty: Number(requiredQty)
                    })
                });
                if (!res.ok) throw new Error(`BOM 등록 실패 (HTTP ${res.status})`);

                alert('자재가 쏙! 추가되었어요 🎀');
                closeModal('bomAddModal');
                await loadBomList(childId);
            } catch (err) {
                alert(err.message);
            }
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return String(unsafe).replace(/[&<"'>]/g, c =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' })[c]
            );
        }
    </script>
</div>
</body>
</html>
