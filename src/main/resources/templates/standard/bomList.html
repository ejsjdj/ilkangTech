<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <meta charset="UTF-8">
    <title>제품 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gamja+Flower&display=swap');

        body { background-color: #FFF5F7; font-family: 'Gamja Flower', cursive; }
        .diary-wrapper { display: flex; max-width: 900px; margin: 50px auto; }
        .diary-bookmarks { display: flex; flex-direction: column; gap: 10px; padding-top: 40px; }
        .bookmark { border: none; padding: 15px 20px; border-radius: 20px 0 0 20px; font-size: 1.1rem; cursor: pointer; transition: all 0.2s; box-shadow: -4px 4px 0px rgba(0,0,0,0.05); }
        .bookmark.pink { background-color: #FFDEE9; color: #FF8E9E; }
        .bookmark.yellow { background-color: #FEF9E7; color: #F7DC6F; }
        .bookmark.blue { background-color: #E0F7FA; color: #00BCD4; }
        .bookmark.active { transform: translateX(10px); font-weight: bold; box-shadow: none; }
        .diary-page { flex: 1; background: white; border: 5px solid #FFDEE9; border-radius: 40px; padding: 40px; min-height: 600px; position: relative; box-shadow: 15px 15px 0px #FFEDF2; }
        .masking-tape { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 120px; height: 35px; background: rgba(173, 216, 230, 0.6); border-left: 2px dashed #fff; border-right: 2px dashed #fff; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-add-sticker { background: #FF8E9E; color: white; border: none; border-radius: 50px; padding: 8px 20px; box-shadow: 2px 4px 0px #FF5E7E; cursor: pointer; }
        .cute-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .cute-table th { color: #FF8E9E; border-bottom: 2px solid #FFDEE9; padding: 10px; }
        .cute-table td { padding: 15px 10px; border-bottom: 1px solid #F0F0F0; }

        /* 모달 스타일 */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.3); z-index: 9999; backdrop-filter: blur(3px); }
        .modal-diary-page { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 40px; border-radius: 30px; border: 4px solid #ADE8F4; width: 400px; box-shadow: 20px 20px 0px rgba(173, 232, 244, 0.5); }
        .yellow-tape { background: rgba(254, 249, 231, 0.8) !important; width: 100px !important; }
        .input-group-cute { margin-bottom: 20px; }
        .input-group-cute label { display: block; color: #FF8E9E; margin-bottom: 5px; }
        .input-group-cute input, .input-group-cute select { width: 100%; padding: 10px; border: 2px dashed #FFDEE9; border-radius: 10px; outline: none; }
        .modal-btns { display: flex; gap: 10px; margin-top: 30px; }
        .btn-sticker { flex: 1; border: none; padding: 10px; border-radius: 20px; color: white; font-weight: bold; cursor: pointer; }
        .btn-sticker.pink { background: #FF8E9E; }
        .btn-sticker.blue { background: #ADE8F4; color: #0077B6; }
    </style>
</head>
<body>

<div layout:fragment="content">
    <div class="diary-wrapper">
        <div class="diary-bookmarks">
            <button class="bookmark pink active"
                    data-type="FG"
                    onclick="showList(this)">완제품</button>
            <button class="bookmark yellow"
                    data-type="WIP"
                    onclick="showList(this)">중간제품</button>
            <button class="bookmark blue"
                    data-type="RAW"
                    onclick="showList(this)">원자재</button>
        </div>

        <div class="diary-page">
            <div class="masking-tape"></div>
            <div class="page-header">
                <h2 id="list-title">완제품 리스트</h2>
                <button type="button" id="openModalBtn" class="btn-add-sticker">+ 신규 등록</button>
            </div>

            <table class="cute-table">
                <thead>
                <tr>
                    <th>제품코드</th>
                    <th>제품이름</th>
                    <th>제품타입</th>
                    <th>상세보기</th>
                </tr>
                </thead>
                <tbody id="list-body"></tbody>
            </table>
        </div>
    </div>

    <!-- 등록 모달 -->
    <div id="addModal" class="modal-overlay">
        <div class="modal-diary-page">
            <div class="masking-tape yellow-tape"></div>
            <h3>✨ 새 제품 등록</h3>

            <form id="addForm">
                <div class="input-group-cute">
                    <label>제품코드</label>
                    <input type="text" id="newCode" placeholder="제품 코드를 입력하세요" required>
                </div>
                <div class="input-group-cute">
                    <label>제품이름</label>
                    <input type="text" id="newName" placeholder="제품 이름을 입력하세요" required>
                </div>
                <div class="input-group-cute">
                    <label>제품타입</label>
                    <select id="newType" required>
                        <option value="FG">완제품</option>
                        <option value="WIP">중간제품</option>
                        <option value="RAW">원자재</option>
                    </select>
                </div>
                <div class="modal-btns">
                    <button type="button" class="btn-sticker pink" onclick="closeModal('addModal')">닫기</button>
                    <button type="submit" class="btn-sticker blue">등록하기!</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 상세 모달 -->
    <div id="detailModal" class="modal-overlay">
        <div class="modal-diary-page">
            <div class="masking-tape yellow-tape"></div>
            <h3>✨ 제품 상세 정보</h3>
            <div id="detailContent">
                <!-- 동적으로 채움 -->
            </div>
            <div class="modal-btns">
                <button type="button" class="btn-sticker pink" onclick="closeModal('detailModal')">닫기</button>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        'use strict';

        document.addEventListener('DOMContentLoaded', () => {
            loadList('FG');

            document.getElementById('openModalBtn')?.addEventListener('click', () => openModal('addModal'));
            document.getElementById('addForm')?.addEventListener('submit', handleAddSubmit);
        });

        function openModal(modalId) {
            document.getElementById(modalId).style.display = 'block';
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            const form = modal.querySelector('form');
            modal.style.display = 'none';
            form?.reset();
        }

        function showList(element) {
            document.querySelectorAll('.bookmark').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            const type = element.dataset.type;
            const title = type === 'FG' ? '완제품 리스트' : (type === 'WIP' ? '중간제품 리스트' : '원자재 리스트');
            document.getElementById('list-title').textContent = title;

            loadList(type);
        }

        function isSuccess(responseDto) {
            if (!responseDto) return false;
            if (responseDto.status === 200) return true;
            if (typeof responseDto.status === 'string' && responseDto.status.toUpperCase() === 'SUCCESS') return true;
            if (responseDto.success === true) return true;

            return false;
        }

        async function loadList(type) {
            const tbody = document.getElementById('list-body');
            if (!tbody) return;

            const url = `/api/item/list?type=${type}&page=0&size=10`;

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const responseDto = await res.json();
                console.log('서버 응답:', responseDto);

                // 🚨 수정됨: isSuccess 헬퍼 함수를 사용하여 안전하게 성공 여부 판단
                if (!isSuccess(responseDto)) {
                    alert(`로드 실패: ${responseDto.message || '알 수 없는 오류'}`);
                    return;
                }

                const items = responseDto.data?.content ?? [];

                tbody.innerHTML = items.length === 0
                    ? '<tr><td colspan="4" style="text-align:center; padding:30px;">등록된 내역이 없어요 ☁️</td></tr>'
                    : '';

                items.forEach(item => {
                    const tr = document.createElement('tr');

                    tr.innerHTML = `
                        <td>${escapeHtml(item.itemCode ?? '')}</td>
                        <td>${escapeHtml(item.itemName ?? '')}</td>
                        <td>${escapeHtml(item.itemType ?? '')}</td>
                        <td><button class="btn-add-sticker" style="padding:2px 10px; font-size:0.8rem;" onclick="loadDetail(${item.itemId})">상세보기</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (err) {
                console.error('리스트 로드 오류:', err);
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:red;">서버 연결 오류가 발생했습니다.</td></tr>';
            }
        }

        async function handleAddSubmit(e) {
            e.preventDefault();

            const payload = {
                itemCode: document.getElementById('newCode')?.value.trim() ?? '',
                itemName: document.getElementById('newName')?.value.trim() ?? '',
                itemType: document.getElementById('newType')?.value ?? ''
            };

            if (!payload.itemCode || !payload.itemName || !payload.itemType) {
                alert('필수 항목을 입력해주세요!');
                return;
            }

            try {
                const res = await fetch('/api/item', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error('등록 실패');

                const responseDto = await res.json();

                if (!isSuccess(responseDto)) throw new Error(responseDto.message);

                alert('성공적으로 등록되었습니다! ✨');
                closeModal('addModal');

                const active = document.querySelector('.bookmark.active');
                const reloadType = active?.dataset.type ?? 'FG';
                loadList(reloadType);
            } catch (err) {
                console.error('등록 오류:', err);
                alert(`등록 실패: ${err.message || '네트워크 오류가 발생했습니다.'}`);
            }
        }

        async function loadDetail(itemId) {
            try {
                const res = await fetch(`/api/item/${itemId}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const responseDto = await res.json();

                if (!isSuccess(responseDto)) throw new Error(responseDto.message);

                const item = responseDto.data;
                const content = document.getElementById('detailContent');

                content.innerHTML = `
                    <p><strong>제품코드:</strong> ${escapeHtml(item.itemCode ?? '')}</p>
                    <p><strong>제품이름:</strong> ${escapeHtml(item.itemName ?? '')}</p>
                    <p><strong>제품타입:</strong> ${escapeHtml(item.itemType ?? '')}</p>
                `;
                openModal('detailModal');
            } catch (err) {
                console.error('상세 로드 오류:', err);
                alert('상세 정보를 가져오는데 실패했습니다.');
            }
        }

        function escapeHtml(unsafe) {
            if (unsafe === null || unsafe === undefined) return '';
            return String(unsafe)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</div>

</body>
</html>
