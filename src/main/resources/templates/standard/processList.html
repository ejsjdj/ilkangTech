<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공정 코드 관리</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">

    <link rel="stylesheet" href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
    <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800;900&display=swap');

        body {
            background-color: #f8fafc;
            font-family: 'Noto Sans KR', sans-serif;
            color: #1e293b;
        }

        .content-root {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container-wrapper {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* 헤더 */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header-title-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon-bar {
            width: 4px;
            height: 22px;
            background: linear-gradient(to bottom, #4f46e5, #818cf8);
            border-radius: 2px;
        }

        .page-header h1 {
            font-size: 24px;
            font-weight: 800;
            margin: 0;
        }

        .page-subtitle {
            font-size: 13px;
            color: #64748b;
        }

        /* 검색 영역 */
        .search-filter-area {
            background: #ffffff;
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            display: flex;
            gap: 10px;
            align-items: center;
            margin-bottom: 16px;
        }

        .search-box {
            position: relative;
            flex: 1;
            max-width: 400px;
        }

        .search-box input {
            width: 100%;
            padding: 9px 14px 9px 38px;
            border: 1px solid #e2e8f0;
            background: #f8fafc;
            border-radius: 8px;
            font-size: 13px;
        }

        .btn-search {
            padding: 9px 20px;
            background: #4f46e5;
            color: #ffffff;
            border-radius: 8px;
            font-weight: 600;
            font-size: 13px;
            border: none;
        }

        .btn-reset {
            padding: 9px 14px;
            background: #ffffff;
            color: #64748b;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 13px;
        }

        .btn-primary,
        .btn-secondary {
            padding: 9px 14px;
            border-radius: 10px;
            font-weight: 700;
            border: 1px solid #d1d5db;
            background: #ffffff;
        }

        .btn-primary {
            background: #111827;
            color: #ffffff;
            border-color: #111827;
        }

        /* 그리드 wrapper */
        .grid-wrapper {
            background: #ffffff;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            padding: 16px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* 모달 */
        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(2px);
            z-index: 9998;
        }

        .modal {
            display: none;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) !important;
            z-index: 9999;
            width: min(520px, calc(100% - 40px));

            margin: 0;
            padding: 0;
            height: auto;
        }

        .modal-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .modal-header {
            padding: 14px 16px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
        }

        .modal-body {
            padding: 16px;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .form-row input {
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 14px;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 14px;
        }
    </style>
</head>

<body layout:fragment="content">

    <div class="content-root">
        <div class="container-wrapper">

            <!-- 헤더 -->
            <div class="page-header">
                <div class="header-title-area">
                    <div class="header-icon-bar"></div>
                    <div>
                        <h1>공정 코드 관리</h1>
                        <p class="page-subtitle">공정 코드 및 상태 관리</p>
                    </div>
                </div>

                <div>
                    <button id="saveStatusBtn" class="btn-secondary">저장</button>
                    <button id="openModalBtn" class="btn-primary">+ 신규 공정 등록</button>
                </div>
            </div>

            <!-- 검색 -->
            <div class="search-filter-area">
                <div class="search-box">
                    <i class="bi bi-search" style="position:absolute; top:10px; left:12px; color:#94a3b8;"></i>
                    <input type="text" id="searchKeyword" placeholder="공정코드 또는 공정명 검색" />
                </div>
                <button id="searchBtn" class="btn-search">검색</button>
                <button id="resetBtn" class="btn-reset">초기화</button>
            </div>

            <!-- 그리드 -->
            <div class="grid-wrapper">
                <div id="grid"></div>
            </div>

        </div>
    </div>

    <div class="modal-backdrop"></div>

    <div id="processModal" class="modal" style="display:none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3>공정코드 등록</h3>
                <button id="closeModalBtn" style="border:none;background:none;">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-row">
                    <label>공정코드</label>
                    <input type="text" id="operationCode" placeholder="OP-001" />
                </div>
                <div class="form-row">
                    <label>공정명</label>
                    <input type="text" id="processName" />
                </div>
                <div class="form-row">
                    <label>설명</label>
                    <input type="text" id="description" />
                </div>
                <div class="modal-footer">
                    <button id="saveProcessBtn" class="btn-primary">저장</button>
                </div>
            </div>
        </div>
    </div>

</body>

<th:block layout:fragment="script">
    <script src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
    <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
    <script th:src="@{/js/processList.js}"></script>
</th:block>

</html>
