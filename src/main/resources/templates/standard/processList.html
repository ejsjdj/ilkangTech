<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/layout}">

<head>
  <title>공정라우팅 관리</title>

  <link rel="stylesheet" href="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.css" />
  <link rel="stylesheet" href="https://uicdn.toast.com/grid/latest/tui-grid.css" />
</head>

<body layout:fragment="content">
  <div style="padding: 20px">
    <h2>라우트 목록</h2>
    <div id="grid"></div>
  </div>

  <div id="detailModal"
    style="display:none; position:fixed; top:50%; left:50%; transform: translate(-50%, -50%);
              width:750px; background:white; border:2px solid #333; padding:20px; z-index:1000; box-shadow: 0 0 10px rgba(0,0,0,0.5);">

    <h3>상세 공정 정보</h3>

    <div
      style="margin-bottom: 15px; background: #f8f9fa; padding: 10px; border-radius: 4px; display: flex; align-items: center; gap: 10px;">
      <label for="processSelect">공정 추가:</label>
      <select id="processSelect" style="padding: 5px; min-width: 250px;">
        <option value="">-- 공정을 선택하세요 --</option>
      </select>
      <button id="addProcessBtn"
        style="background-color: #28a745; color: white; border: none; padding: 5px 12px; cursor: pointer;">리스트에
        추가</button>
    </div>

    <div id="detailGrid"></div>

    <div style="margin-top:15px; text-align: right;">
      <button id="saveBtn"
        style="background-color: #007bff; color: white; border: none; padding: 5px 15px; cursor: pointer;">저장</button>
      <button onclick="document.getElementById('detailModal').style.display='none'">닫기</button>
    </div>
  </div>
</body>

<th:block layout:fragment="script">
  <script src="https://uicdn.toast.com/tui.pagination/latest/tui-pagination.js"></script>
  <script src="https://uicdn.toast.com/grid/latest/tui-grid.js"></script>
  <script th:src="@{/js/processList.js}"></script>
</th:block>

</html>
